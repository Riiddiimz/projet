name: Fix login fields

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update login fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text()
          old = '''{loginMode==='user'?<div className="space-y-3"><input id="userUsernameInput" value={name} onChange={e=>setName(e.target.value)} placeholder="Nom d'utilisateur" aria-label="Nom d'utilisateur" className="login-input w-full rounded-2xl px-4 py-3 outline-none"/><input id="passwordInput" type="password" value={code} onChange={e=>setCode(e.target.value)} placeholder="Code (facultatif)" aria-label="Code" className="login-input w-full rounded-2xl px-4 py-3 outline-none"/><button id="userLoginButton" onClick={()=>{const n=name.trim();if(!n){setError("Entrez un nom d'utilisateur.");return}send({type:'login',username:n,password:code,isAdmin:false})}} className="login-button flex w-full items-center justify-center gap-2 rounded-2xl py-3.5 font-black">Se connecter <ArrowRight size={18}/></button></div>:<div className="space-y-3"><input id="adminUsernameInput" value={name} onChange={e=>setName(e.target.value)} placeholder="Identifiant administrateur" aria-label="Identifiant administrateur" autoComplete="username" className="login-input w-full rounded-2xl px-4 py-3 outline-none"/><input id="adminPasswordInput" type="password" value={code} onChange={e=>setCode(e.target.value)} placeholder="Mot de passe administrateur" aria-label="Mot de passe administrateur" autoComplete="current-password" className="login-input w-full rounded-2xl px-4 py-3 outline-none"/><button id="adminLoginButton" onClick={()=>{const n=name.trim();if(!n){setError("Entrez l'identifiant administrateur.");return}if(!code){setError("Entrez le mot de passe administrateur.");return}send({type:'login',username:n,password:code,isAdmin:true})}} className="login-button login-admin-submit flex w-full items-center justify-center gap-2 rounded-2xl py-3.5 font-black"><Shield size={18}/> Se connecter en Admin</button></div>}'''
          new = '''{loginMode==='user'?<div className="space-y-3"><input id="userUsernameInput" value={name} onChange={e=>setName(e.target.value)} placeholder="Nom d'utilisateur" aria-label="Nom d'utilisateur" className="login-input w-full rounded-2xl px-4 py-3 outline-none"/><button id="userLoginButton" onClick={()=>{const n=name.trim();if(!n){setError("Entrez un nom d'utilisateur.");return}send({type:'login',username:n,password:'',isAdmin:false})}} className="login-button flex w-full items-center justify-center gap-2 rounded-2xl py-3.5 font-black">Se connecter <ArrowRight size={18}/></button></div>:<div className="space-y-3"><input id="adminUsernameInput" value={name} onChange={e=>setName(e.target.value)} placeholder="Nom d'utilisateur" aria-label="Nom d'utilisateur" autoComplete="username" className="login-input w-full rounded-2xl px-4 py-3 outline-none"/><input id="adminPasswordInput" type="password" value={code} onChange={e=>setCode(e.target.value)} placeholder="Code (facultatif)" aria-label="Code" autoComplete="current-password" className="login-input w-full rounded-2xl px-4 py-3 outline-none"/><button id="adminLoginButton" onClick={()=>{const n=name.trim();if(!n){setError("Entrez le nom d'utilisateur.");return}send({type:'login',username:n,password:code,isAdmin:true})}} className="login-button login-admin-submit flex w-full items-center justify-center gap-2 rounded-2xl py-3.5 font-black"><Shield size={18}/> Se connecter en Admin</button></div>}'''
          if old not in s:
              raise SystemExit('Expected login fields block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx .github/workflows/fix-login-fields.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: simplify user login and align admin fields'
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/fix-login-fields.yml
          git commit -m 'chore: remove one-time login fields workflow'
          git push
