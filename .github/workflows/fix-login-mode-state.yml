name: Fix login mode state

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert login mode state
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text(encoding='utf-8')
          marker="const [loginMode,setLoginMode]"
          if marker not in s:
              needle="const [user,setUser]=useState<User|null>(null),[name,setName]=useState(''),[code,setCode]=useState(''),[error,setError]=useState('');"
              if needle not in s:
                  raise SystemExit('state line not found')
              s=s.replace(needle, needle+"\n const [loginMode,setLoginMode]=useState<'user'|'admin'>('user');", 1)
              p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git diff --cached --quiet || git commit -m 'fix: add login mode state'
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/fix-login-mode-state.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove login state workflow'
          git push
