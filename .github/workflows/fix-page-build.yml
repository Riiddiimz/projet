name: Fix page build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed lobby header and enforce galaxy palette
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')
          broken = '<div><div className="text-[10px] text-emerald-400">● Connecté</div></div></header>'
          fixed = '<div><div className="text-[10px] text-emerald-400">● Connecté</div></div></div></header>'
          if broken in s:
              s = s.replace(broken, fixed, 1)

          # Remove the duplicate plain-text COL'INCALL label under the logo on the login screen.
          duplicate_logo = '<b className="text-2xl">COL&apos;IN<span className="text-violet-400">CALL</span></b>'
          s = s.replace(duplicate_logo, '', 1)

          # Replace the remaining login fuchsia Tailwind classes directly in JSX.
          replacements = {
              'bg-fuchsia-400/10': 'bg-violet-500/10',
              'text-fuchsia-200': 'text-violet-200',
              'text-fuchsia-400': 'text-violet-400',
              'bg-fuchsia-400': 'bg-violet-500',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          css = Path('app/galaxy.css')
          c = css.read_text(encoding='utf-8')

          # The previous negative z-index put the nebula behind the body's background.
          # Put the animated nebula in the page stacking context, behind the UI but above the body background.
          nebula_marker = '/* GALAXY NEBULA STACKING FIX */'
          if nebula_marker not in c:
              c += '''\n\n/* GALAXY NEBULA STACKING FIX */\nhtml, body { background: #03040b !important; }\nbody { position: relative !important; isolation: isolate !important; }\nbody::before { z-index: 0 !important; opacity: .95 !important; filter: blur(10px) saturate(125%) !important; }\nbody::after { z-index: 0 !important; opacity: .72 !important; }\nbody > * { position: relative; z-index: 1; }\n'''
              css.write_text(c, encoding='utf-8')

          pwa = Path('app/PwaInstall.tsx')
          ps = pwa.read_text(encoding='utf-8')
          ps = ps.replace('border border-fuchsia-300/25 bg-zinc-950/85', 'border border-cyan-300/25 bg-zinc-950/90')
          ps = ps.replace('text-fuchsia-100 shadow-[0_0_35px_rgba(217,70,239,.18)]', 'text-cyan-50 shadow-[0_0_35px_rgba(124,58,237,.28)]')
          pwa.write_text(ps, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/galaxy.css app/PwaInstall.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make galaxy nebula visible above page background'
          git push
