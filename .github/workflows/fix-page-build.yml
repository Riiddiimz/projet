name: Fix page build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed lobby header
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')
          broken = '<div><div className="text-[10px] text-emerald-400">● Connecté</div></div></header>'
          fixed = '<div><div className="text-[10px] text-emerald-400">● Connecté</div></div></div></header>'
          if broken in s:
              s = s.replace(broken, fixed, 1)
              p.write_text(s, encoding='utf-8')
              print('Lobby header repaired.')
          else:
              print('No malformed lobby header found; nothing to commit.')
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: close lobby header JSX'
          git push
