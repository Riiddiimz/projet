name: Fix Room Four Grid
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch room video grid
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          old="useEffect(()=>{if(!room)return;const grid=document.getElementById('videoGrid');if(!grid||!userRef.current)return;grid.innerHTML='';addLocalCard();participants.forEach(addRemoteCard);participants.forEach(offerUser)},[room,participants]);"
          new="useEffect(()=>{if(!room)return;const grid=document.getElementById('videoGrid');if(!grid||!userRef.current)return;grid.innerHTML='';for(let i=0;i<4;i++){const slot=document.createElement('div');slot.id='video-slot-'+i;slot.className='relative min-h-0 overflow-hidden rounded-2xl border border-white/10 bg-zinc-900/80';grid.append(slot)}addLocalCard();participants.forEach(addRemoteCard);participants.forEach(offerUser)},[room,participants]);"
          assert old in s, 'room effect not found'
          s=s.replace(old,new,1)
          old="function addLocalCard(){const grid=document.getElementById('videoGrid');if(!grid||!userRef.current)return;const card=document.createElement('div');card.id='video-card-'+userRef.current.id;card.className='relative aspect-video w-full overflow-hidden rounded-2xl border border-white/10 bg-black';const v=document.createElement('video');"
          new="function addLocalCard(){const slot=document.getElementById('video-slot-0');if(!slot||!userRef.current)return;const card=document.createElement('div');card.id='video-card-'+userRef.current.id;card.className='absolute inset-0 overflow-hidden rounded-2xl bg-black';const v=document.createElement('video');"
          assert old in s, 'local card start not found'
          s=s.replace(old,new,1)
          old="function addRemoteCard(u:User){const grid=document.getElementById('videoGrid');if(!grid||document.getElementById('video-card-'+u.id))return;const card=document.createElement('div');card.id='video-card-'+u.id;card.className='relative aspect-video w-full overflow-hidden rounded-2xl border border-white/10 bg-zinc-900';const v=document.createElement('video');"
          new="function addRemoteCard(u:User){const index=participants.findIndex(x=>x.id===u.id)+1;const slot=document.getElementById('video-slot-'+index);if(!slot||index>3||document.getElementById('video-card-'+u.id))return;const card=document.createElement('div');card.id='video-card-'+u.id;card.className='absolute inset-0 overflow-hidden rounded-2xl bg-zinc-900';const v=document.createElement('video');"
          assert old in s, 'remote card start not found'
          s=s.replace(old,new,1)
          old="<div id=\"videoGrid\" className=\"grid min-h-[55vh] grid-cols-1 gap-3 sm:grid-cols-2\"/>"
          new="<div id=\"videoGrid\" className=\"grid min-h-[65vh] grid-cols-2 grid-rows-2 gap-3\"/>"
          assert old in s, 'video grid markup not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify build
        run: |
          npm install
          npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet || git commit -m "feat: four equal room video slots"
          git push
