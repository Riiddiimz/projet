name: Apply WebRTC client fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Patch WebRTC client
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app/page.tsx';
          let s = fs.readFileSync(path, 'utf8');
          const oldPeer = "const peerFor=(id:string)=>{const existing=peers.current.get(id);if(existing)return existing;const p=new RTCPeerConnection({iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]});peers.current.set(id,p);pending.current.set(id,[]);localStream.current?.getTracks().forEach(t=>p.addTrack(t,localStream.current!));p.ontrack=e=>{const el=document.getElementById('remote-video-'+id) as HTMLVideoElement|null;if(el&&e.streams[0]){el.srcObject=e.streams[0];void el.play().catch(()=>{})}};p.onicecandidate=e=>{if(e.candidate)send({type:'candidate',targetId:id,candidate:e.candidate})};p.onconnectionstatechange=()=>{if(['failed','closed'].includes(p.connectionState))closePeer(id)};return p};";
          const newPeer = "const peerFor=(id:string)=>{const existing=peers.current.get(id);if(existing)return existing;const p=new RTCPeerConnection({iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]});peers.current.set(id,p);pending.current.set(id,[]);localStream.current?.getTracks().forEach(t=>p.addTrack(t,localStream.current!));p.ontrack=e=>{console.log('[WebRTC] track received',id,e.track.kind);const el=document.getElementById('remote-video-'+id) as HTMLVideoElement|null;if(el&&e.streams[0]){el.style.display='block';el.srcObject=e.streams[0];void el.play().catch(err=>console.warn('[WebRTC] video play',id,err))}};p.onicecandidate=e=>{if(e.candidate)send({type:'candidate',targetId:id,candidate:e.candidate})};p.onicecandidateerror=e=>console.warn('[WebRTC] ICE candidate error',id,e);p.oniceconnectionstatechange=()=>console.log('[WebRTC] ICE',id,p.iceConnectionState);p.onicegatheringstatechange=()=>console.log('[WebRTC] ICE gathering',id,p.iceGatheringState);p.onconnectionstatechange=()=>{console.log('[WebRTC] connection',id,p.connectionState);if(['failed','closed'].includes(p.connectionState))closePeer(id)};return p};";
          if (!s.includes(oldPeer)) throw new Error('peerFor pattern not found');
          s = s.replace(oldPeer,newPeer);
          const oldJoined = "else if(m.type==='room-joined'){setRoom(m.room);setParticipants(m.participants||m.users||[]);setRoomMessages([]);setRoomUnread(0);setUsersOpen(false);setRoomChatOpen(false);closePeers()}";
          const newJoined = "else if(m.type==='room-joined'){setRoom(m.room);setParticipants(m.participants||m.users||[]);setRoomMessages([]);setRoomUnread(0);setUsersOpen(false);setRoomChatOpen(false);closePeers();send({type:'media-state',microphoneEnabled:!!localStream.current?.getAudioTracks().some(t=>t.enabled),cameraEnabled:!!localStream.current?.getVideoTracks().some(t=>t.enabled)})}";
          if (!s.includes(oldJoined)) throw new Error('room-joined pattern not found');
          s = s.replace(oldJoined,newJoined);
          const oldCard = "v.autoplay=true;v.playsInline=true;v.className='absolute inset-0 h-full w-full object-cover';if(u.cameraEnabled===false)v.style.display='none';const label=";
          const newCard = "v.autoplay=true;v.playsInline=true;v.className='absolute inset-0 h-full w-full object-cover';const label=";
          if (!s.includes(oldCard)) throw new Error('remote card pattern not found');
          s = s.replace(oldCard,newCard);
          fs.writeFileSync(path,s);
          NODE
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix WebRTC media state and diagnostics'
          git push
