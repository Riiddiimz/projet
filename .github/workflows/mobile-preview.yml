name: Generate Mobile Screenshot

on:
  workflow_dispatch:
  deployment_status:

jobs:
  screenshot:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.deployment_status.state == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Capture mobile screenshot
        env:
          SITE_URL: https://gcol.vercel.app/
        run: |
          node <<'EOF'
          const { chromium, devices } = require('playwright');

          (async () => {
            const browser = await chromium.launch();

            const context = await browser.newContext({
              ...devices['iPhone 13'],
              permissions: []
            });

            const page = await context.newPage();

            page.on('console', message => {
              console.log(
                `[CONSOLE ${message.type()}] ${message.text()}`
              );
            });

            page.on('pageerror', error => {
              console.error('[PAGE ERROR]', error.message);
            });

            console.log(`Ouverture de : ${process.env.SITE_URL}`);

            await page.goto(process.env.SITE_URL, {
              waitUntil: 'networkidle',
              timeout: 60000
            });

            console.log(`Page chargée : ${await page.title()}`);

            await page.screenshot({
              path: 'mobile-preview.png',
              fullPage: true
            });

            await browser.close();

            console.log('Capture terminée.');
          })();
          EOF

      - name: Upload mobile preview
        uses: actions/upload-artifact@v5
        with:
          name: mobile-preview
          path: mobile-preview.png
          retention-days: 7
