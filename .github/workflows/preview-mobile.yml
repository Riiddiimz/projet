name: Generate Mobile Screenshot

on:
  deployment_status:

jobs:
  screenshot:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Take Mobile Screenshot
        run: |
          node -e "
          const { chromium, devices } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const context = await browser.newContext(devices['iPhone 13']);
            const page = await context.newPage();
            await page.goto('${{ github.event.deployment_status.target_url }}', { waitUntil: 'networkidle' });
            await page.screenshot({ path: 'mobile.png', fullPage: true });
            await browser.close();
          })();
          "

      - name: Upload Image to Cloudinary / Service externe
        run: |
          # Alternative simple sans stockage tiers : commit l'image sur une branche 'previews'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b mobile-preview-branch || git checkout mobile-preview-branch
          git add mobile.png
          git commit -m "update mobile preview" || exit 0
          git push origin mobile-preview-branch --force
