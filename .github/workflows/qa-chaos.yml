name: Col'inCall Chaos QA

on:
  workflow_dispatch:
  deployment_status:

jobs:
  qa-chaos:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run chaos QA
        env:
          SITE_URL: https://gcol.vercel.app/
          QA_USER_A: QA_CHAOS_A_${{ github.run_id }}
          QA_USER_B: QA_CHAOS_B_${{ github.run_id }}
          QA_USER_C: QA_CHAOS_C_${{ github.run_id }}
          QA_PASSWORD: qa-test-password
        run: node tests/qa-chaos.cjs

      - name: Upload chaos QA report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: colincall-chaos-report
          path: qa-results/
          retention-days: 14
