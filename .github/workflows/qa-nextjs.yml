name: Col'inCall Next.js Migration QA

on:
  workflow_dispatch:
  push:
    branches:
      - migration-nextjs

jobs:
  qa-nextjs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build

      - name: Start Next.js
        run: npm run start -- -p 3000 > /tmp/next.log 2>&1 &

      - name: Wait for Next.js
        run: npx playwright install --with-deps chromium && npx wait-on http://127.0.0.1:3000

      - name: Run migration smoke QA
        run: node tests/qa-nextjs.cjs

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colincall-nextjs-migration-report
          path: qa-results/nextjs
          if-no-files-found: warn

      - name: Show Next.js logs on failure
        if: failure()
        run: cat /tmp/next.log
