name: Col'inCall Rooms + WebRTC QA

on:
  workflow_dispatch:
  deployment_status:

jobs:
  qa-rooms-webrtc:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run rooms + WebRTC QA
        env:
          SITE_URL: https://gcol.vercel.app/
          QA_USER_A: QA_A_${{ github.run_id }}
          QA_USER_B: QA_B_${{ github.run_id }}
        run: node tests/qa-rooms-webrtc.cjs

      - name: Upload rooms/WebRTC QA report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: colincall-rooms-webrtc-report
          path: qa-results/
          retention-days: 14
