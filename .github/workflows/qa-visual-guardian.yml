name: Col'inCall Visual Guardian

on:
  push:
    branches: [wow-overhaul, main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Audit and patch safe dependency fixes
        run: npm audit fix --audit-level=high || true

      - name: Build Next.js
        run: npm run build

      - name: Start Next.js
        run: npm run start -- -p 3000 > /tmp/next.log 2>&1 &

      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Next.js did not start in time. Logs:"
          test -f /tmp/next.log && cat /tmp/next.log || true
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual positioning guardian
        env:
          SITE_URL: http://127.0.0.1:3000
        run: node tests/qa-visual-guardian.cjs

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: colincall-visual-guardian
          path: qa-results/visual-guardian
          retention-days: 21
          if-no-files-found: warn

      - name: Dump Next.js log on failure
        if: failure()
        run: |
          echo "=== Next.js log ==="
          test -f /tmp/next.log && cat /tmp/next.log || echo "No Next.js log was created."
