name: Wire Redis sessions

on:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "lib/redis.js"
      - "package.json"
      - ".github/workflows/wire-redis-sessions.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire Redis session store
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text()
          marker = '// REDIS_SESSIONS_WIRED'
          if marker in s:
              print('Already wired')
              raise SystemExit(0)

          s = s.replace(
              'const { supabaseAdmin, supabaseConfigured } = require("./lib/supabase");',
              'const { supabaseAdmin, supabaseConfigured } = require("./lib/supabase");\nconst { redis, redisConfigured } = require("./lib/redis");'
          )

          s = s.replace(
              'const sessions = new Map();',
              'const sessions = new Map(); // local fallback when Redis is unavailable'
          )

          start = s.index('function invalidateUserSessions(userId) {')
          end = s.index('\nfunction leaveRoom(user) {', start)
          replacement = r'''// REDIS_SESSIONS_WIRED
const SESSION_PREFIX = "colincall:session:";

async function invalidateUserSessions(userId) {
  if (redisConfigured && redis) {
    try {
      const token = await redis.get(`${SESSION_PREFIX}user:${userId}`);
      if (token) await redis.del(`${SESSION_PREFIX}${token}`);
      await redis.del(`${SESSION_PREFIX}user:${userId}`);
      return;
    } catch (error) {
      console.error("[Redis] invalidate session", error);
    }
  }
  for (const [token, session] of sessions) if (session.userId === userId) sessions.delete(token);
}

async function getStoredSession(token) {
  if (redisConfigured && redis) {
    try {
      return await redis.get(`${SESSION_PREFIX}${token}`);
    } catch (error) {
      console.error("[Redis] get session", error);
    }
  }
  return sessions.get(token) || null;
}

async function createSession(user) {
  await invalidateUserSessions(user.id);
  const token = crypto.randomBytes(32).toString("hex");
  const session = { userId: user.id, createdAt: Date.now() };
  if (redisConfigured && redis) {
    try {
      const ttlSeconds = Math.floor(SESSION_TTL_MS / 1000);
      await redis.set(`${SESSION_PREFIX}${token}`, session, { ex: ttlSeconds });
      await redis.set(`${SESSION_PREFIX}user:${user.id}`, token, { ex: ttlSeconds });
      return token;
    } catch (error) {
      console.error("[Redis] create session", error);
    }
  }
  sessions.set(token, session);
  return token;
}'''
          s = s[:start] + replacement + s[end:]

          s = s.replace('const session = sessions.get(token);', 'const session = await getStoredSession(token);')
          s = s.replace('const token = createSession(user);', 'const token = await createSession(user);')
          s = s.replace('invalidateUserSessions(user.id);', 'await invalidateUserSessions(user.id);')
          # The replacement above can only occur inside async functions; restore the
          # helper itself is already async and createSession awaits its helper.
          s = s.replace('async function createSession(user) {\n  await await invalidateUserSessions(user.id);', 'async function createSession(user) {\n  await invalidateUserSessions(user.id);')

          # Session invalidation on a kicked user must also hit Redis.
          s = s.replace('invalidateUserSessions(target.id);', 'await invalidateUserSessions(target.id);')

          # Redis health visibility without exposing credentials.
          s = s.replace(
              'supabaseConfigured, turnConfigured:',
              'supabaseConfigured, redisConfigured, turnConfigured:'
          )

          p.write_text(s)
          PY

      - name: Validate syntax
        run: node --check server.js

      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git add server.js
          git commit -m "feat: use Upstash Redis for sessions"
          git push
