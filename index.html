<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASCII Studio</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #08090d;
    --card: rgba(255,255,255,0.055);
    --border: rgba(255,255,255,0.09);
    --text: #f7f7f8;
    --muted: #8e919b;
    --accent: #ffffff;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(130, 100, 255, .18),
            transparent 35%
        ),
        radial-gradient(
            circle at 100% 70%,
            rgba(0, 200, 255, .08),
            transparent 30%
        ),
        var(--bg);

   APP
============================== */

.app {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px 60px;
}


/* ==============================
   HEADER
============================== */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 28px;
}

.logo {
    display: flex;
    align-items: center;

}

.logo-icon {
    width: 40px;
    height: 40px;

    display: grid;
    place-items: center;

    border-radius: 12px;

    background: linear-gradient(

    );

}

.badge {

    border: 1px solid var(--border);

    font-size: 12px;
}


/* ==============================
   HERO
============================== */

.hero {
    margin-bottom: 25px;
}

.hero h1 {
    font-size: clamp(34px, 6vw, 64px);

    line-height: .95;

    letter-spacing: -3px;

    margin-bottom: 14px;
}

.hero h1 span {
    background: linear-gradient(
        90deg,
        #fff,
        #888
    );

}

.hero p {
    color: var(--muted);

    font-size: 15px;

    max-width: 520px;

    line-height: 1.6;
}


/* ==============================
   MAIN GRID
============================== */

.workspace {

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

    gap: 18px;
}


/* ==============================
   CARDS
============================== */

.card {

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 24px;

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.25);

    overflow: hidden;
}

.card-header {

    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 18px 20px;

    border-bottom: 1px solid var(--border);
}

.card-title {

    font-size: 13px;

    font-weight: 700;

    letter-spacing: .2px;
}

.card-status {

    display: flex;
    align-items: center;

    gap: 7px;

    color: var(--muted);

    font-size: 11px;
}

.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #555;
}

.status-dot.active {

    background: #4ade80;

    box-shadow:
        0 0 12px #4ade80;
}


/* ==============================
   CAMERA
============================== */

.camera {

    position: relative;

    aspect-ratio: 4 / 3;

    background: #030303;

    overflow: hidden;
}

video {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}


/* CAMERA CORNERS */

.camera::before,
.camera::after {

    content: "";

    position: absolute;

    width: 30px;
    height: 30px;

    border-color: rgba(255,255,255,.6);

    pointer-events: none;
}

.camera::before {

    top: 20px;
    left: 20px;

    border-top: 2px solid;
    border-left: 2px solid;
}

.camera::after {

    bottom: 20px;
    right: 20px;

    border-bottom: 2px solid;
    border-right: 2px solid;
}


/* SCAN LINE */

.scan-line {

    position: absolute;

    left: 0;
    right: 0;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    top: 0;

    opacity: 0;

    pointer-events: none;
}

.camera.active .scan-line {

    opacity: 1;

    animation:
        scan 3s infinite ease-in-out;
}

@keyframes scan {

    0% {
        top: 0%;
    }

    50% {
        top: 100%;
    }

    100% {
        top: 0%;
    }
}


/* ==============================
   CAMERA CONTROLS
============================== */

.controls {

    padding: 18px;

    gap: 10px;
}

button {

    cursor: pointer;

    transition:

        background .2s;
}

button:active {

    transform: scale(.96);
}

.primary {

    min-height: 54px;

    border-radius: 16px;

    background: #fff;

    color: #08090d;

    font-weight: 800;

    font-size: 14px;

    box-shadow:

}

.primary:hover {
    background: #e9e9e9;
}

.icon-button {

    width: 54px;
    height: 54px;

    border-radius: 16px;

    background: rgba(255,255,255,.06);

    border: 1px solid var(--border);

    color: white;

    font-size: 18px;
}

.icon-button:hover {

    background:
        rgba(255,255,255,.1);
}


/* ==============================
   SETTINGS
============================== */

.settings {

    padding: 0 18px 18px;
}

.setting {

    padding: 14px 0;

    border-top:
        1px solid rgba(255,255,255,.06);
}

.setting-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 10px;
}

.setting label {

    font-size: 12px;

    color: var(--muted);
}

.value {

    font-family:
        "Space Mono",
        monospace;

    font-size: 11px;
}

input[type="range"] {

    width: 100%;

    accent-color: white;

    cursor: pointer;
}


/* ==============================
   ASCII RESULT
============================== */

.result-card {

    min-height: 100%;
}

.ascii-wrapper {

    height: calc(100% - 58px);

    min-height: 430px;

    padding: 18px;

    overflow: auto;

    background:
        radial-gradient(
            circle at center,

        );
}

.ascii-placeholder {

    height: 100%;

.placeholder-icon {

.ascii {

    font-size: 5px;

    color: #fff;

    letter-spacing: 0;

    display: none;
}


/* ==============================
   BOTTOM
============================== */

.bottom-bar {

    margin-top: 18px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    color: #666;

    font-size: 11px;
}

.bottom-actions {

    display: flex;

    gap: 8px;
}

.small-button {

    padding: 9px 13px;

    border-radius: 10px;

    background: rgba(255,255,255,.04);

    color: #aaa;

    border: 1px solid var(--border);

    font-size: 11px;
}

.small-button:hover {

    color: white;

    background: rgba(255,255,255,.08);
}


/* ==============================
   MOBILE
============================== */

@media(max-width: 800px) {

    .app {

        padding:
            22px
            15px
            40px;
    }

    .workspace {

        grid-template-columns: 1fr;
    }

    .hero h1 {

        font-size: 43px;

    }

    .ascii-wrapper {

        min-height: 350px;
    }

    .ascii-placeholder {

        min-height: 320px;
    }

    .ascii {

        font-size: 3px;
        line-height: 3px;
    }

}


/* ==============================
   ANIMATION
============================== */

.card {

    animation:
        appear .5s ease both;
}

.result-card {

    animation-delay: .1s;
}

@keyframes appear {

    from {

        opacity: 0;

        transform:
            translateY(10px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* ==============================
   HIDDEN
============================== */

.hidden {
    display: none !important;
}

</style>
</head>


<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            <div class="logo-icon">
                ✦
            </div>

            ASCII Studio

        </div>

        <div class="badge">
            CAMERA → ASCII
        </div>

    </header>


    <!-- HERO -->

    <section class="hero">

        <h1>
            Turn reality<br>
            <span>into ASCII.</span>
        </h1>

        <p>
            Capture an image with your camera
            and transform it instantly into
            a unique ASCII artwork.
        </p>

    </section>


    <!-- WORKSPACE -->

    <main class="workspace">


        <!-- CAMERA CARD -->

        <section class="card">

            <div class="card-header">

                <div class="card-title">
                    CAMERA
                </div>

                <div class="card-status">

                    <span
                        id="statusDot"
                        class="status-dot">
                    </span>

                    <span id="statusText">

                    </span>

                </div>

            </div>

                class="camera">

                <video
                    id="video"
                    autoplay
                    playsinline>
                </video>

                    id="switch"

                    title="Changer de caméra">

                </button>

            </div>

                <div class="setting">

                    <div class="setting-row">

                        <label>

                        </label>

                        <span
                            id="densityValue"
                            class="value">
                            100
                        </span>

                    </div>

                        id="density"
                        type="range"
                        min="40"
                        max="160"
                        value="100">

<script>


// ============================================
// ELEMENTS
// ============================================

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ascii =
    document.getElementById("ascii");

const placeholder =
    document.getElementById("placeholder");

const capture =
    document.getElementById("capture");

const switchButton =
    document.getElementById("switch");

const density =
    document.getElementById("density");

const densityValue =
    document.getElementById("densityValue");

const cameraContainer =
    document.getElementById("cameraContainer");

const statusDot =
    document.getElementById("statusDot");

const statusText =
    document.getElementById("statusText");

const resolution =
    document.getElementById("resolution");

const copyButton =
    document.getElementById("copy");

const downloadButton =
    document.getElementById("download");


let stream = null;

let facingMode = "environment";


// ============================================
// CAMERA
// ============================================

async function startCamera() {

    try {

        if (stream) {

            stream
                .getTracks()
                .forEach(track =>
                    track.stop()
                );

        }


        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            facingMode,

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }

                    },

                    audio: false

                });


        video.srcObject = stream;


        cameraContainer
            .classList
            .add("active");


        statusDot
            .classList
            .add("active");


        statusText.textContent =
            "Live";


        capture.disabled = false;


    } catch(error) {

        console.error(error);

        statusText.textContent =
            "Camera unavailable";

        alert(
            "Impossible d'accéder à la caméra.\n\n" +
            "Vérifie que ton navigateur a " +
            "l'autorisation d'utiliser la caméra."
        );

    }

}


// ============================================
// SWITCH CAMERA
// ============================================

switchButton.addEventListener(
    "click",
    async () => {

        facingMode =
            facingMode === "environment"
            ? "user"
            : "environment";

        await startCamera();

    }
);


// ============================================
// CAPTURE
// ============================================

capture.addEventListener(
    "click",
    () => {

        if (!video.videoWidth) {

            startCamera();

            return;

        }


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        const ctx =
            canvas.getContext("2d");


        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        createASCII();

    }
);


// ============================================
// ASCII
// ============================================

function createASCII() {

    const targetWidth =
        Number(density.value);


    const ratio =
        canvas.height /
        canvas.width;


    const targetHeight =
        Math.floor(
            targetWidth *
            ratio *
            0.48
        );


    const smallCanvas =
        document.createElement("canvas");


    smallCanvas.width =
        targetWidth;

    smallCanvas.height =
        targetHeight;


    const ctx =
        smallCanvas.getContext("2d");


    ctx.drawImage(
        canvas,
        0,
        0,
        targetWidth,
        targetHeight
    );


    const imageData =
        ctx.getImageData(
            0,
            0,
            targetWidth,
            targetHeight
        );


    const pixels =
        imageData.data;


    /*
       Plus le caractère est dense,
       plus la zone est sombre.
    */

    const characters =
        "@#8&o:*. ";


    let result = "";


    for (
        let y = 0;
        y < targetHeight;
        y++
    ) {

        for (
            let x = 0;
            x < targetWidth;
            x++
        ) {

            const index =
                (y *
                targetWidth +
                x) * 4;


            const r =
                pixels[index];

            const g =
                pixels[index + 1];

            const b =
                pixels[index + 2];


            // luminosité perceptuelle

            const brightness =
                0.2126 * r +
                0.7152 * g +
                0.0722 * b;


            const charIndex =
                Math.floor(

                    brightness /
                    255 *
                    (characters.length - 1)

                );


            result +=
                characters[charIndex];

        }


        result += "\n";

    }


    ascii.textContent =
        result;


    placeholder.style.display =
        "none";


    ascii.style.display =
        "block";


    resolution.textContent =
        targetWidth +
        " × " +
        targetHeight;


    statusText.textContent =
        "Artwork captured";


    // petit feedback visuel

    capture.textContent =
        "✓ Artwork captured";


    setTimeout(() => {

        capture.textContent =
            "✦ Capture artwork";

    }, 1200);

}


// ============================================
// DENSITY
// ============================================

density.addEventListener(
    "input",
    () => {

        densityValue.textContent =
            density.value;


        // Si une image existe,
        // on la recalcule

        if (
            ascii.textContent.trim()
        ) {

            createASCII();

        }

    }
);


// ============================================
// COPY
// ============================================

copyButton.addEventListener(
    "click",
    async () => {

        const text =
            ascii.textContent;


        if (!text.trim()) {

            return;

        }


        try {

            await navigator
                .clipboard
                .writeText(text);


            copyButton.textContent =
                "✓ Copied";


            setTimeout(() => {

                copyButton.textContent =
                    "Copy ASCII";

            }, 1200);


        } catch(error) {

            alert(
                "Impossible de copier le dessin."
            );

        }

    }
);


// ============================================
// DOWNLOAD
// ============================================

downloadButton.addEventListener(
    "click",
    () => {

        const text =
            ascii.textContent;


        if (!text.trim()) {

            return;

        }


        const blob =
            new Blob(
                [text],
                {
                    type:
                        "text/plain"
                }
            );


        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href =
            url;

        link.download =
            "ascii-art.txt";


        link.click();


        URL.revokeObjectURL(url);

    }
);


// ============================================
// START
// ============================================

capture.disabled = false;

startCamera();


</script>

</body>
</html>
