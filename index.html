<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Col'inCall</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #080a10;
    --panel: #111521;
    --panel2: #181d2a;
    --border: #293143;
    --text: #f4f7fb;
    --muted: #8993a7;
    --accent: #6c63ff;
    --danger: #e5484d;
    --success: #28c76f;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1a2033, var(--bg) 50%);
    color: var(--text);
    font-family: Arial, sans-serif;
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.hidden {
    display: none !important;
}

.screen {
    min-height: 100vh;
    padding: 24px;
}

.center {
    display: flex;
    align-items: center;
    justify-content: center;
}

.panel {
    width: 100%;
    max-width: 520px;
    padding: 30px;
    background: rgba(17, 21, 33, .94);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: 0 20px 80px rgba(0,0,0,.35);
}

h1,
h2,
h3 {
    margin-top: 0;
}

.logo {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
}

.subtitle {
    color: var(--muted);
    margin-bottom: 25px;
}

input,
textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: #0b0f18;
    color: white;
    padding: 15px 16px;
    outline: none;
}

input:focus,
textarea:focus {
    border-color: var(--accent);
}

textarea {
    min-height: 110px;
    resize: vertical;
}

.field {
    margin-bottom: 16px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 14px;
}

.btn {
    border: 0;
    border-radius: 13px;
    padding: 14px 18px;
    color: white;
    background: var(--accent);
    font-weight: 700;
}

.btn.secondary {
    background: var(--panel2);
    border: 1px solid var(--border);
}

.btn.danger {
    background: var(--danger);
}

.btn.success {
    background: var(--success);
    color: #06130c;
}

.btn.full {
    width: 100%;
}

.choice-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.choice {
    padding: 25px 15px;
    border: 1px solid var(--border);
    background: var(--panel2);
    border-radius: 18px;
    color: white;
    text-align: center;
}

.choice:hover {
    border-color: var(--accent);
}

.choice-icon {
    display: block;
    font-size: 34px;
    margin-bottom: 10px;
}

.error {
    color: #ff7479;
    margin: 12px 0;
    font-size: 14px;
}

.topbar {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 0 22px;
    background: rgba(17, 21, 33, .94);
    border-bottom: 1px solid var(--border);
}

.topbar-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.topbar .logo {
    margin: 0;
    font-size: 22px;
}

.avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: linear-gradient(135deg, #6c63ff, #a855f7);
    color: white;
    font-weight: bold;
    border: 2px solid var(--border);
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.profile-button {
    border: 0;
    background: transparent;
    color: white;
    display: flex;
    align-items: center;
    gap: 10px;
}

.layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    min-height: calc(100vh - 70px);
}

.main-content {
    padding: 24px;
}

.search {
    font-size: 17px;
    min-height: 56px;
    margin-bottom: 20px;
}

.rooms {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
}

.room-card {
    padding: 20px;
    border-radius: 18px;
    background: var(--panel);
    border: 1px solid var(--border);
}

.room-card:hover {
    border-color: var(--accent);
}

.room-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 12px;
}

.room-count {
    color: var(--muted);
    margin-bottom: 18px;
}

.sidebar {
    border-left: 1px solid var(--border);
    background: rgba(12, 15, 24, .8);
    padding: 20px;
}

.chat-messages {
    height: calc(100vh - 190px);
    overflow-y: auto;
    margin-bottom: 12px;
}

.chat-message {
    margin-bottom: 13px;
    padding: 10px 12px;
    background: var(--panel2);
    border-radius: 12px;
}

.chat-author {
    color: #a9a3ff;
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 5px;
}

.chat-text {
    overflow-wrap: anywhere;
}

.chat-form {
    display: flex;
    gap: 8px;
}

.chat-form input {
    min-width: 0;
}

.room-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    min-height: calc(100vh - 70px);
}

.video-area {
    padding: 16px;
    position: relative;
}

.video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 15px;
    padding-bottom: 90px;
}

.video-card {
    position: relative;
    overflow: hidden;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: #05070b;
    aspect-ratio: 16 / 9;
}

.video-card video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    background: #05070b;
}

.video-label {
    position: absolute;
    left: 12px;
    bottom: 12px;
    background: rgba(0,0,0,.7);
    padding: 8px 11px;
    border-radius: 10px;
    font-size: 13px;
}

.video-avatar {
    position: absolute;
    top: 12px;
    left: 12px;
    border: 0;
    background: transparent;
    padding: 0;
}

.camera-off {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #101521;
    font-size: 50px;
}

.controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    padding: 12px;
    border-radius: 20px;
    background: rgba(17,21,33,.95);
    border: 1px solid var(--border);
    z-index: 20;
}

.control {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 0;
    background: var(--panel2);
    color: white;
    font-size: 22px;
}

.control.off {
    background: var(--danger);
}

.leave {
    background: var(--danger);
}

.moderation-warning {
    position: fixed;
    top: 85px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    background: var(--danger);
    color: white;
    padding: 13px 18px;
    border-radius: 12px;
    display: none;
}

.moderation-warning.visible {
    display: block;
}

.modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.7);
}

.modal {
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 25px;
    border-radius: 22px;
    background: var(--panel);
    border: 1px solid var(--border);
}

.modal-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 18px;
}

.admin-panel {
    max-width: 850px;
}

.admin-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.admin-list {
    display: grid;
    gap: 12px;
}

.admin-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 15px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 14px;
}

.admin-row-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.admin-row-actions button {
    padding: 9px 11px;
    border: 0;
    border-radius: 9px;
    color: white;
    background: #303849;
    font-size: 12px;
}

@media (max-width: 900px) {
    .layout,
    .room-layout {
        grid-template-columns: 1fr;
    }

    .sidebar {
        border-left: 0;
        border-top: 1px solid var(--border);
    }

    .chat-messages {
        height: 260px;
    }
}

@media (max-width: 600px) {
    .screen {
        padding: 15px;
    }

    .panel {
        padding: 22px;
    }

    .topbar {
        padding: 0 14px;
    }

    .topbar .logo {
        font-size: 18px;
    }

    .main-content,
    .video-area {
        padding: 12px;
    }

    .video-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
    }

    .video-card {
        aspect-ratio: 9 / 12;
        border-radius: 12px;
    }

    .video-label {
        left: 7px;
        bottom: 7px;
        padding: 6px 8px;
        font-size: 11px;
    }

    .controls {
        bottom: 12px;
        gap: 7px;
    }

    .control {
        width: 48px;
        height: 48px;
    }

    .admin-row {
        align-items: flex-start;
        flex-direction: column;
    }

    .choice-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div id="authScreen" class="screen center">
    <div class="panel">
        <div class="logo">Col'inCall</div>
        <div class="subtitle">Choisissez votre type de connexion</div>

        <div class="choice-grid">
            <button class="choice" onclick="chooseRole('user')">
                <span class="choice-icon">👤</span>
                Utilisateur
            </button>

            <button class="choice" onclick="chooseRole('admin')">
                <span class="choice-icon">🛡️</span>
                Administrateur
            </button>
        </div>
    </div>
</div>

<div id="loginScreen" class="screen center hidden">
    <div class="panel">
        <div class="logo">Connexion</div>
        <div class="subtitle" id="loginSubtitle"></div>

        <div class="field">
            <label for="username">Pseudo</label>
            <input id="username" maxlength="24" placeholder="Votre pseudo">
        </div>

        <div id="adminCodeField" class="field hidden">
            <label for="adminCode">Code administrateur</label>
            <input id="adminCode" type="password" placeholder="Code admin">
        </div>

        <div id="loginError" class="error"></div>

        <button class="btn full" onclick="login()">
            Entrer
        </button>

        <br><br>

        <button class="btn secondary full" onclick="backToAuth()">
            Retour
        </button>
    </div>
</div>

<div id="lobbyScreen" class="hidden">

    <header class="topbar">
        <div class="topbar-left">
            <div class="logo">Col'inCall</div>
            <span id="roleBadge"></span>
        </div>

        <div style="display:flex;align-items:center;gap:12px;">
            <button id="adminButton" class="btn hidden" onclick="openAdminPanel()">
                Administration
            </button>

            <button class="profile-button" onclick="openOwnProfile()">
                <div id="topAvatar" class="avatar"></div>
                <span id="topUsername"></span>
            </button>
        </div>
    </header>

    <div class="layout">
        <main class="main-content">
            <h2>Choisir un salon</h2>

            <input
                id="roomSearch"
                class="search"
                placeholder="Rechercher un salon..."
                oninput="renderRooms()">

            <button class="btn" onclick="createRoom()">
                + Créer un salon
            </button>

            <br><br>

            <div id="roomsList" class="rooms"></div>
        </main>

        <aside class="sidebar">
            <h3>Discussion</h3>
            <div id="lobbyChat" class="chat-messages"></div>

            <form class="chat-form" onsubmit="sendLobbyChat(event)">
                <input id="lobbyChatInput" placeholder="Écrire un message...">
                <button class="btn">Envoyer</button>
            </form>
        </aside>
    </div>
</div>

<div id="roomScreen" class="hidden">

    <header class="topbar">
        <div class="topbar-left">
            <button class="btn secondary" onclick="leaveCurrentRoom()">
                ← Salons
            </button>

            <div>
                <strong id="currentRoomName"></strong>
                <div id="roomStatus" class="subtitle" style="margin:0;"></div>
            </div>
        </div>
    </header>

    <div class="room-layout">

        <main class="video-area">
            <div id="videoGrid" class="video-grid"></div>

            <div id="moderationWarning" class="moderation-warning"></div>

            <div class="controls">
                <button id="micButton" class="control off" onclick="toggleMicro()">
                    🔇
                </button>

                <button id="cameraButton" class="control off" onclick="toggleCamera()">
                    📷
                </button>

                <button class="control leave" onclick="leaveCurrentRoom()">
                    ☎
                </button>
            </div>
        </main>

        <aside class="sidebar">
            <h3>Chat du salon</h3>

            <div id="roomChat" class="chat-messages"></div>

            <form class="chat-form" onsubmit="sendRoomChat(event)">
                <input id="roomChatInput" placeholder="Écrire un message...">
                <button class="btn">Envoyer</button>
            </form>
        </aside>

    </div>
</div>

<div id="profileModal" class="modal-backdrop hidden">
    <div class="modal">
        <h2 id="profileModalTitle">Profil</h2>

        <div style="display:flex;justify-content:center;margin-bottom:20px;">
            <div id="profileAvatar" class="avatar" style="width:100px;height:100px;font-size:30px;"></div>
        </div>

        <div id="ownProfileFields">
            <div class="field">
                <label for="profileDescription">Description</label>
                <textarea id="profileDescription" placeholder="Votre description..."></textarea>
            </div>

            <div class="field">
                <label>Avatar</label>

                <input
                    id="avatarPicker"
                    type="file"
                    accept="image/*"
                    class="hidden"
                    onchange="processAvatar(event)">

                <button class="btn secondary" onclick="chooseAvatar()">
                    Choisir une image
                </button>

                <button class="btn secondary" onclick="takeAvatarPhoto()">
                    Prendre une photo
                </button>
            </div>
        </div>

        <div id="viewedProfileDescription" class="subtitle"></div>

        <div id="profileAdminActions" class="modal-actions hidden">
            <button class="btn danger" onclick="kickViewedUser()">
                Expulser
            </button>

            <button id="profileMuteButton" class="btn secondary" onclick="toggleViewedMute()">
                Couper le micro
            </button>

            <button id="profileCameraButton" class="btn secondary" onclick="toggleViewedCamera()">
                Couper la caméra
            </button>
        </div>

        <div class="modal-actions">
            <button id="saveProfileButton" class="btn" onclick="saveProfile()">
                Enregistrer
            </button>

            <button class="btn secondary" onclick="closeProfileModal()">
                Fermer
            </button>
        </div>
    </div>
</div>

<div id="adminModal" class="modal-backdrop hidden">
    <div class="modal admin-panel">
        <h2>Administration</h2>

        <div class="admin-tabs">
            <button class="btn" onclick="showAdminTab('rooms')">
                Salons
            </button>

            <button class="btn secondary" onclick="showAdminTab('users')">
                Users
            </button>
        </div>

        <input
            id="adminSearch"
            class="search"
            placeholder="Rechercher un pseudo ou un salon..."
            oninput="renderAdminPanel()">

        <div id="adminContent"></div>

        <br>

        <button class="btn secondary full" onclick="closeAdminPanel()">
            Fermer
        </button>
    </div>
</div>

<script>
const SERVER_URL = "wss://projet-nz7b.onrender.com";

let socket;
let selectedRole = "user";
let currentUser = null;
let rooms = [];
let allUsers = [];
let currentRoom = null;

let localStream = null;
let microphoneEnabled = false;
let cameraEnabled = false;

let peerConnections = new Map();
let viewedUser = null;
let adminTab = "rooms";

const savedProfile = JSON.parse(
    localStorage.getItem("colincall-profile") || "{}"
);


/* =========================
   CONNEXION
========================= */

function connectSocket() {
    socket = new WebSocket(SERVER_URL);

    socket.onopen = () => {
        console.log("WebSocket connecté");
    };

    socket.onclose = () => {
        alert("Connexion au serveur perdue.");
    };

    socket.onerror = () => {
        showLoginError("Impossible de joindre le serveur.");
    };

    socket.onmessage = async event => {
        const message = JSON.parse(event.data);

        switch (message.type) {
            case "login-success":
                handleLoginSuccess(message.user);
                break;

            case "login-error":
                showLoginError(message.message);
                break;

            case "room-list":
                rooms = message.rooms || [];
                renderRooms();
                renderAdminPanel();
                break;

            case "room-joined":
                await handleRoomJoined(message);
                break;

            case "room-left":
                closePeerConnections();
                break;

            case "room-deleted":
                closePeerConnections();
                currentRoom = null;
                showLobby();
                alert(message.message);
                break;

            case "user-joined":
                await createConnectionToUser(message.user, true);
                addVideoUser(message.user);
                break;

            case "user-left":
                removeVideoUser(message.userId);
                closePeerConnection(message.userId);
                break;

            case "offer":
                await receiveOffer(message);
                break;

            case "answer":
                await receiveAnswer(message);
                break;

            case "ice-candidate":
                await receiveCandidate(message);
                break;

            case "chat-message":
                addChatMessage(message);
                break;

            case "users-list":
                allUsers = message.users || [];
                renderAdminPanel();
                break;

            case "user-updated":
                updateUserInLists(message.user);
                break;

            case "profile-updated":
                currentUser = message.user;
                updateTopProfile();
                break;

            case "force-micro":
                applyForcedMicro(message.enabled);
                break;

            case "force-camera":
                applyForcedCamera(message.enabled);
                break;

            case "kicked":
                closePeerConnections();
                currentRoom = null;
                showLobby();
                alert(message.message);
                break;

            case "error-message":
                alert(message.message);
                break;
        }
    };
}


/* =========================
   AUTHENTIFICATION
========================= */

function chooseRole(role) {
    selectedRole = role;

    document.getElementById("authScreen").classList.add("hidden");
    document.getElementById("loginScreen").classList.remove("hidden");

    document.getElementById("loginSubtitle").textContent =
        role === "admin"
            ? "Connexion administrateur"
            : "Connexion utilisateur";

    document.getElementById("adminCodeField").classList.toggle(
        "hidden",
        role !== "admin"
    );
}

function backToAuth() {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("authScreen").classList.remove("hidden");
}

function showLoginError(message) {
    document.getElementById("loginError").textContent = message;
}

function login() {
    const username = document.getElementById("username").value.trim();
    const adminCode = document.getElementById("adminCode").value;

    if (!username) {
        showLoginError("Entre un pseudo.");
        return;
    }

    if (!socket || socket.readyState !== WebSocket.OPEN) {
        connectSocket();

        setTimeout(login, 500);
        return;
    }

    socket.send(JSON.stringify({
        type: "login",
        username,
        role: selectedRole,
        adminCode
    }));
}

function handleLoginSuccess(user) {
    currentUser = user;

    currentUser.profile = {
        description: savedProfile.description || "",
        avatar: savedProfile.avatar || null
    };

    socket.send(JSON.stringify({
        type: "update-profile",
        description: currentUser.profile.description,
        avatar: currentUser.profile.avatar
    }));

    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("lobbyScreen").classList.remove("hidden");

    document.getElementById("roleBadge").textContent =
        currentUser.role === "admin" ? "🛡️ Admin" : "Utilisateur";

    document.getElementById("adminButton").classList.toggle(
        "hidden",
        currentUser.role !== "admin"
    );

    updateTopProfile();
}


/* =========================
   SALONS
========================= */

function renderRooms() {
    const container = document.getElementById("roomsList");
    const search = document.getElementById("roomSearch").value.toLowerCase();

    container.innerHTML = "";

    const filtered = rooms.filter(room =>
        room.name.toLowerCase().includes(search)
    );

    if (!filtered.length) {
        container.innerHTML = "<p class='subtitle'>Aucun salon trouvé.</p>";
        return;
    }

    filtered.forEach(room => {
        const card = document.createElement("div");
        card.className = "room-card";

        card.innerHTML = `
            <div class="room-title">${escapeHtml(room.name)}</div>
            <div class="room-count">👥 ${room.count} participant(s)</div>
            <button class="btn full">Rejoindre</button>
        `;

        card.querySelector("button").onclick = () => joinRoom(room.id);

        container.appendChild(card);
    });
}

function createRoom() {
    const name = prompt("Nom du salon :");

    if (!name || !name.trim()) return;

    socket.send(JSON.stringify({
        type: "create-room",
        name
    }));
}

async function joinRoom(roomId) {
    await prepareLocalMedia();

    socket.send(JSON.stringify({
        type: "join-room",
        roomId
    }));
}

async function handleRoomJoined(message) {
    currentRoom = message.room;

    document.getElementById("lobbyScreen").classList.add("hidden");
    document.getElementById("roomScreen").classList.remove("hidden");

    document.getElementById("currentRoomName").textContent =
        currentRoom.name;

    document.getElementById("videoGrid").innerHTML = "";

    addLocalVideo();

    for (const participant of message.participants) {
        addVideoUser(participant);
        await createConnectionToUser(participant, true);
    }
}

function leaveCurrentRoom() {
    if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
            type: "leave-room"
        }));
    }

    closePeerConnections();
    currentRoom = null;
    showLobby();
}

function showLobby() {
    document.getElementById("roomScreen").classList.add("hidden");
    document.getElementById("lobbyScreen").classList.remove("hidden");
}


/* =========================
   MEDIA
========================= */

async function prepareLocalMedia() {
    if (localStream) return;

    try {
        localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: true
        });

        localStream.getAudioTracks().forEach(track => {
            track.enabled = false;
        });

        localStream.getVideoTracks().forEach(track => {
            track.enabled = false;
        });

        microphoneEnabled = false;
        cameraEnabled = false;

        updateControls();

    } catch (error) {
        alert("Autorisez l'accès à la caméra et au micro.");
        throw error;
    }
}

function addLocalVideo() {
    const grid = document.getElementById("videoGrid");

    const card = document.createElement("div");
    card.className = "video-card";
    card.id = "video-local";

    card.innerHTML = `
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="camera-off" id="localCameraOff">📷</div>
        <div class="video-label">Vous</div>
    `;

    grid.appendChild(card);

    document.getElementById("localVideo").srcObject = localStream;
}

function toggleMicro() {
    if (!localStream || currentUser?.muted) return;

    microphoneEnabled = !microphoneEnabled;

    localStream.getAudioTracks().forEach(track => {
        track.enabled = microphoneEnabled;
    });

    updateControls();
}

function toggleCamera() {
    if (!localStream || currentUser?.cameraDisabled) return;

    cameraEnabled = !cameraEnabled;

    localStream.getVideoTracks().forEach(track => {
        track.enabled = cameraEnabled;
    });

    updateControls();
}

function updateControls() {
    const micButton = document.getElementById("micButton");
    const cameraButton = document.getElementById("cameraButton");
    const cameraOff = document.getElementById("localCameraOff");

    micButton.textContent = microphoneEnabled ? "🎤" : "🔇";
    micButton.classList.toggle("off", !microphoneEnabled);
    micButton.disabled = Boolean(currentUser?.muted);

    cameraButton.textContent = cameraEnabled ? "📹" : "📷";
    cameraButton.classList.toggle("off", !cameraEnabled);
    cameraButton.disabled = Boolean(currentUser?.cameraDisabled);

    if (cameraOff) {
        cameraOff.classList.toggle("hidden", cameraEnabled);
    }
}

function applyForcedMicro(enabled) {
    microphoneEnabled = enabled;

    if (localStream) {
        localStream.getAudioTracks().forEach(track => {
            track.enabled = enabled;
        });
    }

    currentUser.muted = !enabled;

    showModerationMessage(
        enabled
            ? "Votre micro a été réactivé."
            : "Votre micro a été coupé par l'administrateur."
    );

    updateControls();
}

function applyForcedCamera(enabled) {
    cameraEnabled = enabled;

    if (localStream) {
        localStream.getVideoTracks().forEach(track => {
            track.enabled = enabled;
        });
    }

    currentUser.cameraDisabled = !enabled;

    showModerationMessage(
        enabled
            ? "Votre caméra a été réactivée."
            : "Votre caméra a été coupée par l'administrateur."
    );

    updateControls();
}

function showModerationMessage(message) {
    const warning = document.getElementById("moderationWarning");

    warning.textContent = message;
    warning.classList.add("visible");

    setTimeout(() => {
        warning.classList.remove("visible");
    }, 3500);
}


/* =========================
   WEBRTC
========================= */

function rtcConfig() {
    return {
        iceServers: [
            {
                urls: "stun:stun.l.google.com:19302"
            }
        ]
    };
}

async function createConnectionToUser(user, createOffer) {
    if (peerConnections.has(user.id)) return;

    const peer = new RTCPeerConnection(rtcConfig());

    peerConnections.set(user.id, peer);

    localStream.getTracks().forEach(track => {
        peer.addTrack(track, localStream);
    });

    peer.onicecandidate = event => {
        if (event.candidate) {
            socket.send(JSON.stringify({
                type: "ice-candidate",
                targetId: user.id,
                candidate: event.candidate
            }));
        }
    };

    peer.ontrack = event => {
        const video = document.querySelector(
            `#video-${user.id} video`
        );

        if (video) {
            video.srcObject = event.streams[0];
        }
    };

    if (createOffer) {
        const offer = await peer.createOffer();

        await peer.setLocalDescription(offer);

        socket.send(JSON.stringify({
            type: "offer",
            targetId: user.id,
            offer
        }));
    }
}

async function receiveOffer(message) {
    const user = allUsers.find(item => item.id === message.fromId);

    let peer = peerConnections.get(message.fromId);

    if (!peer) {
        peer = new RTCPeerConnection(rtcConfig());
        peerConnections.set(message.fromId, peer);

        localStream.getTracks().forEach(track => {
            peer.addTrack(track, localStream);
        });

        peer.onicecandidate = event => {
            if (event.candidate) {
                socket.send(JSON.stringify({
                    type: "ice-candidate",
                    targetId: message.fromId,
                    candidate: event.candidate
                }));
            }
        };

        peer.ontrack = event => {
            const video = document.querySelector(
                `#video-${message.fromId} video`
            );

            if (video) {
                video.srcObject = event.streams[0];
            }
        };
    }

    await peer.setRemoteDescription(
        new RTCSessionDescription(message.offer)
    );

    const answer = await peer.createAnswer();

    await peer.setLocalDescription(answer);

    socket.send(JSON.stringify({
        type: "answer",
        targetId: message.fromId,
        answer
    }));
}

async function receiveAnswer(message) {
    const peer = peerConnections.get(message.fromId);

    if (!peer) return;

    await peer.setRemoteDescription(
        new RTCSessionDescription(message.answer)
    );
}

async function receiveCandidate(message) {
    const peer = peerConnections.get(message.fromId);

    if (!peer || !message.candidate) return;

    try {
        await peer.addIceCandidate(
            new RTCIceCandidate(message.candidate)
        );
    } catch (error) {
        console.error(error);
    }
}

function closePeerConnection(userId) {
    const peer = peerConnections.get(userId);

    if (peer) {
        peer.close();
        peerConnections.delete(userId);
    }
}

function closePeerConnections() {
    for (const peer of peerConnections.values()) {
        peer.close();
    }

    peerConnections.clear();
}

function updateTopProfile() {
    document.getElementById("topUsername").textContent =
        currentUser.username;

}

function openOwnProfile() {

    document.getElementById("viewedProfileDescription").classList.add("hidden");

}

function openUserProfile(userId) {
    const user =
        allUsers.find(item => item.id === userId) ||
        currentRoom?.participants?.find(item => item.id === userId);

    if (!user) return;

    viewedUser = user;

    document.getElementById("profileModalTitle").textContent =
        user.username;

    document.getElementById("ownProfileFields").classList.add("hidden");
    document.getElementById("saveProfileButton").classList.add("hidden");
    document.getElementById("viewedProfileDescription").classList.remove("hidden");

    document.getElementById("viewedProfileDescription").textContent =
        user.profile?.description || "Aucune description.";

        "hidden",
        currentUser.role !== "admin"
    );

        getAvatarHtml(user);

    updateViewedUserButtons();

    document.getElementById("profileModal").classList.remove("hidden");
}

function closeProfileModal() {
    document.getElementById("profileModal").classList.add("hidden");
}

function chooseAvatar() {
    const picker = document.getElementById("avatarPicker");
    picker.removeAttribute("capture");
    picker.click();
}

function takeAvatarPhoto() {
    const picker = document.getElementById("avatarPicker");
    picker.setAttribute("capture", "user");
    picker.click();
}

function processAvatar(event) {
    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = () => {
        const image = new Image();

        image.onload = () => {
            const canvas = document.createElement("canvas");
            const size = 256;

            canvas.width = size;
            canvas.height = size;

            const context = canvas.getContext("2d");
            context.drawImage(image, 0, 0, size, size);

            const avatar = canvas.toDataURL("image/jpeg", .72);

            currentUser.profile.avatar = avatar;

            document.getElementById("profileAvatar").innerHTML =
                getAvatarHtml(currentUser);
        };

        image.src = reader.result;
    };

    reader.readAsDataURL(file);
}

function saveProfile() {
    const description =
        document.getElementById("profileDescription").value.trim();

    currentUser.profile.description = description;

    localStorage.setItem(
        "colincall-profile",
        JSON.stringify(currentUser.profile)
    );

    socket.send(JSON.stringify({
        type: "update-profile",
        description: currentUser.profile.description,
        avatar: currentUser.profile.avatar
    }));

    updateTopProfile();
    closeProfileModal();
}

function updateUserInLists(updatedUser) {
    allUsers = allUsers.map(user =>
        user.id === updatedUser.id ? updatedUser : user
    );

    renderAdminPanel();
}

function getAvatarHtml(user) {
    if (user.profile?.avatar) {
        return `<img src="${user.profile.avatar}" alt="Avatar">`;
    }

    return escapeHtml(
        (user.username || "?").charAt(0).toUpperCase()
    );
}


/* =========================
   ADMINISTRATION
========================= */

function openAdminPanel() {
    adminTab = "rooms";
    renderAdminPanel();
    document.getElementById("adminModal").classList.remove("hidden");
}

function closeAdminPanel() {
    document.getElementById("adminModal").classList.add("hidden");
}

function showAdminTab(tab) {
    adminTab = tab;
    renderAdminPanel();
}

function renderAdminPanel() {
    const content = document.getElementById("adminContent");

    if (!content || document.getElementById("adminModal").classList.contains("hidden")) {
        return;
    }

    const search = document.getElementById("adminSearch").value.toLowerCase();

    content.innerHTML = "";

    if (adminTab === "rooms") {
        const filteredRooms = rooms.filter(room =>
            room.name.toLowerCase().includes(search)
        );

        const list = document.createElement("div");
        list.className = "admin-list";

        filteredRooms.forEach(room => {
            const row = document.createElement("div");
            row.className = "admin-row";

            row.innerHTML = `
                <div>
                    <strong>${escapeHtml(room.name)}</strong>
                    <div class="subtitle" style="margin:5px 0 0;">
                        ${room.count} participant(s)
                    </div>
                </div>

                <div class="admin-row-actions">
                    <button class="danger">Supprimer</button>
                </div>
            `;

            row.querySelector("button").onclick = () => {
                if (!confirm(`Supprimer le salon "${room.name}" ?`)) return;

                socket.send(JSON.stringify({
                    type: "admin-delete-room",
                    roomId: room.id
                }));
            };

            list.appendChild(row);
        });

        content.appendChild(list);
    }

    if (adminTab === "users") {
        const filteredUsers = allUsers.filter(user =>
            user.username.toLowerCase().includes(search)
        );

        const list = document.createElement("div");
        list.className = "admin-list";

        filteredUsers.forEach(user => {
            if (user.id === currentUser.id) return;

            const row = document.createElement("div");
            row.className = "admin-row";

            row.innerHTML = `
                <div>
                    <strong>${escapeHtml(user.username)}</strong>
                    <div class="subtitle" style="margin:5px 0 0;">
                        ${user.roomId ? "Dans un salon" : "Dans le lobby"}
                    </div>
                </div>

                <div class="admin-row-actions">
                    <button class="mute-button">
                        ${user.muted ? "Réactiver micro" : "Couper micro"}
                    </button>

                    <button class="camera-button">
                        ${user.cameraDisabled ? "Réactiver caméra" : "Couper caméra"}
                    </button>

                    <button class="kick-button">
                        Expulser
                    </button>
                </div>
            `;

            row.querySelector(".mute-button").onclick = () => {
                socket.send(JSON.stringify({
                    type: "admin-mute",
                    userId: user.id,
                    muted: !user.muted
                }));
            };

            row.querySelector(".camera-button").onclick = () => {
                socket.send(JSON.stringify({
                    type: "admin-camera",
                    userId: user.id,
                    disabled: !user.cameraDisabled
                }));
            };

            row.querySelector(".kick-button").onclick = () => {
                socket.send(JSON.stringify({
                    type: "admin-kick",
                    userId: user.id
                }));
            };

            list.appendChild(row);
        });

        content.appendChild(list);
    }
}

function updateViewedUserButtons() {
    if (!viewedUser) return;

    document.getElementById("profileMuteButton").textContent =
        viewedUser.muted ? "Réactiver le micro" : "Couper le micro";

    document.getElementById("profileCameraButton").textContent =
        viewedUser.cameraDisabled
            ? "Réactiver la caméra"
            : "Couper la caméra";
}

function toggleViewedMute() {
    if (!viewedUser) return;

    socket.send(JSON.stringify({
        type: "admin-mute",
        userId: viewedUser.id,
        muted: !viewedUser.muted
    }));

    viewedUser.muted = !viewedUser.muted;
    updateViewedUserButtons();
}

function toggleViewedCamera() {
    if (!viewedUser) return;

    socket.send(JSON.stringify({
        type: "admin-camera",
        userId: viewedUser.id,
        disabled: !viewedUser.cameraDisabled
    }));

    viewedUser.cameraDisabled = !viewedUser.cameraDisabled;
    updateViewedUserButtons();
}

function kickViewedUser() {
    if (!viewedUser) return;

    socket.send(JSON.stringify({
        type: "admin-kick",
        userId: viewedUser.id
    }));

    closeProfileModal();
}


/* =========================
   UTILITAIRES
========================= */

function escapeHtml(value) {
    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
