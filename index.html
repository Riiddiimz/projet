<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vibe — Random Video Chat</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #07080c;
  --panel: rgba(255,255,255,.065);
  --border: rgba(255,255,255,.10);
  --text: #fff;
  --muted: #9297a5;
  --accent: #7c5cff;
  --accent2: #00d4ff;
  --danger: #ff4664;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:
    radial-gradient(circle at 20% 10%, rgba(124,92,255,.16), transparent 30%),
    radial-gradient(circle at 80% 90%, rgba(0,212,255,.10), transparent 30%),
    var(--bg);
  color: var(--text);
}

button {
  border: 0;
  font: inherit;
  cursor: pointer;
}

.app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  height: 76px;
  padding: 0 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 11px;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -.6px;
}

.logo-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  box-shadow: 0 0 22px rgba(124,92,255,.8);
}

.status {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 15px;
  border-radius: 999px;
  background: rgba(255,255,255,.055);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px);
  color: #c7cad4;
  font-size: 13px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #ffc857;
  box-shadow: 0 0 12px #ffc857;
}

.status.connected .status-dot {
  background: #31e981;
  box-shadow: 0 0 12px #31e981;
}

/* VIDEOS */

.stage {
  flex: 1;
  min-height: 0;
  padding: 0 22px 18px;
  position: relative;
}

.video-container {
  width: 100%;
  height: 100%;
  position: relative;
  border-radius: 28px;
  overflow: hidden;
  background: #101218;
  border: 1px solid var(--border);
  box-shadow:
    0 30px 100px rgba(0,0,0,.45),
    inset 0 1px rgba(255,255,255,.05);
}

#remoteVideo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background:
    radial-gradient(circle, rgba(124,92,255,.08), transparent 50%),
    #101218;
}

.empty-state {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  pointer-events: none;
}

.empty-icon {
  width: 70px;
  height: 70px;
  border-radius: 22px;
  display: grid;
  place-items: center;
  background: rgba(255,255,255,.06);
  border: 1px solid var(--border);
  font-size: 28px;
  margin-bottom: 20px;
}

.empty-state h1 {
  font-size: clamp(25px, 4vw, 42px);
  letter-spacing: -1.5px;
}

.empty-state p {
  margin-top: 9px;
  color: var(--muted);
  font-size: 14px;
}

/* LOCAL VIDEO */

.local-wrapper {
  position: absolute;
  right: 24px;
  bottom: 24px;
  width: min(270px, 25vw);
  aspect-ratio: 16 / 10;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.18);
  box-shadow: 0 20px 50px rgba(0,0,0,.5);
  background: #15171e;
}

#localVideo {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

.local-label {
  position: absolute;
  left: 10px;
  bottom: 10px;
  padding: 5px 9px;
  border-radius: 8px;
  background: rgba(0,0,0,.55);
  backdrop-filter: blur(10px);
  font-size: 11px;
  color: #ddd;
}

/* CONTROLS */

.controls {
  position: absolute;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  border-radius: 24px;
  background: rgba(10,11,16,.72);
  border: 1px solid rgba(255,255,255,.10);
  backdrop-filter: blur(25px);
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
}

.control {
  width: 50px;
  height: 50px;
  border-radius: 16px;
  color: white;
  background: rgba(255,255,255,.075);
  border: 1px solid rgba(255,255,255,.08);
  transition: .2s ease;
}

.control:hover {
  transform: translateY(-2px);
  background: rgba(255,255,255,.13);
}

.control.active {
  background: rgba(255,255,255,.13);
}

.control.danger {
  background: rgba(255,70,100,.14);
  color: #ff7188;
}

.next {
  height: 50px;
  padding: 0 24px;
  border-radius: 16px;
  color: white;
  font-weight: 750;
  background: linear-gradient(135deg, #7658ff, #6044db);
  box-shadow: 0 10px 30px rgba(102,75,230,.32);
  transition: .2s ease;
}

.next:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 35px rgba(102,75,230,.45);
}

/* CHAT */

.chat-button {
  position: absolute;
  right: 24px;
  top: 24px;
  width: 48px;
  height: 48px;
  border-radius: 16px;
  color: white;
  background: rgba(10,11,16,.72);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px);
  z-index: 5;
}

.chat {
  position: fixed;
  right: 22px;
  top: 88px;
  bottom: 22px;
  width: 330px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  border-radius: 24px;
  background: rgba(13,14,20,.92);
  border: 1px solid var(--border);
  backdrop-filter: blur(30px);
  box-shadow: 0 30px 100px rgba(0,0,0,.5);
  transform: translateX(380px);
  transition: .3s ease;
}

.chat.open {
  transform: translateX(0);
}

.chat-header {
  padding: 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.message {
  max-width: 80%;
  padding: 10px 13px;
  border-radius: 14px;
  background: rgba(255,255,255,.07);
  font-size: 13px;
  line-height: 1.4;
}

.message.mine {
  align-self: flex-end;
  background: #6650df;
}

.chat-input {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid var(--border);
}

.chat-input input {
  min-width: 0;
  flex: 1;
  background: rgba(255,255,255,.06);
  color: white;
  border: 1px solid var(--border);
  outline: none;
  border-radius: 13px;
  padding: 11px 12px;
}

.chat-input button {
  width: 43px;
  border-radius: 13px;
  background: #6650df;
  color: white;
}

/* MOBILE */

@media (max-width: 700px) {
  .header {
    height: 64px;
    padding: 0 16px;
  }

  .stage {
    padding: 0 10px 10px;
  }

  .video-container {
    border-radius: 22px;
  }

  .local-wrapper {
    width: 125px;
    right: 14px;
    bottom: 105px;
    border-radius: 15px;
  }

  .controls {
    bottom: 14px;
    width: calc(100% - 28px);
    justify-content: center;
  }

  .control {
    width: 46px;
    height: 46px;
  }

  .next {
    flex: 1;
    padding: 0 12px;
  }

  .chat {
    left: 10px;
    right: 10px;
    width: auto;
    top: 74px;
    bottom: 10px;
  }

  .chat-button {
    right: 14px;
    top: 14px;
  }

  .status {
    font-size: 11px;
    padding: 8px 11px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="logo">
      <span class="logo-dot"></span>
      Vibe
    </div>

    <div class="status" id="status">
      <span class="status-dot"></span>
      <span id="statusText">Connexion...</span>
    </div>

  </header>

  <main class="stage">

    <div class="video-container">

      <video
        id="remoteVideo"
        autoplay
        playsinline
      ></video>

      <div class="empty-state" id="emptyState">
        <div class="empty-icon">✦</div>
        <h1>À la recherche de quelqu'un</h1>
        <p>Une nouvelle rencontre peut commencer maintenant.</p>
      </div>

      <div class="local-wrapper">
        <video
          id="localVideo"
          autoplay
          muted
          playsinline
        ></video>

        <div class="local-label">
          Vous
        </div>
      </div>

      <button
        class="chat-button"
        id="chatButton"
        title="Chat"
      >
        💬
      </button>

      <div class="controls">

        <button
          class="control active"
          id="micButton"
          title="Micro"
        >
          🎙
        </button>

        <button
          class="control active"
          id="cameraButton"
          title="Caméra"
        >
          ◉
        </button>

        <button
          class="control danger"
          id="reportButton"
          title="Signaler"
        >
          ⚑
        </button>

        <button
          class="next"
          id="nextButton"
        >
          Suivant&nbsp; →
        </button>

      </div>

    </div>

  </main>

</div>

<!-- CHAT -->

<aside class="chat" id="chat">

  <div class="chat-header">
    <strong>Discussion</strong>

    <button id="closeChat">
      ✕
    </button>
  </div>

  <div
    class="chat-messages"
    id="chatMessages"
  ></div>

  <form
    class="chat-input"
    id="chatForm"
  >
    <input
      id="chatInput"
      autocomplete="off"
      placeholder="Écrire un message..."
    />

    <button type="submit">
      ↑
    </button>
  </form>

</aside>

<script>

/*
|--------------------------------------------------------------------------
| CONFIGURATION
|--------------------------------------------------------------------------
*/

const SERVER_URL = "wss://YOUR-RENDER-URL.onrender.com";

/*
|--------------------------------------------------------------------------
| DOM
|--------------------------------------------------------------------------
*/

const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");

const status = document.getElementById("status");
const statusText = document.getElementById("statusText");

const emptyState = document.getElementById("emptyState");

const micButton = document.getElementById("micButton");
const cameraButton = document.getElementById("cameraButton");
const nextButton = document.getElementById("nextButton");
const reportButton = document.getElementById("reportButton");

const chatButton = document.getElementById("chatButton");
const closeChat = document.getElementById("closeChat");
const chat = document.getElementById("chat");

const chatForm = document.getElementById("chatForm");
const chatInput = document.getElementById("chatInput");
const chatMessages = document.getElementById("chatMessages");

/*
|--------------------------------------------------------------------------
| STATE
|--------------------------------------------------------------------------
*/

let socket = null;
let peerConnection = null;
let localStream = null;

let isInitiator = false;
let connected = false;

let pendingCandidates = [];

/*
|--------------------------------------------------------------------------
| WEBRTC
|--------------------------------------------------------------------------
*/

const rtcConfig = {
  iceServers: [
    {
      urls: "stun:stun.l.google.com:19302"
    }
  ]
};

async function startCamera() {

  try {

    localStream = await navigator.mediaDevices.getUserMedia({
      video: {
        width: {
          ideal: 1280
        },
        height: {
          ideal: 720
        },
        facingMode: "user"
      },
      audio: true
    });

    localVideo.srcObject = localStream;

  } catch (error) {

    console.error(error);

    setStatus(
      "Autorisation caméra / micro nécessaire",
      false
    );

  }
}

/*
|--------------------------------------------------------------------------
| SOCKET
|--------------------------------------------------------------------------
*/

function connectSocket() {

  socket = new WebSocket(SERVER_URL);

  socket.addEventListener("open", () => {

    console.log("WebSocket connected");

    setStatus("Recherche...", false);

    send({
      type: "join"
    });

  });

  socket.addEventListener("message", async event => {

    let message;

    try {
      message = JSON.parse(event.data);
    } catch {
      return;
    }

    await handleServerMessage(message);

  });

  socket.addEventListener("close", () => {

    connected = false;

    setStatus(
      "Serveur déconnecté",
      false
    );

    cleanupPeer();

  });

  socket.addEventListener("error", error => {

    console.error("WebSocket error", error);

    setStatus(
      "Erreur de connexion",
      false
    );

  });
}

function send(data) {

  if (
    socket &&
    socket.readyState === WebSocket.OPEN
  ) {
    socket.send(JSON.stringify(data));
  }

}

/*
|--------------------------------------------------------------------------
| SERVER EVENTS
|--------------------------------------------------------------------------
*/

async function handleServerMessage(message) {

  switch (message.type) {

    case "connected":

      setStatus(
        "Recherche...",
        false
      );

      break;

    case "searching":

      connected = false;

      setStatus(
        "Recherche de quelqu'un...",
        false
      );

      emptyState.style.display = "flex";

      break;

    case "matched":

      isInitiator = message.initiator;

      connected = true;

      setStatus(
        "Connecté",
        true
      );

      emptyState.style.display = "none";

      await createPeerConnection();

      if (isInitiator) {
        await createOffer();
      }

      break;

    case "offer":

      await handleOffer(message.data);

      break;

    case "answer":

      await handleAnswer(message.data);

      break;

    case "ice-candidate":

      await handleIceCandidate(message.data);

      break;

    case "peer-left":

      cleanupPeer();

      connected = false;

      setStatus(
        "La personne est partie",
        false
      );

      emptyState.style.display = "flex";

      setTimeout(() => {

        send({
          type: "join"
        });

      }, 800);

      break;

  }

}

/*
|--------------------------------------------------------------------------
| PEER CONNECTION
|--------------------------------------------------------------------------
*/

async function createPeerConnection() {

  cleanupPeer();

  peerConnection = new RTCPeerConnection(
    rtcConfig
  );

  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });

  }

  peerConnection.ontrack = event => {

    if (event.streams[0]) {

      remoteVideo.srcObject =
        event.streams[0];

      emptyState.style.display =
        "none";

    }

  };

  peerConnection.onicecandidate = event => {

    if (event.candidate) {

      send({
        type: "ice-candidate",
        data: event.candidate
      });

    }

  };

  peerConnection.onconnectionstatechange = () => {

    if (!peerConnection) {
      return;
    }

    const state =
      peerConnection.connectionState;

    console.log(
      "WebRTC:",
      state
    );

    if (state === "connected") {

      setStatus(
        "Connecté",
        true
      );

    }

    if (
      state === "failed" ||
      state === "disconnected"
    ) {

      setStatus(
        "Connexion instable",
        false
      );

    }

  };

}

/*
|--------------------------------------------------------------------------
| OFFER
|--------------------------------------------------------------------------
*/

async function createOffer() {

  if (!peerConnection) {
    return;
  }

  const offer =
    await peerConnection.createOffer();

  await peerConnection.setLocalDescription(
    offer
  );

  send({
    type: "offer",
    data: offer
  });

}

/*
|--------------------------------------------------------------------------
| HANDLE OFFER
|--------------------------------------------------------------------------
*/

async function handleOffer(offer) {

  if (!peerConnection) {

    await createPeerConnection();

  }

  await peerConnection.setRemoteDescription(
    new RTCSessionDescription(offer)
  );

  await flushCandidates();

  const answer =
    await peerConnection.createAnswer();

  await peerConnection.setLocalDescription(
    answer
  );

  send({
    type: "answer",
    data: answer
  });

}

/*
|--------------------------------------------------------------------------
| HANDLE ANSWER
|--------------------------------------------------------------------------
*/

async function handleAnswer(answer) {

  if (!peerConnection) {
    return;
  }

  await peerConnection.setRemoteDescription(
    new RTCSessionDescription(answer)
  );

  await flushCandidates();

}

/*
|--------------------------------------------------------------------------
| ICE
|--------------------------------------------------------------------------
*/

async function handleIceCandidate(candidate) {

  if (!peerConnection) {
    return;
  }

  if (
    peerConnection.remoteDescription
  ) {

    try {

      await peerConnection.addIceCandidate(
        new RTCIceCandidate(candidate)
      );

    } catch (error) {

      console.error(error);

    }

  } else {

    pendingCandidates.push(candidate);

  }

}

async function flushCandidates() {

  for (
    const candidate
    of pendingCandidates
  ) {

    try {

      await peerConnection.addIceCandidate(
        new RTCIceCandidate(candidate)
      );

    } catch (error) {

      console.error(error);

    }

  }

  pendingCandidates = [];

}

/*
|--------------------------------------------------------------------------
| NEXT
|--------------------------------------------------------------------------
*/

nextButton.addEventListener(
  "click",
  () => {

    cleanupPeer();

    connected = false;

    emptyState.style.display =
      "flex";

    setStatus(
      "Recherche...",
      false
    );

    clearChat();

    send({
      type: "next"
    });

  }
);

/*
|--------------------------------------------------------------------------
| CLEANUP
|--------------------------------------------------------------------------
*/

function cleanupPeer() {

  if (peerConnection) {

    peerConnection.ontrack = null;
    peerConnection.onicecandidate = null;

    peerConnection.close();

    peerConnection = null;

  }

  remoteVideo.srcObject = null;

  pendingCandidates = [];

}

/*
|--------------------------------------------------------------------------
| MICROPHONE
|--------------------------------------------------------------------------
*/

micButton.addEventListener(
  "click",
  () => {

    if (!localStream) {
      return;
    }

    const track =
      localStream.getAudioTracks()[0];

    if (!track) {
      return;
    }

    track.enabled =
      !track.enabled;

    micButton.classList.toggle(
      "active",
      track.enabled
    );

    micButton.textContent =
      track.enabled
        ? "🎙"
        : "🔇";

  }
);

/*
|--------------------------------------------------------------------------
| CAMERA
|--------------------------------------------------------------------------
*/

cameraButton.addEventListener(
  "click",
  () => {

    if (!localStream) {
      return;
    }

    const track =
      localStream.getVideoTracks()[0];

    if (!track) {
      return;
    }

    track.enabled =
      !track.enabled;

    cameraButton.classList.toggle(
      "active",
      track.enabled
    );

    cameraButton.textContent =
      track.enabled
        ? "◉"
        : "⊘";

  }
);

/*
|--------------------------------------------------------------------------
| REPORT
|--------------------------------------------------------------------------
*/

reportButton.addEventListener(
  "click",
  () => {

    if (!connected) {
      return;
    }

    send({
      type: "report"
    });

    alert(
      "Merci. Le signalement a été envoyé."
    );

  }
);

/*
|--------------------------------------------------------------------------
| CHAT
|--------------------------------------------------------------------------
*/

chatButton.addEventListener(
  "click",
  () => {

    chat.classList.add("open");

    setTimeout(() => {
      chatInput.focus();
    }, 200);

  }
);

closeChat.addEventListener(
  "click",
  () => {

    chat.classList.remove("open");

  }
);

chatForm.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    const text =
      chatInput.value.trim();

    if (!text || !connected) {
      return;
    }

    addMessage(
      text,
      true
    );

    send({
      type: "chat",
      data: {
        text
      }
    });

    chatInput.value = "";

  }
);

function addMessage(
  text,
  mine = false
) {

  const element =
    document.createElement("div");

  element.className =
    "message" +
    (mine ? " mine" : "");

  element.textContent =
    text;

  chatMessages.appendChild(
    element
  );

  chatMessages.scrollTop =
    chatMessages.scrollHeight;

}

function clearChat() {

  chatMessages.innerHTML = "";

}

async function handleChat(data) {

  if (
    data &&
    typeof data.text === "string"
  ) {

    addMessage(
      data.text,
      false
    );

  }

}

/*
|--------------------------------------------------------------------------
| STATUS
|--------------------------------------------------------------------------
*/

function setStatus(
  text,
  isConnected
) {

  statusText.textContent =
    text;

  status.classList.toggle(
    "connected",
    isConnected
  );

}

/*
|--------------------------------------------------------------------------
| OVERRIDE CHAT MESSAGE
|--------------------------------------------------------------------------
*/

const originalHandler =
  handleServerMessage;

handleServerMessage =
  async function(message) {

    if (message.type === "chat") {

      await handleChat(
        message.data
      );

      return;

    }

    return originalHandler(message);

  };

/*
|--------------------------------------------------------------------------
| START
|--------------------------------------------------------------------------
*/

(async function() {

  await startCamera();

  connectSocket();

})();

</script>

</body>
</html>
