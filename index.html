<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>
<title>Col'inCall</title>

<style>
:root{
    --bg:#080a10;
    --panel:#111521;
    --panel2:#181d2a;
    --border:#293143;
    --text:#f4f7fb;
    --muted:#8993a7;
    --accent:#6c63ff;
    --danger:#e5484d;
    --success:#28c76f;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* ============================================================
   AUTH
============================================================ */

.auth-screen{
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at top,
            rgba(108,99,255,.18),
            transparent 40%
        ),
        var(--bg);
}

.auth-box{
    width:min(420px,calc(100% - 30px));
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:30px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:800;
    margin-bottom:8px;
}

.logo span{
    color:var(--accent);
}

.auth-subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:25px;
}

.auth-tabs{
    display:flex;
    background:var(--panel2);
    border-radius:12px;
    padding:4px;
    margin-bottom:20px;
}

.auth-tabs button{
    flex:1;
    border:0;
    background:transparent;
    color:var(--muted);
    padding:11px;
    border-radius:9px;
}

.auth-tabs button.active{
    background:var(--accent);
    color:white;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    color:var(--muted);
    font-size:14px;
}

input{
    width:100%;
    border:1px solid var(--border);
    background:#0d111a;
    color:var(--text);
    border-radius:10px;
    padding:12px 14px;
    outline:none;
}

input:focus{
    border-color:var(--accent);
}

.primary-btn{
    width:100%;
    border:0;
    border-radius:10px;
    padding:12px;
    background:var(--accent);
    color:white;
    font-weight:700;
}

.error{
    color:#ff7075;
    margin-top:12px;
    text-align:center;
    min-height:20px;
    font-size:14px;
}

/* ============================================================
   TOPBAR
============================================================ */

.topbar{
    height:64px;
    min-height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    z-index:100;
}

.top-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.top-logo{
    font-size:21px;
    font-weight:800;
}

.top-logo span{
    color:var(--accent);
}

.top-user{
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--muted);
    font-size:14px;
}

.avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--accent);
    color:white;
    font-weight:700;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.icon-btn,
.secondary-btn,
.danger-btn{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    border-radius:9px;
    padding:9px 12px;
}

.icon-btn:hover,
.secondary-btn:hover{
    border-color:var(--accent);
}

.danger-btn{
    background:rgba(229,72,77,.12);
    border-color:rgba(229,72,77,.4);
    color:#ff7b80;
}

.admin-btn{
    background:rgba(108,99,255,.15);
    border-color:rgba(108,99,255,.5);
    color:#aaa5ff;
}

/* ============================================================
   LOBBY
============================================================ */

.lobby{
    flex:1;
    min-height:0;
    display:flex;
    overflow:hidden;
}

.lobby-main{
    flex:1;
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.lobby-header{
    padding:18px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid var(--border);
}

.lobby-header h2{
    margin:0;
    white-space:nowrap;
}

.search{
    flex:1;
    max-width:450px;
}

.room-list{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:18px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:14px;
}

.room-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:17px;
    min-height:145px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition:.2s;
}

.room-card:hover{
    border-color:var(--accent);
    transform:translateY(-1px);
}

.room-card h3{
    margin:0 0 8px;
}

.room-count{
    color:var(--muted);
    font-size:14px;
}

.room-card button{
    border:0;
    border-radius:9px;
    padding:10px;
    background:var(--accent);
    color:white;
    font-weight:700;
}

/* ============================================================
   CHAT
============================================================ */

.chat-sidebar,
.room-chat{
    width:340px;
    min-width:340px;
    display:flex;
    flex-direction:column;
    background:var(--panel);
    border-left:1px solid var(--border);
    min-height:0;
}

.chat-header{
    height:60px;
    min-height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    border-bottom:1px solid var(--border);
}

.chat-header h3{
    margin:0;
    font-size:16px;
}

.chat-close{
    display:none;
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:22px;
}

.chat-messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:15px;
}

.chat-message{
    margin-bottom:12px;
}

.chat-message .message-head{
    display:flex;
    gap:7px;
    align-items:center;
    margin-bottom:3px;
}

.chat-message .message-user{
    font-size:13px;
    font-weight:700;
}

.chat-message .message-time{
    color:var(--muted);
    font-size:11px;
}

.chat-message .message-text{
    color:#dfe4ef;
    font-size:14px;
    line-height:1.4;
    word-break:break-word;
}

.chat-input{
    padding:12px;
    border-top:1px solid var(--border);
    display:flex;
    gap:8px;
}

.chat-input input{
    flex:1;
}

.chat-send{
    width:45px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:white;
}

/* ============================================================
   ROOM
============================================================ */

.room-screen{
    flex:1;
    min-height:0;
    display:flex;
    overflow:hidden;
}

.room-main{
    flex:1;
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.room-top{
    height:60px;
    min-height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    border-bottom:1px solid var(--border);
}

.room-title{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.room-title strong{
    font-size:17px;
}

.room-status{
    color:var(--muted);
    font-size:13px;
}

.video-grid{
    flex:1;
    min-height:0;
    padding:12px;
    display:grid;
    gap:12px;
    overflow:auto;
    grid-template-columns:repeat(2,minmax(0,1fr));
    grid-auto-rows:minmax(180px,1fr);
}

.video-card{
    position:relative;
    min-width:0;
    min-height:180px;
    overflow:hidden;
    background:#05070b;
    border:1px solid var(--border);
    border-radius:14px;
}

.video-card video{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    background:#05070b;
}

.video-name{
    position:absolute;
    left:10px;
    bottom:10px;
    padding:5px 9px;
    background:rgba(0,0,0,.6);
    border-radius:7px;
    font-size:12px;
    z-index:2;
}

.camera-off{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle,
            #222938,
            #080a10
        );
    color:var(--muted);
    font-size:34px;
    z-index:1;
}

.room-controls{
    height:76px;
    min-height:76px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    border-top:1px solid var(--border);
    background:var(--panel);
}

.media-btn{
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel2);
    color:white;
    font-size:19px;
}

.media-btn.active{
    background:var(--success);
    border-color:var(--success);
}

.leave-btn{
    width:55px;
    height:55px;
    border-radius:50%;
    border:0;
    background:var(--danger);
    color:white;
    font-size:20px;
}

/* ============================================================
   MOBILE CHAT BUTTON
============================================================ */

.mobile-chat-toggle{
    display:none;
}

.unread-badge{
    display:none;
    min-width:19px;
    height:19px;
    padding:0 5px;
    border-radius:20px;
    background:var(--danger);
    color:white;
    font-size:11px;
    font-weight:700;
    align-items:center;
    justify-content:center;
}

.unread-badge.visible{
    display:flex;
}

.mobile-chat-backdrop{
    display:none;
}

/* ============================================================
   MODALS
============================================================ */

.modal{
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:min(800px,100%);
    max-height:90vh;
    overflow:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px;
    border-bottom:1px solid var(--border);
}

.modal-header h3{
    margin:0;
}

.close-modal{
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:24px;
}

.modal-body{
    padding:18px;
}

.profile-row{
    margin-bottom:14px;
}

.profile-label{
    color:var(--muted);
    font-size:12px;
    margin-bottom:5px;
}

.admin-tabs{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.admin-tabs button{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--muted);
    border-radius:8px;
    padding:9px 12px;
}

.admin-tabs button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:white;
}

.admin-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:9px;
    background:#0d111a;
}

.admin-info{
    min-width:0;
}

.admin-name{
    font-weight:700;
}

.admin-meta{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.admin-actions{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.admin-actions button{
    border:1px solid var(--border);
    background:var(--panel2);
    color:white;
    border-radius:7px;
    padding:7px 9px;
    font-size:12px;
}

/* ============================================================
   NOTIFICATION GENERAL
============================================================ */

.chat-notification{
    position:fixed;
    top:78px;
    right:20px;
    z-index:9999;
    max-width:330px;
    background:var(--panel);
    border:1px solid var(--border);
    border-left:4px solid var(--accent);
    border-radius:10px;
    padding:12px 14px;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
    animation:notificationIn .25s ease;
}

.chat-notification strong{
    display:block;
    margin-bottom:4px;
}

.chat-notification span{
    color:var(--muted);
    font-size:13px;
}

@keyframes notificationIn{
    from{
        opacity:0;
        transform:translateY(-10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ============================================================
   MOBILE
============================================================ */

@media(max-width:700px){

    .topbar{
        padding:0 10px;
    }

    .top-logo{
        font-size:18px;
    }

    .top-user{
        display:none;
    }

    .top-actions{
        gap:5px;
    }

    .admin-btn,
    .secondary-btn{
        padding:8px 9px;
        font-size:12px;
    }

    .lobby{
        flex-direction:column;
        min-height:0;
    }

    .lobby-main{
        min-height:0;
    }

    .lobby-header{
        flex-direction:column;
        align-items:stretch;
        padding:12px;
    }

    .lobby-header h2{
        font-size:18px;
    }

    .search{
        width:100%;
        max-width:none;
    }

    .room-list{
        grid-template-columns:1fr;
        padding:12px;
    }

    /*
     * Les chats ne prennent plus de place dans la page.
     * Ils deviennent des panneaux coulissants depuis le bas.
     */
    .chat-sidebar,
    .room-chat{
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        width:100%;
        min-width:0;
        height:min(62vh,520px);
        max-height:calc(100vh - 70px);
        transform:translateY(105%);
        opacity:0;
        pointer-events:none;
        z-index:850;
        border-left:0;
        border-top:1px solid var(--border);
        border-radius:20px 20px 0 0;
        box-shadow:0 -20px 60px rgba(0,0,0,.55);
        transition:
            transform .28s ease,
            opacity .28s ease;
    }

    .chat-sidebar.mobile-open,
    .room-chat.mobile-open{
        transform:translateY(0);
        opacity:1;
        pointer-events:auto;
    }

    .chat-close{
        display:block;
    }

    .mobile-chat-backdrop{
        display:block;
        position:fixed;
        inset:0;
        z-index:840;
        background:rgba(0,0,0,.5);
        opacity:0;
        pointer-events:none;
        transition:opacity .25s ease;
    }

    .mobile-chat-backdrop.active{
        opacity:1;
        pointer-events:auto;
    }

    .mobile-chat-toggle{
        position:fixed;
        left:50%;
        bottom:calc(12px + env(safe-area-inset-bottom));
        transform:translateX(-50%);
        z-index:800;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:7px;
        border:1px solid var(--border);
        border-radius:999px;
        background:var(--panel);
        color:var(--text);
        padding:10px 15px;
        box-shadow:0 10px 35px rgba(0,0,0,.45);
        white-space:nowrap;
    }

    .room-chat-toggle{
        bottom:calc(87px + env(safe-area-inset-bottom));
    }

    .room-screen{
        position:relative;
        min-height:0;
        flex-direction:column;
    }

    .room-main{
        min-height:0;
        height:100%;
    }

    .room-top{
        padding:0 12px;
    }

    .room-title strong{
        font-size:15px;
    }

    /*
     * 2 personnes et 3 personnes utilisent toutes les deux
     * une grille de 2 colonnes.
     */
    .video-grid{
        grid-template-columns:repeat(2,minmax(0,1fr)) !important;
        grid-auto-rows:minmax(150px,1fr);
        padding:8px;
        gap:8px;
    }

    .video-card{
        min-height:150px;
    }

    .room-controls{
        height:76px;
        min-height:76px;
        padding-bottom:env(safe-area-inset-bottom);
    }

    .chat-input{
        padding-bottom:calc(12px + env(safe-area-inset-bottom));
    }

    .chat-notification{
        right:10px;
        left:10px;
        max-width:none;
    }

    .admin-item{
        flex-direction:column;
        align-items:stretch;
    }

    .admin-actions{
        width:100%;
    }
}
</style>
</head>

<body>

<!-- ============================================================
     AUTH
============================================================ -->

<div id="authScreen" class="auth-screen">

    <div class="auth-box">

        <div class="logo">
            Col'in<span>Call</span>
        </div>

        <div class="auth-subtitle">
            Discussion vidéo et salons
        </div>

        <div class="auth-tabs">
            <button
                id="userTab"
                class="active"
                type="button"
            >
                Utilisateur
            </button>

            <button
                id="adminTab"
                type="button"
            >
                Administrateur
            </button>
        </div>

        <div class="form-group">

            <label for="usernameInput">
                Nom d'utilisateur
            </label>

            <input
                id="usernameInput"
                type="text"
                autocomplete="username"
                maxlength="30"
                placeholder="Votre pseudo"
            >

        </div>

        <div
            id="passwordField"
            class="form-group"
            style="display:none;"
        >

            <label for="passwordInput">
                Code administrateur
            </label>

            <input
                id="passwordInput"
                type="password"
                autocomplete="current-password"
                placeholder="Code"
            >

        </div>

        <button
            id="loginButton"
            class="primary-btn"
            type="button"
        >
            Se connecter
        </button>

        <div
            id="loginError"
            class="error"
        ></div>

    </div>

</div>

<!-- ============================================================
     APPLICATION
============================================================ -->

<div
    id="app"
    class="app"
    style="display:none;"
>

    <!-- ========================================================
         TOP BAR
    ========================================================= -->

    <div class="topbar">

        <div class="top-left">

            <div class="top-logo">
                Col'in<span>Call</span>
            </div>

            <div class="top-user">

                <div
                    id="topAvatar"
                    class="avatar"
                >
                    ?
                </div>

                <span id="topUsername">
                    -
                </span>

            </div>

        </div>

        <div class="top-actions">

            <!-- IMPORTANT :
                 Ce bouton reste dans la topbar générale,
                 donc il reste visible même dans un salon. -->
            <button
                id="adminButton"
                class="secondary-btn admin-btn"
                type="button"
                style="display:none;"
            >
                ⚙ Admin
            </button>

            <button
                id="profileButton"
                class="secondary-btn"
                type="button"
            >
                Profil
            </button>

        </div>

    </div>

    <!-- ========================================================
         LOBBY
    ========================================================= -->

    <div
        id="lobbyScreen"
        class="lobby"
        style="display:none;"
    >

        <div class="lobby-main">

            <div class="lobby-header">

                <h2>
                    Salons
                </h2>

                <input
                    id="roomSearch"
                    class="search"
                    type="text"
                    autocomplete="off"
                    placeholder="Rechercher un salon..."
                >

                <button
                    id="createRoomButton"
                    class="primary-btn"
                    type="button"
                    style="width:auto;"
                >
                    + Créer un salon
                </button>

            </div>

            <div
                id="roomList"
                class="room-list"
            ></div>

        </div>

        <!-- DISCUSSION GENERALE -->

        <div
            id="lobbyChatSidebar"
            class="chat-sidebar"
        >

            <div class="chat-header">

                <h3>
                    Discussion générale
                </h3>

                <button
                    class="chat-close"
                    type="button"
                    onclick="closeMobileChat()"
                >
                    ×
                </button>

            </div>

            <div
                id="lobbyChatMessages"
                class="chat-messages"
            ></div>

            <div class="chat-input">

                <input
                    id="lobbyChatInput"
                    type="text"
                    maxlength="1000"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="sentences"
                    spellcheck="false"
                    placeholder="Écrire un message..."
                >

                <button
                    id="lobbyChatSend"
                    class="chat-send"
                    type="button"
                >
                    ➤
                </button>

            </div>

        </div>

        <button
            id="lobbyChatToggle"
            class="mobile-chat-toggle"
            type="button"
        >
            💬 Discussion générale
        </button>

    </div>

    <!-- ========================================================
         ROOM
    ========================================================= -->

    <div
        id="roomScreen"
        class="room-screen"
        style="display:none;"
    >

        <div class="room-main">

            <div class="room-top">

                <div class="room-title">

                    <strong id="roomName">
                        Salon
                    </strong>

                    <span
                        id="roomStatus"
                        class="room-status"
                    >
                        0 personne
                    </span>

                </div>

/* ============================================================

/* ============================================================
   WEBSOCKET
============================================================ */

function connectSocket(){

    if (
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ){
        return;
    }

    socket =
        new WebSocket(SERVER_URL);

    socket.addEventListener(
        "open",
        () => {

            const savedSession =
                localStorage.getItem(
                    "colincall_session"
                );

            if (savedSession){

                try{

                    const session =
                        JSON.parse(
                            savedSession
                        );

                    if (session.token){

                        send({
                            type:
                                "restore-session",
                            token:
                                session.token
                        });

                        return;
                    }

                }catch(error){

                    localStorage.removeItem(
                        "colincall_session"
                    );
                }
            }
        }
    );

    socket.addEventListener(
        "message",
        event => {

            let message;

            try{

                message =
                    JSON.parse(
                        event.data
                    );

            }catch(error){

                return;
            }

            handleMessage(message);
        }
    );

    socket.addEventListener(
        "close",
        () => {

            /*
             * On ne supprime pas la session.
             * Une reconnexion pourra restaurer
             * l'utilisateur.
             */

            setTimeout(
                () => {

                    if (
                        currentUser
                    ){
                        connectSocket();
                    }

                },
                1500
            );
        }
    );
}

function send(data){

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ){
        return false;
    }

    socket.send(
        JSON.stringify(data)
    );

    return true;
}

/* ============================================================
   AUTH
============================================================ */

userTab.addEventListener(
    "click",
    () => {

        loginMode = "user";

        userTab.classList.add("active");
        adminTab.classList.remove("active");

        passwordField.style.display =
            "none";

        passwordInput.value = "";

        loginError.textContent = "";
    }
);

adminTab.addEventListener(
    "click",
    () => {

        loginMode = "admin";

        adminTab.classList.add("active");
        userTab.classList.remove("active");

        passwordField.style.display =
            "block";

        loginError.textContent = "";
    }
);

loginButton.addEventListener(
    "click",
    login
);

usernameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ){

            if (
                loginMode === "admin"
            ){

                passwordInput.focus();

            }else{

                login();
            }
        }
    }
);

passwordInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ){
            login();
        }
    }
);

function login(){

    const username =
        usernameInput.value.trim();

    const password =
        passwordInput.value;

    if (!username){

        loginError.textContent =
            "Nom d'utilisateur obligatoire.";

        return;
    }

    loginError.textContent = "";

    connectSocket();

    const waitForSocket =
        setInterval(
            () => {

                if (
                    socket &&
                    socket.readyState === WebSocket.OPEN
                ){

                    clearInterval(
                        waitForSocket
                    );

                    send({
                        type:"login",
                        username,
                        password
                    });
                }

            },
            100
        );

    setTimeout(
        () => {
            clearInterval(
                waitForSocket
            );
        },
        10000
    );
}

/* ============================================================
   HANDLE SERVER MESSAGE
============================================================ */

function handleMessage(message){

    switch(message.type){

        case "connected":
            break;

        case "login-success":
            handleLoginSuccess(
                message
            );
            break;

        case "session-restored":
            handleSessionRestored(
                message
            );
            break;

        case "session-invalid":

            localStorage.removeItem(
                "colincall_session"
            );

            currentUser = null;

            showAuth();

            break;

        case "login-error":

            loginError.textContent =
                message.message ||
                "Erreur de connexion.";

            break;

        case "room-list":

            rooms =
                message.rooms || [];

            renderRooms();

            break;

        case "user-list":

            users =
                message.users || [];

            updateRoomStatus();

            if (
                adminModal.style.display ===
                "flex"
            ){
                renderAdmin();
            }

            break;

        case "room-created":

            renderRooms();

            break;

        case "room-joined":

            handleRoomJoined(
                message
            );

            break;

        case "user-joined":

            handleUserJoined(
                message
            );

            break;

        case "user-left":

            handleUserLeft(
                message
            );

            break;

        case "left-room":

            break;

        case "chat-message":

            addChatMessage(
                message
            );

            break;

        case "offer":

            receiveOffer(
                message
            );

            break;

        case "answer":

            receiveAnswer(
                message
            );

            break;

        case "candidate":

            receiveCandidate(
                message
            );

            break;

        case "remote-media-state":

            handleRemoteMediaState(
                message
            );

            break;

        case "force-media-state":

            handleForceMediaState(
                message
            );

            break;

        case "room-deleted":

            handleRoomDeleted(
                message
            );

            break;

        case "force-lobby":

            forceLobby();

            break;

        case "kicked":

            alert(
                message.message ||
                "Vous avez été exclu."
            );

            break;

        case "admin-data":

            rooms =
                message.rooms || [];

            users =
                message.users || [];

            renderAdmin();

            break;

        case "admin-error":

            alert(
                message.message ||
                "Erreur administrateur."
            );

            break;

        case "error":

            alert(
                message.message ||
                "Erreur."
            );

            break;
    }
}

/* ============================================================
   LOGIN SUCCESS / RESTORE
============================================================ */

function handleLoginSuccess(message){

    currentUser =
        message.user;

    currentUser.isAdmin =
        !!message.isAdmin;

    if (
        message.sessionToken
    ){

        localStorage.setItem(
            "colincall_session",
            JSON.stringify({
                token:
                    message.sessionToken
            })
        );
    }

    showApplication();
}

function handleSessionRestored(message){

    currentUser =
        message.user;

    currentUser.isAdmin =
        !!message.isAdmin;

    showApplication();
}

function showApplication(){

    authScreen.style.display =
        "none";

    app.style.display =
        "flex";

    topUsername.textContent =
        currentUser.username;

    topAvatar.textContent =
        currentUser.username
            .charAt(0)
            .toUpperCase();

    /*
     * Le bouton Admin dépend uniquement du compte,
     * pas de l'écran actuel.
     *
     * Il reste donc visible dans le lobby ET dans un salon.
     */
    if (
        currentUser.isAdmin
    ){

        adminButton.style.display =
            "block";

    }else{

        adminButton.style.display =
            "none";
    }

    showLobby();

    /*
     * Empêche un navigateur mobile de restaurer
     * un ancien texte dans les champs de chat.
     */
    lobbyChatInput.value = "";
    roomChatInput.value = "";
}

function showAuth(){

    authScreen.style.display =
        "flex";

    app.style.display =
        "none";

    closeMobileChat();
}

/* ============================================================
   LOBBY
============================================================ */

function showLobby(){

    closeMobileChat();

    roomScreen.style.display =
        "none";

    lobbyScreen.style.display =
        "flex";

    currentRoom = null;

    roomUnreadMessages = 0;

    updateUnreadBadge();

    renderRooms();
}

function renderRooms(){

    const search =
        roomSearch.value
            .trim()
            .toLowerCase();

    roomList.innerHTML = "";

    const filtered =
        rooms.filter(
            room =>
                room.name
                    .toLowerCase()
                    .includes(search)
        );

    if (!filtered.length){

        const empty =
            document.createElement("div");

        empty.style.color =
            "var(--muted)";

        empty.textContent =
            "Aucun salon trouvé.";

        roomList.appendChild(
            empty
        );

        return;
    }

    filtered.forEach(
        room => {

            const card =
                document.createElement("div");

            card.className =
                "room-card";

            const content =
                document.createElement("div");

            const title =
                document.createElement("h3");

            title.textContent =
                room.name;

            const count =
                document.createElement("div");

            count.className =
                "room-count";

            count.textContent =
                `${room.userCount} personne${
                    room.userCount > 1
                        ? "s"
                        : ""
                }`;

            content.appendChild(
                title
            );

            content.appendChild(
                count
            );

            const button =
                document.createElement("button");

            button.type =
                "button";

            button.textContent =
                "Rejoindre";

            button.addEventListener(
                "click",
                () => joinRoom(room.id)
            );

            card.appendChild(
                content
            );

            card.appendChild(
                button
            );

            roomList.appendChild(
                card
            );
        }
    );
}

roomSearch.addEventListener(
    "input",
    renderRooms
);

createRoomButton.addEventListener(
    "click",
    createRoom
);

function createRoom(){

    const name =
        prompt(
            "Nom du salon :"
        );

    if (!name)
        return;

    const cleanName =
        name.trim();

    if (!cleanName)
        return;

    send({
        type:
            "create-room",
        name:
            cleanName
    });
}

/* ============================================================
   ROOM
============================================================ */

function joinRoom(roomId){

    if (!roomId)
        return;

    prepareLocalMedia()
        .then(
            () => {

                /*
                 * Caméra et micro toujours désactivés
                 * à l'entrée.
                 */
                if (localStream){

                    localStream
                        .getAudioTracks()
                        .forEach(
                            track =>
                                track.enabled =
                                    false
                        );

                    localStream
                        .getVideoTracks()
                        .forEach(
                            track =>
                                track.enabled =
                                    false
                        );
                }

                microphoneEnabled =
                    false;

                cameraEnabled =
                    false;

                updateControlButton(
                    microBtn,
                    false
                );

                updateControlButton(
                    cameraBtn,
                    false
                );

                send({
                    type:
                        "join-room",
                    roomId
                });
            }
        )
        .catch(
            error => {

                console.error(
                    error
                );

                /*
                 * Si l'accès caméra/micro est refusé,
                 * on tente quand même d'entrer dans le salon.
                 */
                send({
                    type:
                        "join-room",
                    roomId
                });
            }
        );
}

async function prepareLocalMedia(){

    if (localStream)
        return localStream;

    localStream =
        await navigator.mediaDevices.getUserMedia({
            video:true,
            audio:true
        });

    localStream
        .getAudioTracks()
        .forEach(
            track =>
                track.enabled = false
        );

    localStream
        .getVideoTracks()
        .forEach(
            track =>
                track.enabled = false
        );

    return localStream;
}

function handleRoomJoined(message){

    currentRoom =
        message.room;

    currentUser.roomId =
        currentRoom.id;

    currentUser.microphoneEnabled =
        false;

    currentUser.cameraEnabled =
        false;

    microphoneEnabled =
        false;

    cameraEnabled =
        false;

    roomUnreadMessages =
        0;

    updateUnreadBadge();

    closeMobileChat();

    lobbyScreen.style.display =
        "none";

    roomScreen.style.display =
        "flex";

    roomName.textContent =
        currentRoom.name;

    roomStatus.textContent =
        "1 personne";

    /*
     * On vide uniquement l'affichage du chat.
     * Le champ de saisie est explicitement vidé.
     */
    roomChatMessages.innerHTML = "";
    roomChatInput.value = "";

    videoGrid.innerHTML = "";

    addLocalVideo();

    const participants =
        message.participants || [];

    participants.forEach(
        user => {

            addVideoUser(
                user
            );

            createConnectionToUser(
                user,
                true
            );
        }
    );

    updateVideoGrid();

    updateRoomStatus();
}

function addLocalVideo(){

    const card =
        document.createElement("div");

    card.className =
        "video-card";

    card.dataset.userId =
        currentUser.id;

    const video =
        document.createElement("video");

    video.autoplay =
        true;

    video.muted =
        true;

    video.playsInline =
        true;

    if (localStream){

        video.srcObject =
            localStream;
    }

    const off =
        document.createElement("div");

    off.className =
        "camera-off";

    off.textContent =
        "📷";

    off.dataset.cameraOff =
        "true";

    const name =
        document.createElement("div");

    name.className =
        "video-name";

    name.textContent =
        currentUser.username;

    card.appendChild(
        video
    );

    card.appendChild(
        off
    );

    card.appendChild(
        name
    );

    videoGrid.appendChild(
        card
    );

    updateLocalCameraDisplay();
}

function addVideoUser(user){

    if (
        document.querySelector(
            `.video-card[data-user-id="${user.id}"]`
        )
    ){
        return;
    }

    const card =
        document.createElement("div");

    card.className =
        "video-card";

    card.dataset.userId =
        user.id;

    const video =
        document.createElement("video");

    video.autoplay =
        true;

    video.playsInline =
        true;

    const off =
        document.createElement("div");

    off.className =
        "camera-off";

    off.textContent =
        "📷";

    if (user.cameraEnabled){

        off.style.display =
            "none";

    }else{

        off.style.display =
            "flex";
    }

    const name =
        document.createElement("div");

    name.className =
        "video-name";

    name.textContent =
        user.username;

    card.appendChild(
        video
    );

    card.appendChild(
        off
    );

    card.appendChild(
        name
    );

    videoGrid.appendChild(
        card
    );

    updateVideoGrid();
}

function updateVideoGrid(){

    const count =
        videoGrid.querySelectorAll(
            ".video-card"
        ).length;

    /*
     * 1 personne = 1 colonne
     * 2 personnes = 2 colonnes
     * 3 personnes = 2 colonnes
     * 4 personnes = 2 colonnes
     * 5+ = 3 colonnes
     *
     * Le point important est que 2 personnes
     * utilisent la même grille de largeur que
     * le mode 3 personnes.
     */

    if (count <= 1){

        videoGrid.style.gridTemplateColumns =
            "1fr";

    }else if (count <= 4){

        videoGrid.style.gridTemplateColumns =
            "repeat(2,minmax(0,1fr))";

    }else{

        videoGrid.style.gridTemplateColumns =
            "repeat(3,minmax(0,1fr))";
    }
}

function updateRoomStatus(){

    if (!currentRoom)
        return;

    const count =
        users.filter(
            user =>
                user.roomId ===
                currentRoom.id
        ).length;

    /*
     * Le serveur peut ne pas encore avoir renvoyé
     * le user-list actualisé. On garantit au minimum
     * que l'utilisateur actuel est compté.
     */
    const finalCount =
        Math.max(
            count,
            videoGrid.querySelectorAll(
                ".video-card"
            ).length
        );

    roomStatus.textContent =
        `${finalCount} personne${
            finalCount > 1
                ? "s"
                : ""
        }`;
}

function handleUserJoined(message){

    if (!currentRoom)
        return;

    const user =
        message.user;

    if (!user)
        return;

    if (
        user.roomId !==
        currentRoom.id
    ){
        return;
    }

    addVideoUser(
        user
    );

    /*
     * Le nouvel utilisateur créera normalement
     * les offres vers les participants existants.
     */
    updateRoomStatus();
}

function handleUserLeft(message){

    const card =
        document.querySelector(
            `.video-card[data-user-id="${message.userId}"]`
        );

    if (card)
        card.remove();

    closePeer(
        message.userId
    );

    pendingCandidates.delete(
        message.userId
    );

    updateVideoGrid();
    updateRoomStatus();
}

/* ============================================================
   MEDIA
============================================================ */

microBtn.addEventListener(
    "click",
    toggleMicro
);

cameraBtn.addEventListener(
    "click",
    toggleCamera
);

async function toggleMicro(){

    if (!localStream){

        try{
            await prepareLocalMedia();
        }catch(error){
            alert(
                "Impossible d'accéder au microphone."
            );
            return;
        }
    }

    const tracks =
        localStream.getAudioTracks();

    if (!tracks.length){
        return;
    }

    microphoneEnabled =
        !microphoneEnabled;

    tracks.forEach(
        track =>
            track.enabled =
                microphoneEnabled
    );

    updateControlButton(
        microBtn,
        microphoneEnabled
    );

    send({
        type:
            "media-state",
        microphoneEnabled,
        cameraEnabled
    });

    if (currentUser){

        currentUser.microphoneEnabled =
            microphoneEnabled;
    }
}

async function toggleCamera(){

    if (!localStream){

        try{
            await prepareLocalMedia();
        }catch(error){
            alert(
                "Impossible d'accéder à la caméra."
            );
            return;
        }
    }

    const tracks =
        localStream.getVideoTracks();

    if (!tracks.length){
        return;
    }

    cameraEnabled =
        !cameraEnabled;

    tracks.forEach(
        track =>
            track.enabled =
                cameraEnabled
    );

    updateControlButton(
        cameraBtn,
        cameraEnabled
    );

    updateLocalCameraDisplay();

    send({
        type:
            "media-state",
        microphoneEnabled,
        cameraEnabled
    });

    if (currentUser){

        currentUser.cameraEnabled =
            cameraEnabled;
    }
}

function updateControlButton(
    button,
    enabled
){

    if (enabled){

        button.classList.add(
            "active"
        );

    }else{

        button.classList.remove(
            "active"
        );
    }
}

function updateLocalCameraDisplay(){

    const card =
        document.querySelector(
            `.video-card[data-user-id="${currentUser?.id}"]`
        );

    if (!card)
        return;

    const off =
        card.querySelector(
            ".camera-off"
        );

    if (!off)
        return;

    off.style.display =
        cameraEnabled
            ? "none"
            : "flex";
}

function handleRemoteMediaState(message){

    const card =
        document.querySelector(
            `.video-card[data-user-id="${message.userId}"]`
        );

    if (!card)
        return;

    const off =
        card.querySelector(
            ".camera-off"
        );

    if (!off)
        return;

    off.style.display =
        message.cameraEnabled
            ? "none"
            : "flex";
}

function handleForceMediaState(message){

    if (!localStream)
        return;

    if (
        typeof message.microphoneEnabled ===
        "boolean"
    ){

        microphoneEnabled =
            message.microphoneEnabled;

        localStream
            .getAudioTracks()
            .forEach(
                track =>
                    track.enabled =
                        microphoneEnabled
            );

        updateControlButton(
            microBtn,
            microphoneEnabled
        );
    }

    if (
        typeof message.cameraEnabled ===
        "boolean"
    ){

        cameraEnabled =
            message.cameraEnabled;

        localStream
            .getVideoTracks()
            .forEach(
                track =>
                    track.enabled =
                        cameraEnabled
            );

        updateControlButton(
            cameraBtn,
            cameraEnabled
        );

        updateLocalCameraDisplay();
    }

    if (currentUser){

        currentUser.microphoneEnabled =
            microphoneEnabled;

        currentUser.cameraEnabled =
            cameraEnabled;
    }
}

/* ============================================================
   WEBRTC
============================================================ */

const rtcConfig = {
    iceServers:[
        {
            urls:
                "stun:stun.l.google.com:19302"
        }
    ]
};

function createConnectionToUser(
    user,
    createOffer
){

    if (!user)
        return;

    if (
        user.id ===
        currentUser.id
    ){
        return;
    }

    if (
        peers.has(user.id)
    ){
        return peers.get(user.id);
    }

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );

    peers.set(
        user.id,
        pc
    );

    pendingCandidates.set(
        user.id,
        []
    );

    if (localStream){

        localStream
            .getTracks()
            .forEach(
                track => {

                    pc.addTrack(
                        track,
                        localStream
                    );
                }
            );
    }

    pc.onicecandidate =
        event => {

            if (
                event.candidate
            ){

                send({
                    type:
                        "candidate",

                    targetUserId:
                        user.id,

                    candidate:
                        event.candidate
                });
            }
        };

    pc.ontrack =
        event => {

            const card =
                document.querySelector(
                    `.video-card[data-user-id="${user.id}"]`
                );

            if (!card)
                return;

            const video =
                card.querySelector(
                    "video"
                );

            if (!video)
                return;

            video.srcObject =
                event.streams[0];
        };

    pc.onconnectionstatechange =
        () => {

            if (
                pc.connectionState ===
                    "failed" ||
                pc.connectionState ===
                    "closed" ||
                pc.connectionState ===
                    "disconnected"
            ){

                /*
                 * On ne supprime pas immédiatement
                 * pour éviter les faux déconnexions.
                 */
            }
        };

    if (createOffer){

        pc.createOffer()
            .then(
                offer =>
                    pc.setLocalDescription(
                        offer
                    )
            )
            .then(
                () => {

                    send({
                        type:
                            "offer",

                        targetUserId:
                            user.id,

                        offer:
                            pc.localDescription
                    });
                }
            )
            .catch(
                console.error
            );
    }

    return pc;
}

async function receiveOffer(message){

    const user =
        findUser(
            message.fromUserId
        );

    if (!user)
        return;

    let pc =
        peers.get(
            user.id
        );

    if (!pc){

        pc =
            createConnectionToUser(
                user,
                false
            );
    }

    await pc.setRemoteDescription(
        new RTCSessionDescription(
            message.offer
        )
    );

    await flushPendingCandidates(
        user.id
    );

    const answer =
        await pc.createAnswer();

    await pc.setLocalDescription(
        answer
    );

    send({
        type:
            "answer",

        targetUserId:
            user.id,

        answer:
            pc.localDescription
    });
}

async function receiveAnswer(message){

    const pc =
        peers.get(
            message.fromUserId
        );

    if (!pc)
        return;

    await pc.setRemoteDescription(
        new RTCSessionDescription(
            message.answer
        )
    );

    await flushPendingCandidates(
        message.fromUserId
    );
}

async function receiveCandidate(message){

    const pc =
        peers.get(
            message.fromUserId
        );

    if (
        !pc ||
        !pc.remoteDescription
    ){

        if (
            !pendingCandidates.has(
                message.fromUserId
            )
        ){

            pendingCandidates.set(
                message.fromUserId,
                []
            );
        }

        pendingCandidates
            .get(
                message.fromUserId
            )
            .push(
                message.candidate
            );

        return;
    }

    try{

        await pc.addIceCandidate(
            new RTCIceCandidate(
                message.candidate
            )
        );

    }catch(error){

        console.error(
            "ICE error:",
            error
        );
    }
}

async function flushPendingCandidates(
    userId
){

    const pc =
        peers.get(
            userId
        );

    const candidates =
        pendingCandidates.get(
            userId
        ) || [];

    if (
        !pc ||
        !pc.remoteDescription
    ){
        return;
    }

    for (
        const candidate
        of candidates
    ){

        try{

            await pc.addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

        }catch(error){

            console.error(
                error
            );
        }
    }

    pendingCandidates.set(
        userId,
        []
    );
}

function findUser(userId){

    return users.find(
        user =>
            user.id ===
            userId
    );
}

function closePeer(userId){

    const pc =
        peers.get(
            userId
        );

    if (pc){

        try{
            pc.close();
        }catch(error){}
    }

    peers.delete(
        userId
    );

    pendingCandidates.delete(
        userId
    );
}

function closeAllPeers(){

    for (
        const pc
        of peers.values()
    ){

        try{
            pc.close();
        }catch(error){}
    }

    peers.clear();
    pendingCandidates.clear();
}

/* ============================================================
   LEAVE ROOM
============================================================ */

leaveRoomButton.addEventListener(
    "click",
    leaveCurrentRoom
);

function leaveCurrentRoom(){

    if (!currentRoom)
        return;

    const confirmed =
        confirm(
            `Voulez-vous vraiment quitter le salon "${currentRoom.name}" ?`
        );

    if (!confirmed)
        return;

    send({
        type:
            "leave-room"
    });

    closeAllPeers();

    stopLocalMedia();

    currentRoom = null;

    if (currentUser){

        currentUser.roomId =
            null;
    }

    videoGrid.innerHTML = "";

    roomChatMessages.innerHTML = "";
    roomChatInput.value = "";

    roomUnreadMessages =
        0;

    updateUnreadBadge();

    showLobby();
}

function stopLocalMedia(){

    if (!localStream)
        return;

    localStream
        .getTracks()
        .forEach(
            track =>
                track.stop()
        );

    localStream =
        null;

    microphoneEnabled =
        false;

    cameraEnabled =
        false;
}

/* ============================================================
   CHAT
============================================================ */

lobbyChatSend.addEventListener(
    "click",
    sendLobbyChat
);

roomChatSend.addEventListener(
    "click",
    sendRoomChat
);

/*
 * IMPORTANT :
 * Aucun événement click/focus ne modifie la valeur
 * des champs de texte.
 *
 * Le clavier mobile sert uniquement à saisir du texte.
 */

lobbyChatInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendLobbyChat();
        }
    }
);

roomChatInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendRoomChat();
        }
    }
);

function sendLobbyChat(){

    const input =
        lobbyChatInput;

    const text =
        input.value.trim();

    if (!text)
        return;

    if (
        !send({
            type:
                "chat",
            text,
            roomId:
                null
        })
    ){
        return;
    }

    /*
     * On vide immédiatement le champ.
     * Aucun ancien message ne peut être remis dedans.
     */
    input.value = "";
}

function sendRoomChat(){

    if (!currentRoom)
        return;

    const input =
        roomChatInput;

    const text =
        input.value.trim();

    if (!text)
        return;

    if (
        !send({
            type:
                "chat",
            text,
            roomId:
                currentRoom.id
        })
    ){
        return;
    }

    /*
     * Même comportement ici :
     * uniquement envoi + nettoyage du champ.
     */
    input.value = "";
}

function addChatMessage(message){

    if (
        message.roomId
    ){

        /*
         * Le message appartient au salon actuel.
         */
        if (
            !currentRoom ||
            message.roomId !==
                currentRoom.id
        ){
            return;
        }

        appendChatMessage(
            roomChatMessages,
            message
        );

        /*
         * Message reçu d'un autre utilisateur :
         * pas de notification plein écran.
         *
         * Si le chat est fermé, on incrémente
         * uniquement le compteur du bouton.
         */
        if (
            message.userId !==
            currentUser?.id
        ){

            const chatOpen =
                roomChatSidebar.classList
                    .contains(
                        "mobile-open"
                    );

            if (!chatOpen){

                roomUnreadMessages++;

                updateUnreadBadge();
            }
        }

        return;
    }

    /*
     * Discussion générale
     */
    appendChatMessage(
        lobbyChatMessages,
        message
    );

    if (
        message.userId !==
        currentUser?.id
    ){

        /*
         * On conserve la notification
         * pour la discussion générale.
         */
        showChatNotification(
            message
        );
    }
}

function appendChatMessage(
    container,
    message
){

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "chat-message";

    const head =
        document.createElement("div");

    head.className =
        "message-head";

    const user =
        document.createElement("span");

    user.className =
        "message-user";

    user.textContent =
        message.username;

    const time =
        document.createElement("span");

    time.className =
        "message-time";

    time.textContent =
        formatTime(
            message.timestamp
        );

    const text =
        document.createElement("div");

    text.className =
        "message-text";

    /*
     * textContent et non innerHTML
     * pour empêcher l'injection HTML.
     */
    text.textContent =
        message.text;

    head.appendChild(
        user
    );

    head.appendChild(
        time
    );

    wrapper.appendChild(
        head
    );

    wrapper.appendChild(
        text
    );

    container.appendChild(
        wrapper
    );

    container.scrollTop =
        container.scrollHeight;
}

function formatTime(timestamp){

    if (!timestamp)
        return "";

    return new Date(
        timestamp
    ).toLocaleTimeString(
        "fr-FR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}

function showChatNotification(
    message
){

    const notification =
        document.createElement(
            "div"
        );

    notification.className =
        "chat-notification";

    const name =
        document.createElement(
            "strong"
        );

    name.textContent =
        message.username;

    const text =
        document.createElement(
            "span"
        );

    text.textContent =
        message.text;

    notification.appendChild(
        name
    );

    notification.appendChild(
        text
    );

    document.body.appendChild(
        notification
    );

    setTimeout(
        () => {

            notification.remove();

        },
        4000
    );
}

/* ============================================================
   MOBILE CHAT
============================================================ */

lobbyChatToggle.addEventListener(
    "click",
    () => {

        toggleMobileChat(
            "lobby"
        );
    }
);

roomChatToggle.addEventListener(
    "click",
    () => {

        toggleMobileChat(
            "room"
        );
    }
);

mobileChatBackdrop.addEventListener(
    "click",
    closeMobileChat
);

function toggleMobileChat(
    type
){

    const sidebar =
        type === "lobby"
            ? lobbyChatSidebar
            : roomChatSidebar;

    const alreadyOpen =
        sidebar.classList.contains(
            "mobile-open"
        );

    closeMobileChat();

    if (alreadyOpen)
        return;

    sidebar.classList.add(
        "mobile-open"
    );

    mobileChatBackdrop.classList.add(
        "active"
    );

    /*
     * Dès que le chat du salon est ouvert,
     * les messages reçus précédemment deviennent lus.
     */
    if (
        type === "room"
    ){

        roomUnreadMessages =
            0;

        updateUnreadBadge();

        /*
         * On place le focus uniquement sur l'input.
         * On ne modifie absolument pas sa valeur.
         */
        setTimeout(
            () => {

                roomChatInput.focus();

            },
            250
        );
    }
}

function closeMobileChat(){

    lobbyChatSidebar.classList.remove(
        "mobile-open"
    );

    roomChatSidebar.classList.remove(
        "mobile-open"
    );

    mobileChatBackdrop.classList.remove(
        "active"
    );
}

function updateUnreadBadge(){

    if (
        roomUnreadMessages > 0
    ){

        roomUnreadBadge.textContent =
            roomUnreadMessages > 99
                ? "99+"
                : roomUnreadMessages;

        roomUnreadBadge.classList.add(
            "visible"
        );

    }else{

        roomUnreadBadge.textContent =
            "0";

        roomUnreadBadge.classList.remove(
            "visible"
        );
    }
}

/* ============================================================
   ROOM DELETED / FORCE LOBBY
============================================================ */

function handleRoomDeleted(message){

    if (
        !currentRoom ||
        message.roomId !==
            currentRoom.id
    ){
        return;
    }

    alert(
        "Ce salon a été supprimé par l'administrateur."
    );

    closeAllPeers();

    stopLocalMedia();

    currentRoom =
        null;

    if (currentUser){

        currentUser.roomId =
            null;
    }

    videoGrid.innerHTML =
        "";

    roomChatMessages.innerHTML =
        "";

    roomUnreadMessages =
        0;

    updateUnreadBadge();

    showLobby();
}

function forceLobby(){

    closeAllPeers();

    stopLocalMedia();

    currentRoom =
        null;

    if (currentUser){

        currentUser.roomId =
            null;
    }

    videoGrid.innerHTML =
        "";

    roomChatMessages.innerHTML =
        "";

    roomUnreadMessages =
        0;

    updateUnreadBadge();

    showLobby();
}

   PROFILE
============================================================ */

profileButton.addEventListener(

    openProfileModal
);

function openProfileModal(){

    closeMobileChat();

    if (!currentUser)
        return;

function closeProfileModal(){

}

profileModal.addEventListener(

            event.target ===

        ){

    }
);

/* ============================================================
   ADMIN
============================================================ */

adminButton.addEventListener(
    "click",
    openAdminModal
);

adminUsersTab.addEventListener(
    "click",
    () => {

        currentAdminTab =
            "users";

        renderAdmin();
    }
);

adminRoomsTab.addEventListener(
    "click",
    () => {

        currentAdminTab =
            "rooms";

        renderAdmin();
    }
);

function openAdminModal(){

    if (
        !currentUser ||
        !currentUser.isAdmin
    ){
        return;
    }

    closeMobileChat();

    adminModal.style.display =
        "flex";

    currentAdminTab =
        "users";

    send({
        type:
            "admin-refresh"
    });
}

function closeAdminModal(){

    adminModal.style.display =
        "none";
}

adminModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            adminModal
        ){

            closeAdminModal();
        }
    }
);

function renderAdmin(){

    adminUsersTab.classList.toggle(
        "active",
        currentAdminTab ===
            "users"
    );

    adminRoomsTab.classList.toggle(
        "active",
        currentAdminTab ===
            "rooms"
    );

    adminList.innerHTML = "";

    if (
        currentAdminTab ===
        "users"
    ){

        renderAdminUsers();

    }else{

        renderAdminRooms();
    }
}

function renderAdminUsers(){

    users.forEach(
        user => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "admin-item";

            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "admin-info";

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "admin-name";

            name.textContent =
                user.username +
                (
                    user.isAdmin
                        ? " 👑"
                        : ""
                );

            const meta =
                document.createElement(
                    "div"
                );

            meta.className =
                "admin-meta";

            meta.textContent =
                user.roomId
                    ? `Salon : ${user.roomId}`
                    : "Dans le lobby";

            info.appendChild(
                name
            );

            info.appendChild(
                meta
            );

            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "admin-actions";

            if (
                user.id !==
                currentUser.id
            ){

                const mute =
                    document.createElement(
                        "button"
                    );

                mute.textContent =
                    "🔇 Mute";

                mute.addEventListener(
                    "click",
                    () => {

                        send({
                            type:
                                "admin-mute",
                            userId:
                                user.id
                        });
                    }
                );

                const camera =
                    document.createElement(
                        "button"
                    );

                camera.textContent =
                    "📷 Couper caméra";

                camera.addEventListener(
                    "click",
                    () => {

                        send({
                            type:
                                "admin-camera",
                            userId:
                                user.id
                        });
                    }
                );

                const kick =
                    document.createElement(
                        "button"
                    );

                kick.textContent =
                    "🚫 Exclure";

                kick.addEventListener(
                    "click",
                    () => {

                        if (
                            confirm(
                                `Exclure ${user.username} ?`
                            )
                        ){

                            send({
                                type:
                                    "admin-kick",
                                userId:
                                    user.id
                            });
                        }
                    }
                );

                actions.appendChild(
                    mute
                );

                actions.appendChild(
                    camera
                );

                actions.appendChild(
                    kick
                );
            }

            item.appendChild(
                info
            );

            item.appendChild(
                actions
            );

            adminList.appendChild(
                item
            );
        }
    );
}

function renderAdminRooms(){

    rooms.forEach(
        room => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "admin-item";

            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "admin-info";

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "admin-name";

            name.textContent =
                room.name;

            const meta =
                document.createElement(
                    "div"
                );

            meta.className =
                "admin-meta";

            meta.textContent =
                `${room.userCount} personne${
                    room.userCount > 1
                        ? "s"
                        : ""
                }`;

            info.appendChild(
                name
            );

            info.appendChild(
                meta
            );

            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "admin-actions";

            if (!room.permanent){

                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.textContent =
                    "🗑 Supprimer";

                deleteButton.addEventListener(
                    "click",
                    () => {

                        if (
                            confirm(
                                `Supprimer le salon "${room.name}" ?`
                            )
                        ){

                            send({
                                type:
                                    "admin-delete-room",
                                roomId:
                                    room.id
                            });
                        }
                    }
                );

                actions.appendChild(
                    deleteButton
                );
            }

            item.appendChild(
                info
            );

            item.appendChild(
                actions
            );

            adminList.appendChild(
                item
            );
        }
    );
}

============================================================ */

roomChatInput.value = "";
