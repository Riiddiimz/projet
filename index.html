<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Col'inCall</title>

<style>

/* ==========================================================
VARIABLES
========================================================== */

:root{

    --bg:#080a10;
    --panel:#111521;
    --panel2:#181d2a;
    --border:#293143;

    --text:#f4f7fb;
    --muted:#8993a7;

    --accent:#6c63ff;

    --danger:#e5484d;
    --success:#28c76f;
}


/* ==========================================================
RESET
========================================================== */

*{

    box-sizing:border-box;

    margin:0;
    padding:0;
}


html,
body{

    width:100%;
    height:100%;

    overflow:hidden;
}


body{

    background:var(--bg);

    color:var(--text);

    font-family:
        Inter,
        Arial,
        sans-serif;
}


/* ==========================================================
BUTTONS
========================================================== */

button{

    border:0;

    cursor:pointer;

    font:inherit;
}


button:disabled{

    opacity:.5;

    cursor:not-allowed;
}


/* ==========================================================
AUTH
========================================================== */

.auth-screen{

    position:fixed;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        radial-gradient(
            circle at top,
            #171b32 0%,
            var(--bg) 55%
        );

    padding:20px;
}


.auth-box{

    width:100%;

    max-width:420px;

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:20px;

    padding:30px;

    box-shadow:
        0 20px 80px
        rgba(0,0,0,.45);
}


.auth-title{

    text-align:center;

    margin-bottom:25px;
}


.auth-title h1{

    font-size:32px;

    margin-bottom:8px;
}


.auth-title p{

    color:var(--muted);
}


.auth-tabs{

    display:flex;

    gap:8px;

    margin-bottom:20px;
}


.auth-tab{

    flex:1;

    padding:12px;

    border-radius:10px;

    background:var(--panel2);

    color:var(--muted);
}


.auth-tab.active{

    background:var(--accent);

    color:white;
}


.form-group{

    margin-bottom:15px;
}


.form-group label{

    display:block;

    margin-bottom:7px;

    color:var(--muted);

    font-size:14px;
}


.form-group input{

    width:100%;

    padding:13px 14px;

    border-radius:10px;

    border:1px solid var(--border);

    background:#0c0f17;

    color:white;

    outline:none;
}


.form-group input:focus{

    border-color:var(--accent);
}


.login-button{

    width:100%;

    padding:13px;

    border-radius:10px;

    background:var(--accent);

    color:white;

    font-weight:700;

    margin-top:5px;
}


.login-error{

    color:var(--danger);

    text-align:center;

    font-size:14px;

    min-height:20px;

    margin-top:12px;
}


/* ==========================================================
APP
========================================================== */

.app{

    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;
}


/* ==========================================================
TOPBAR
========================================================== */

.topbar{

    height:64px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0
        20px;

    background:var(--panel);

    border-bottom:
        1px solid
        var(--border);
}


.logo{

    font-size:20px;

    font-weight:800;
}


.top-user{

    display:flex;

    align-items:center;

    gap:10px;
}


.avatar{

    width:36px;
    height:36px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:var(--accent);

    color:white;

    font-weight:700;
}


.top-username{

    font-weight:600;
}


.admin-button{

    padding:
        8px
        12px;

    border-radius:8px;

    background:var(--panel2);

    color:white;

    border:
        1px solid
        var(--border);
}


/* ==========================================================
LOBBY
========================================================== */

.lobby{

    flex:1;

    min-height:0;

    display:flex;
}


.lobby-main{

    flex:1;

    min-width:0;

    min-height:0;

    display:flex;

    flex-direction:column;
}


.lobby-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:20px;

    border-bottom:
        1px solid
        var(--border);
}


.lobby-title h1{

    font-size:26px;

    margin-bottom:5px;
}


.lobby-title p{

    color:var(--muted);

    font-size:14px;
}


.room-actions{

    display:flex;

    align-items:center;

    gap:10px;
}


.search{

    width:240px;

    padding:11px 13px;

    border-radius:9px;

    border:
        1px solid
        var(--border);

    background:var(--panel2);

    color:white;

    outline:none;
}


.create-room-button{

    padding:
        11px
        14px;

    border-radius:9px;

    background:var(--accent);

    color:white;

    font-weight:700;
}


/* ==========================================================
ROOM LIST
========================================================== */

.room-list{

    flex:1;

    min-height:0;

    overflow:auto;

    padding:20px;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(240px,1fr)
        );

    gap:15px;

    align-content:start;
}


.room-card{

    background:var(--panel);

    border:
        1px solid
        var(--border);

    border-radius:14px;

    padding:18px;

    cursor:pointer;

    transition:
        border-color .2s,
        transform .2s;
}


.room-card:hover{

    border-color:var(--accent);

    transform:translateY(-2px);
}


.room-card h3{

    margin-bottom:8px;
}


.room-card p{

    color:var(--muted);

    font-size:14px;
}


.room-count{

    margin-top:15px;

    color:var(--muted);

    font-size:13px;
}


/* ==========================================================
CHAT
========================================================== */

.chat-sidebar,
.room-chat{

    width:340px;

    flex-shrink:0;

    display:flex;

    flex-direction:column;

    background:var(--panel);

    border-left:
        1px solid
        var(--border);
}


.chat-header{

    flex-shrink:0;

    padding:18px;

    font-weight:700;

    border-bottom:
        1px solid
        var(--border);
}


.chat-messages{

    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:15px;
}


.chat-message{

    margin-bottom:12px;
}


.chat-message-author{

    font-size:13px;

    color:var(--accent);

    font-weight:700;

    margin-bottom:3px;
}


.chat-message-text{

    word-break:break-word;

    line-height:1.4;
}


.chat-message-time{

    color:var(--muted);

    font-size:11px;

    margin-top:3px;
}


.chat-input{

    display:flex;

    gap:8px;

    padding:10px;

    border-top:
        1px solid
        var(--border);
}


.chat-input input{

    flex:1;

    min-width:0;

    padding:11px;

    border-radius:9px;

    border:
        1px solid
        var(--border);

    background:var(--panel2);

    color:white;

    outline:none;
}


.chat-input input:focus{

    border-color:var(--accent);
}


.chat-send{

    width:42px;

    border-radius:9px;

    background:var(--accent);

    color:white;
}


/* ==========================================================
ROOM
========================================================== */

.room-screen{

    flex:1;

    min-height:0;

    display:none;
}


.room-main{

    flex:1;

    min-width:0;

    min-height:0;

    display:flex;

    flex-direction:column;
}


.room-topbar{

    height:64px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0
        18px;

    background:var(--panel);

    border-bottom:
        1px solid
        var(--border);
}


.room-info h2{

    font-size:18px;
}


.room-info p{

    color:var(--muted);

    font-size:13px;

    margin-top:3px;
}


.room-leave{

    padding:
        9px
        14px;

    border-radius:9px;

    background:var(--danger);

    color:white;

    font-weight:700;
}


/* ==========================================================
VIDEO GRID
========================================================== */

.video-grid{

    flex:1;

    min-height:0;

    overflow:auto;

    padding:12px;

    display:grid;

    gap:12px;

    grid-template-columns:1fr;
}


.video-card{

    position:relative;

    min-height:180px;

    overflow:hidden;

    border-radius:14px;

    background:#05070b;

    border:
        1px solid
        var(--border);
}


.video-card video{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    background:#05070b;
}


.video-name{

    position:absolute;

    left:10px;
    bottom:10px;

    padding:
        5px
        8px;

    border-radius:7px;

    background:
        rgba(0,0,0,.6);

    font-size:13px;

    z-index:2;
}


.camera-off{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#090c13;

    color:var(--muted);

    font-size:35px;

    z-index:1;
}


.room-controls{

    height:72px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    background:var(--panel);

    border-top:
        1px solid
        var(--border);
}


.control-button{

    width:48px;
    height:48px;

    border-radius:50%;

    background:var(--panel2);

    color:white;

    border:
        1px solid
        var(--border);

    font-size:19px;
}


.control-button.active{

    background:var(--success);

    border-color:var(--success);
}


.control-button.off{

    background:var(--danger);

    border-color:var(--danger);
}


/* ==========================================================
MODALS
========================================================== */

.modal{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.65);

    z-index:1000;
}


.modal-box{

    width:100%;

    max-width:500px;

    max-height:
        calc(
            100vh - 40px
        );

    overflow:auto;

    background:var(--panel);

    border:
        1px solid
        var(--border);

    border-radius:18px;

    padding:20px;
}


.modal-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:20px;
}


.modal-close{

    width:34px;
    height:34px;

    border-radius:50%;

    background:var(--panel2);

    color:white;

    font-size:20px;
}


/* ==========================================================
PROFILE
========================================================== */

.profile-line{

    padding:12px 0;

    border-bottom:
        1px solid
        var(--border);
}


.profile-label{

    color:var(--muted);

    font-size:13px;

    margin-bottom:4px;
}


/* ==========================================================
ADMIN
========================================================== */

.admin-tabs{

    display:flex;

    gap:8px;

    margin-bottom:15px;
}


.admin-tab{

    flex:1;

    padding:10px;

    border-radius:9px;

    background:var(--panel2);

    color:var(--muted);
}


.admin-tab.active{

    background:var(--accent);

    color:white;
}


.admin-item{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    padding:12px 0;

    border-bottom:
        1px solid
        var(--border);
}


.admin-item-info{

    min-width:0;
}


.admin-item-name{

    font-weight:700;

    word-break:break-word;
}


.admin-item-detail{

    color:var(--muted);

    font-size:12px;

    margin-top:3px;
}


.admin-actions{

    display:flex;

    gap:6px;

    flex-shrink:0;
}


.admin-action{

    padding:
        7px
        9px;

    border-radius:7px;

    background:var(--panel2);

    color:white;

    border:
        1px solid
        var(--border);

    font-size:12px;
}


.admin-action.danger{

    background:var(--danger);

    border-color:var(--danger);
}


/* ==========================================================
NOTIFICATION
========================================================== */

.chat-notification{

    position:fixed;

    top:80px;

    right:20px;

    z-index:9999;

    max-width:320px;

    padding:
        13px
        16px;

    border-radius:10px;

    background:var(--panel2);

    border:
        1px solid
        var(--border);

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.4);

    animation:
        notificationIn .25s ease;
}


@keyframes notificationIn{

    from{

        opacity:0;

        transform:
            translateY(-10px);
    }

    to{

        opacity:1;

        transform:
            translateY(0);
    }
}


/* ==========================================================
MOBILE CHAT
========================================================== */

.mobile-chat-toggle{

    display:none;
}


.mobile-chat-backdrop{

    display:none;
}


.mobile-chat-close{

    display:none;
}


/* ==========================================================
RESPONSIVE
========================================================== */

@media(max-width:900px){

    .chat-sidebar,
    .room-chat{

        width:280px;
    }
}


@media(max-width:700px){

    body{

        overflow:hidden;
    }


    /* ======================================================
    LOBBY
    ====================================================== */

    .lobby{

        position:relative;

        flex-direction:column;

        min-height:0;

        overflow:hidden;
    }


    .lobby-main{

        width:100%;

        min-height:0;

        overflow:hidden;
    }


    .lobby-header{

        flex-direction:column;

        align-items:stretch;

        padding:18px;
    }


    .lobby-title h1{

        font-size:22px;
    }


    .room-actions{

        flex-direction:column;
    }


    .search{

        width:100%;
    }


    .room-list{

        padding:
            0
            18px
            90px;

        grid-template-columns:1fr;

        overflow:auto;
    }


    /* ======================================================
    ROOM
    ====================================================== */

    .room-screen{

        position:relative;

        flex-direction:column;

        min-height:0;

        overflow:hidden;
    }


    .room-main{

        width:100%;

        min-height:0;

        height:100%;

        overflow:hidden;
    }


    .room-topbar{

        height:58px;

        flex-shrink:0;
    }


    .video-grid{

        padding:
            10px
            10px
            85px;

        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            ) !important;

        grid-auto-rows:
            minmax(150px,1fr);

        overflow:auto;
    }


    .video-card{

        min-height:150px;
    }


    /* ======================================================
    CHAT PANELS
    ====================================================== */

    .chat-sidebar,
    .room-chat{

        position:fixed;

        left:0;
        right:0;
        bottom:0;

        width:100%;

        height:
            min(
                65vh,
                560px
            );

        max-height:
            calc(
                100vh - 20px
            );

        border-left:0;

        border-top:
            1px solid
            var(--border);

        border-radius:
            20px
            20px
            0
            0;

        box-shadow:
            0 -15px 50px
            rgba(0,0,0,.55);

        z-index:2000;

        transform:
            translateY(105%);

        opacity:0;

        pointer-events:none;

        transition:
            transform .28s ease,
            opacity .28s ease;

        display:flex;
    }


    .chat-sidebar.mobile-open,
    .room-chat.mobile-open{

        transform:
            translateY(0);

        opacity:1;

        pointer-events:auto;
    }


    /* ======================================================
    CHAT HEADER
    ====================================================== */

    .chat-header{

        position:relative;

        padding:
            17px
            45px
            17px;

        flex-shrink:0;
    }


    .chat-header::before{

        content:"";

        position:absolute;

        top:7px;
        left:50%;

        transform:
            translateX(-50%);

        width:42px;
        height:4px;

        border-radius:10px;

        background:
            var(--border);
    }


    .mobile-chat-close{

        position:absolute;

        top:11px;
        right:12px;

        width:34px;
        height:34px;

        border-radius:50%;

        border:
            1px solid
            var(--border);

        background:
            var(--panel2);

        color:white;

        font-size:20px;

        display:flex;

        align-items:center;

        justify-content:center;

        z-index:5;
    }


    /* ======================================================
    CHAT MESSAGES
    ====================================================== */

    .chat-messages{

        min-height:0;

        overflow-y:auto;

        -webkit-overflow-scrolling:touch;

        padding:15px;

        overscroll-behavior:contain;
    }


    /* ======================================================
    CHAT INPUT
    ====================================================== */

    .chat-input{

        flex-shrink:0;

        padding:10px;

        padding-bottom:
            calc(
                10px +
                env(
                    safe-area-inset-bottom
                )
            );

        background:
            var(--panel);
    }


    .chat-input input{

        min-height:42px;

        font-size:16px;

        -webkit-user-select:text;

        user-select:text;
    }


    /* ======================================================
    BACKDROP
    ====================================================== */

    .mobile-chat-backdrop{

        position:fixed;

        inset:0;

        display:block;

        background:
            rgba(0,0,0,.55);

        opacity:0;

        pointer-events:none;

        transition:
            opacity .25s ease;

        z-index:1900;
    }


    .mobile-chat-backdrop.active{

        opacity:1;

        pointer-events:auto;
    }


    /* ======================================================
    CHAT BUTTON
    ====================================================== */

    .mobile-chat-toggle{

        position:fixed;

        left:50%;

        bottom:
            calc(
                12px +
                env(
                    safe-area-inset-bottom
                )
            );

        transform:
            translateX(-50%);

        display:flex;

        align-items:center;

        justify-content:center;

        gap:7px;

        min-width:190px;

        height:48px;

        padding:
            0
            18px;

        border:
            1px solid
            var(--border);

        border-radius:25px;

        background:
            var(--panel);

        color:white;

        font-weight:700;

        box-shadow:
            0 8px 30px
            rgba(0,0,0,.45);

        z-index:1500;
    }


    .mobile-chat-toggle:active{

        transform:
            translateX(-50%)
            scale(.97);
    }


    /* ======================================================
    ROOM CONTROLS
    ====================================================== */

    .room-controls{

        position:absolute;

        left:0;
        right:0;
        bottom:0;

        height:70px;

        z-index:1000;

        background:
            linear-gradient(
                to top,
                var(--panel) 75%,
                transparent
            );

        border-top:0;
    }


    .room-screen
    .mobile-chat-toggle{

        bottom:78px;

        z-index:1600;
    }

}

</style>

</head>


<body>


<!-- =========================================================
AUTH
========================================================= -->

<div
    class="auth-screen"
    id="authScreen"
>

    <div class="auth-box">

        <div class="auth-title">

            <h1>Col'inCall</h1>

            <p>Connecte-toi pour commencer</p>

        </div>


        <div class="auth-tabs">

            <button
                class="auth-tab active"
                id="userTab"
                onclick="setLoginMode('user')"
            >
                Utilisateur
            </button>

            <button
                class="auth-tab"
                id="adminTab"
                onclick="setLoginMode('admin')"
            >
                Admin
            </button>

        </div>


        <div class="form-group">

            <label for="usernameInput">
                Nom d'utilisateur
            </label>

            <input
                id="usernameInput"
                type="text"
                autocomplete="username"
                placeholder="Votre pseudo"
            >

        </div>


        <div
            class="form-group"
            id="passwordField"
            style="display:none;"
        >

            <label for="passwordInput">
                Code administrateur
            </label>

            <input
                id="passwordInput"
                type="password"
                autocomplete="current-password"
                placeholder="Code admin"
            >

        </div>


        <button
            class="login-button"
            onclick="login()"
        >
            Se connecter
        </button>


        <div
            class="login-error"
            id="loginError"
        ></div>

    </div>

</div>


<!-- =========================================================
APP
========================================================= -->

<div
    class="app"
    id="app"
    style="display:none;"
>


    <!-- =====================================================
    TOPBAR
    ====================================================== -->

    <div class="topbar">

        <div class="logo">
            Col'inCall
        </div>


        <div class="top-user">

            <button
                class="admin-button"
                id="adminButton"
                onclick="openAdminModal()"
                style="display:none;"
            >
                Admin
            </button>


            <div
                class="avatar"
                id="topAvatar"
                onclick="openProfileModal()"
            >
                ?
            </div>


            <div
                class="top-username"
                id="topUsername"
            >
                -
            </div>

        </div>

    </div>


    <!-- =====================================================
    LOBBY
    ====================================================== -->

    <div
        class="lobby"
        id="lobbyScreen"
    >

        <div class="lobby-main">


            <div class="lobby-header">

                <div class="lobby-title">

                    <h1>Salons</h1>

                    <p>
                        Rejoins une discussion ou crée ton propre salon.
                    </p>

                </div>


                <div class="room-actions">

                    <input
                        class="search"
                        id="roomSearch"
                        type="text"
                        placeholder="Rechercher un salon..."
                        oninput="filterRooms()"
                    >

                    <button
                        class="create-room-button"
                        onclick="createRoom()"
                    >
                        + Créer un salon
                    </button>

                </div>

            </div>


            <div
                class="room-list"
                id="roomList"
            ></div>


        </div>


        <!-- =================================================
        GENERAL CHAT
        ================================================== -->

        <button
            class="mobile-chat-toggle"
            id="mobileLobbyChatToggle"

<script>

/* ==========================================================
CONFIG
========================================================== */

const SERVER_URL =
    "wss://projet-nz7b.onrender.com";


/* ==========================================================
STATE
========================================================== */

let socket = null;

let currentUser = null;

let currentRoom = null;

let loginMode = "user";

let rooms = [];

let users = [];

let localStream = null;

let microphoneEnabled = false;

let cameraEnabled = false;

const peers = new Map();

const pendingCandidates = new Map();

let currentAdminTab = "users";


/* ==========================================================
DOM
========================================================== */

const authScreen =
    document.getElementById(
        "authScreen"
    );

const app =
    document.getElementById(
        "app"
    );

const lobbyScreen =
    document.getElementById(
        "lobbyScreen"
    );

const roomScreen =
    document.getElementById(
        "roomScreen"
    );

const roomList =
    document.getElementById(
        "roomList"
    );

const videoGrid =
    document.getElementById(
        "videoGrid"
    );

const lobbyChatMessages =
    document.getElementById(
        "lobbyChatMessages"
    );

const roomChatMessages =
    document.getElementById(
        "roomChatMessages"
    );


/* ==========================================================
SEND
========================================================== */

function send(data){

    if(
        socket &&
        socket.readyState ===
            WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify(data)
        );

        return true;
    }

    return false;
}


/* ==========================================================
LOGIN MODE
========================================================== */

function setLoginMode(mode){

    loginMode = mode;

    const userTab =
        document.getElementById(
            "userTab"
        );

    const adminTab =
        document.getElementById(
            "adminTab"
        );

    const passwordField =
        document.getElementById(
            "passwordField"
        );

    if(mode === "user"){

        userTab.classList.add(
            "active"
        );

        adminTab.classList.remove(
            "active"
        );

        passwordField.style.display =
            "none";

    }else{

        userTab.classList.remove(
            "active"
        );

        adminTab.classList.add(
            "active"
        );

        passwordField.style.display =
            "block";
    }
}


/* ==========================================================
CONNECT
========================================================== */

function connect(){

    if(
        socket &&
        (
            socket.readyState ===
                WebSocket.OPEN ||
            socket.readyState ===
                WebSocket.CONNECTING
        )
    ){

        return;
    }


    socket =
        new WebSocket(
            SERVER_URL
        );


    socket.addEventListener(
        "open",
        () => {

            const session =
                localStorage.getItem(
                    "colincall_session"
                );

            if(session){

                send({
                    type:
                        "restore-session",

                    token:
                        session
                });

            }

        }
    );


    socket.addEventListener(
        "message",
        event => {

            let message;

            try{

                message =
                    JSON.parse(
                        event.data
                    );

            }catch(error){

                return;
            }

            handleMessage(
                message
            );
        }
    );


    socket.addEventListener(
        "close",
        () => {

            setTimeout(
                () => {

                    if(
                        currentUser
                    ){

                        connect();
                    }

                },
                1500
            );
        }
    );


    socket.addEventListener(
        "error",
        error => {

            console.error(
                "WebSocket error",
                error
            );
        }
    );
}


/* ==========================================================
LOGIN
========================================================== */

function login(){

    const username =
        document
            .getElementById(
                "usernameInput"
            )
            .value
            .trim();

    const password =
        document
            .getElementById(
                "passwordInput"
            )
            .value;

    const loginError =
        document.getElementById(
            "loginError"
        );


    loginError.textContent = "";


    if(!username){

        loginError.textContent =
            "Nom d'utilisateur obligatoire.";

        return;
    }


    connect();


    const sendLogin =
        () => {

            send({
                type:"login",

                username,

                password:
                    loginMode === "admin"
                        ? password
                        : ""
            });
        };


    if(
        socket &&
        socket.readyState ===
            WebSocket.OPEN
    ){

        sendLogin();

    }else{

        socket.addEventListener(
            "open",
            sendLogin,
            {
                once:true
            }
        );
    }
}


/* ==========================================================
MESSAGE HANDLER
========================================================== */

function handleMessage(message){

    switch(message.type){

        case "connected":
            break;


        case "login-success":

            handleLoginSuccess(
                message
            );

            break;


        case "session-restored":

            handleSessionRestored(
                message
            );

            break;


        case "session-invalid":

            localStorage.removeItem(
                "colincall_session"
            );

            break;


        case "login-error":

            document
                .getElementById(
                    "loginError"
                )
                .textContent =
                    message.message ||
                    "Erreur de connexion.";

            break;


        case "room-list":

            rooms =
                message.rooms || [];

            renderRooms();

            break;


        case "user-list":

            users =
                message.users || [];

            if(
                currentRoom
            ){

                updateRoomStatus();
            }

            break;


        case "room-created":

            break;


        case "room-joined":

            handleRoomJoined(
                message
            );

            break;


        case "user-joined":

            handleUserJoined(
                message.user
            );

            break;


        case "user-left":

            handleUserLeft(
                message.userId
            );

            break;


        case "chat-message":

            addChatMessage(
                message
            );

            break;


        case "offer":

            receiveOffer(
                message
            );

            break;


        case "answer":

            receiveAnswer(
                message
            );

            break;


        case "candidate":

            receiveCandidate(
                message
            );

            break;


        case "remote-media-state":

            handleRemoteMediaState(
                message
            );

            break;


        case "force-media-state":

            handleForceMediaState(
                message
            );

            break;


        case "room-deleted":

            handleRoomDeleted(
                message
            );

            break;


        case "force-lobby":

            forceLobby();

            break;


        case "kicked":

            alert(
                message.message ||
                "Vous avez été exclu."
            );

            break;


        case "admin-data":

            rooms =
                message.rooms || [];

            users =
                message.users || [];

            renderAdmin();

            break;


        case "admin-error":

            alert(
                message.message ||
                "Erreur administrateur."
            );

            break;


        case "error":

            console.error(
                message.message
            );

            break;
    }
}


/* ==========================================================
LOGIN SUCCESS
========================================================== */

function handleLoginSuccess(
    message
){

    currentUser =
        message.user;

    currentUser.isAdmin =
        !!message.isAdmin;


    if(
        message.sessionToken
    ){

        localStorage.setItem(
            "colincall_session",
            message.sessionToken
        );
    }


    showApplication();
}


/* ==========================================================
SESSION RESTORED
========================================================== */

function handleSessionRestored(
    message
){

    currentUser =
        message.user;

    currentUser.isAdmin =
        !!message.isAdmin;


    showApplication();
}


/* ==========================================================
SHOW APP
========================================================== */

function showApplication(){

    authScreen.style.display =
        "none";

    app.style.display =
        "flex";

    document.getElementById(
        "topUsername"
    ).textContent =
        currentUser.username;


    document.getElementById(
        "topAvatar"
    ).textContent =
        currentUser.username
            .charAt(0)
            .toUpperCase();


    document.getElementById(
        "adminButton"
    ).style.display =
        currentUser.isAdmin
            ? "block"
            : "none";


    lobbyScreen.style.display =
        "flex";

    roomScreen.style.display =
        "none";


    closeMobileChat();


    /*
     * Empêche le navigateur mobile
     * de restaurer un ancien texte.
     */

    const lobbyInput =
        document.getElementById(
            "lobbyChatInput"
        );

    const roomInput =
        document.getElementById(
            "roomChatInput"
        );

    if(lobbyInput)
        lobbyInput.value = "";

    if(roomInput)
        roomInput.value = "";
}


/* ==========================================================
ROOMS
========================================================== */

function renderRooms(){

    const search =
        document
            .getElementById(
                "roomSearch"
            )
            .value
            .trim()
            .toLowerCase();


    roomList.innerHTML = "";


    const filtered =
        rooms.filter(
            room =>
                room.name
                    .toLowerCase()
                    .includes(search)
        );


    for(
        const room
        of filtered
    ){

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "room-card";


        const title =
            document.createElement(
                "h3"
            );

        title.textContent =
            room.name;


        const description =
            document.createElement(
                "p"
            );

        description.textContent =
            room.permanent
                ? "Discussion générale"
                : "Salon de discussion";


        const count =
            document.createElement(
                "div"
            );

        count.className =
            "room-count";

        count.textContent =
            `${room.userCount} participant${
                room.userCount > 1
                    ? "s"
                    : ""
            }`;


        card.appendChild(
            title
        );

        card.appendChild(
            description
        );

        card.appendChild(
            count
        );


        card.onclick =
            () => joinRoom(room.id);


        roomList.appendChild(
            card
        );
    }
}


function filterRooms(){

    renderRooms();
}


/* ==========================================================
CREATE ROOM
========================================================== */

function createRoom(){

    const name =
        prompt(
            "Nom du salon :"
        );


    if(!name)
        return;


    send({
        type:
            "create-room",

        name:
            name.trim()
    });
}


/* ==========================================================
JOIN ROOM
========================================================== */

async function joinRoom(
    roomId
){

    if(!currentUser)
        return;


    closeMobileChat();


    await prepareLocalMedia();


    send({
        type:
            "join-room",

        roomId
    });
}


/* ==========================================================
LOCAL MEDIA
========================================================== */

async function prepareLocalMedia(){

    if(localStream)
        return;


    try{

        localStream =
            await navigator.mediaDevices
                .getUserMedia({
                    video:true,
                    audio:true
                });


        localStream
            .getAudioTracks()
            .forEach(
                track => {

                    track.enabled =
                        false;
                }
            );


        localStream
            .getVideoTracks()
            .forEach(
                track => {

                    track.enabled =
                        false;
                }
            );


        microphoneEnabled =
            false;

        cameraEnabled =
            false;


        updateControlButton(
            "microBtn",
            false
        );

        updateControlButton(
            "cameraBtn",
            false
        );


    }catch(error){

        console.error(
            "getUserMedia error",
            error
        );

        alert(
            "Impossible d'accéder à la caméra ou au microphone."
        );
    }
}


/* ==========================================================
ROOM JOINED
========================================================== */

function handleRoomJoined(
    message
){

    currentRoom =
        message.room;


    currentUser.roomId =
        currentRoom.id;


    microphoneEnabled =
        false;

    cameraEnabled =
        false;


    lobbyScreen.style.display =
        "none";

    roomScreen.style.display =
        "flex";


    closeMobileChat();


    document.getElementById(
        "roomName"
    ).textContent =
        currentRoom.name;


    roomChatMessages.innerHTML =
        "";

    videoGrid.innerHTML =
        "";


    addLocalVideo();


    const participants =
        message.participants || [];


    for(
        const user
        of participants
    ){

        addVideoUser(
            user
        );

        createConnectionToUser(
            user,
            true
        );
    }


    updateRoomLayout();

    updateRoomStatus();
}


/* ==========================================================
LOCAL VIDEO
========================================================== */

function addLocalVideo(){

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "video-card";

    card.id =
        "video-local";


    const video =
        document.createElement(
            "video"
        );

    video.muted = true;

    video.playsInline = true;

    video.srcObject =

    const overlay =
        document.createElement(
            "div"
        );

    overlay.className =
        "camera-off";

    overlay.id =

    overlay.textContent =

        document.createElement(
            "div"
        );

    name.className =

    );

    card.appendChild(

    );

    card.appendChild(

    );

    );
}


/* ==========================================================
REMOTE VIDEO
========================================================== */

function addVideoUser(
    user
){

    if(
        document.getElementById(
            `video-${user.id}`
        )
    )
        return;


    const card =
        document.createElement(
            "div"
        );

        "video-card";

    card.id =

    const video =
        document.createElement(
            "video"
        );

    video.autoplay = true;

    video.playsInline = true;

        );

    overlay.className =

    overlay.textContent =

    );

    );

        card
    );
}


/* ==========================================================
UPDATE ROOM LAYOUT
========================================================== */

function updateRoomLayout(){

    const count =
        videoGrid.children.length;


    if(count <= 1){

        videoGrid.style.gridTemplateColumns =
            "1fr";

    }else if(count === 2){

        videoGrid.style.gridTemplateColumns =
            "repeat(2,minmax(0,1fr))";

    }else if(
        count === 3 ||
        count === 4
    ){

        videoGrid.style.gridTemplateColumns =
            "repeat(2,minmax(0,1fr))";

    }else{

        videoGrid.style.gridTemplateColumns =
            "repeat(3,minmax(0,1fr))";
    }
}


/* ==========================================================
ROOM STATUS
========================================================== */

function updateRoomStatus(){

    if(!currentRoom)
        return;


    const count =
        users.filter(
            user =>
                user.roomId ===
                currentRoom.id
        ).length;


    document.getElementById(
        "roomStatus"
    ).textContent =
        `${count} participant${
            count > 1
                ? "s"
                : ""
        }`;
}


/* ==========================================================
USER JOINED
========================================================== */

function handleUserJoined(
    user
){

    if(
        !currentRoom ||
        user.roomId !==
            currentRoom.id
    )
        return;


    addVideoUser(
        user
    );


    updateRoomLayout();

    updateRoomStatus();
}


/* ==========================================================
USER LEFT
========================================================== */

function handleUserLeft(
    userId
){

    const card =
        document.getElementById(
            `video-${userId}`
        );


    if(card)
        card.remove();


    closePeer(
        userId
    );


    updateRoomLayout();

    updateRoomStatus();
}


/* ==========================================================
WEBRTC CONNECTION
========================================================== */

function createConnectionToUser(
    user,
    createOffer
){

    if(!localStream)
        return;


    if(peers.has(user.id))
        return;


    const pc =
        new RTCPeerConnection({

            iceServers:[
                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }
            ]
        });


    peers.set(
        user.id,
        pc
    );


    localStream
        .getTracks()
        .forEach(
            track => {

                pc.addTrack(
                    track,
                    localStream
                );
            }
        );


    pc.onicecandidate =
        event => {

            if(
                event.candidate
            ){

                send({

                    type:
                        "candidate",

                    targetUserId:
                        user.id,

                    candidate:
                        event.candidate
                });
            }
        };


    pc.ontrack =
        event => {

            const card =
                document.getElementById(
                    `video-${user.id}`
                );

            if(!card)
                return;


            const video =
                card.querySelector(
                    "video"
                );


            if(
                video &&
                video.srcObject !==
                    event.streams[0]
            ){

                video.srcObject =
                    event.streams[0];
            }
        };


    pc.onconnectionstatechange =
        () => {

            if(
                pc.connectionState ===
                    "failed" ||
                pc.connectionState ===
                    "closed" ||
                pc.connectionState ===
                    "disconnected"
            ){

                closePeer(
                    user.id
                );
            }
        };


    if(createOffer){

        pc.createOffer()
            .then(
                offer =>
                    pc.setLocalDescription(
                        offer
                    )
            )
            .then(
                () => {

                    send({

                        type:
                            "offer",

                        targetUserId:
                            user.id,

                        offer:
                            pc.localDescription
                    });
                }
            )
            .catch(
                console.error
            );
    }


    return pc;
}


/* ==========================================================
FIND USER
========================================================== */

function findUser(
    userId
){

    return users.find(
        user =>
            user.id ===
            userId
    );
}


/* ==========================================================
RECEIVE OFFER
========================================================== */

async function receiveOffer(
    message
){

    const user =
        findUser(
            message.fromUserId
        );


    if(!user)
        return;


    let pc =
        peers.get(
            user.id
        );


    if(!pc){

        pc =
            createConnectionToUser(
                user,
                false
            );
    }


    if(!pc)
        return;


    try{

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                message.offer
            )
        );


        const pending =
            pendingCandidates.get(
                user.id
            ) || [];


        for(
            const candidate
            of pending
        ){

            await pc.addIceCandidate(
                candidate
            );
        }


        pendingCandidates.delete(
            user.id
        );


        const answer =
            await pc.createAnswer();


        await pc.setLocalDescription(
            answer
        );


        send({

            type:
                "answer",

            targetUserId:
                user.id,

            answer:
                pc.localDescription
        });


    }catch(error){

        console.error(
            "Offer error",
            error
        );
    }
}


/* ==========================================================
RECEIVE ANSWER
========================================================== */

async function receiveAnswer(
    message
){

    const pc =
        peers.get(
            message.fromUserId
        );


    if(!pc)
        return;


    try{

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                message.answer
            )
        );

    }catch(error){

        console.error(
            "Answer error",
            error
        );
    }
}


/* ==========================================================
RECEIVE CANDIDATE
========================================================== */

async function receiveCandidate(
    message
){

    const userId =
        message.fromUserId;


    const pc =
        peers.get(
            userId
        );


    const candidate =
        new RTCIceCandidate(
            message.candidate
        );


    if(
        pc &&
        pc.remoteDescription
    ){

        try{

            await pc.addIceCandidate(
                candidate
            );

        }catch(error){

            console.error(
                error
            );
        }

    }else{

        if(
            !pendingCandidates.has(
                userId
            )
        ){

            pendingCandidates.set(
                userId,
                []
            );
        }


        pendingCandidates
            .get(userId)
            .push(
                candidate
            );
    }
}


/* ==========================================================
CLOSE PEER
========================================================== */

function closePeer(
    userId
){

    const pc =
        peers.get(
            userId
        );


    if(pc){

        try{
            pc.close();
        }catch(e){}

        peers.delete(
            userId
        );
    }


    pendingCandidates.delete(
        userId
    );
}


/* ==========================================================
CLOSE ALL PEERS
========================================================== */

function closeAllPeers(){

    for(
        const userId
        of peers.keys()
    ){

        closePeer(
            userId
        );
    }
}


/* ==========================================================

/* ==========================================================

========================================================== */

){

/* ==========================================================
FORCE MEDIA STATE
========================================================== */

function handleForceMediaState(
    message
){

    if(
        typeof
            message.microphoneEnabled ===
            "boolean"
    ){

        microphoneEnabled =
            message.microphoneEnabled;


        if(localStream){

            localStream
                .getAudioTracks()
                .forEach(
                    track => {

                        track.enabled =
                            microphoneEnabled;
                    }
                );
        }


        updateControlButton(
            "microBtn",
            microphoneEnabled
        );
    }


    if(
        typeof
            message.cameraEnabled ===
            "boolean"
    ){

        cameraEnabled =
            message.cameraEnabled;


        if(localStream){

            localStream
                .getVideoTracks()
                .forEach(
                    track => {

                        track.enabled =
                            cameraEnabled;
                    }
                );
        }


        updateControlButton(
            "cameraBtn",
            cameraEnabled
        );


        const overlay =
            document.getElementById(
                "camera-off-local"
            );


        if(overlay){

            overlay.style.display =
                cameraEnabled
                    ? "none"
                    : "flex";
        }
    }


    send({

        type:
            "media-state",

        microphoneEnabled,

        cameraEnabled
    });
}


/* ==========================================================
STOP LOCAL MEDIA
========================================================== */

function stopLocalMedia(){

    if(!localStream)
        return;


    localStream
        .getTracks()
        .forEach(
            track =>
                track.stop()
        );


    localStream = null;

    microphoneEnabled =
        false;

    cameraEnabled =
        false;
}


/* ==========================================================
LEAVE ROOM
========================================================== */

function leaveCurrentRoom(){

    if(!currentRoom)
        return;


    const confirmed =
        confirm(
            `Voulez-vous vraiment quitter le salon "${currentRoom.name}" ?`
        );


    if(!confirmed)
        return;


    send({
        type:
            "leave-room"
    });


    closeAllPeers();

    stopLocalMedia();


    currentRoom = null;


    if(currentUser){

        currentUser.roomId =
            null;
    }


    videoGrid.innerHTML =
        "";


    roomScreen.style.display =
        "none";

    lobbyScreen.style.display =
        "flex";


    closeMobileChat();
}

/* ==========================================================
ADD CHAT MESSAGE
========================================================== */

function addChatMessage(
    message
){

    const isRoomMessage =
        !!message.roomId;


    if(isRoomMessage){

        if(
            !currentRoom ||
            message.roomId !==
                currentRoom.id
        )
            return;


        appendChatMessage(
            roomChatMessages,
            message
        );

    }else{

        if(
            currentUser &&
            currentUser.roomId
        )
            return;


        appendChatMessage(
            lobbyChatMessages,
            message
        );
    }


    if(
        currentUser &&
        message.userId !==
            currentUser.id
    ){

        showChatNotification(
            message
        );
    }
}


/* ==========================================================
APPEND CHAT MESSAGE
========================================================== */

function appendChatMessage(
    container,
    message
){

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "chat-message";


    const author =
        document.createElement(
            "div"
        );

    author.className =
        "chat-message-author";

    author.textContent =
        message.username;


    const text =
        document.createElement(
            "div"
        );

    text.className =
        "chat-message-text";

    text.textContent =
        message.text;


    const time =
        document.createElement(
            "div"
        );

    time.className =
        "chat-message-time";

    time.textContent =
        new Date(
            message.timestamp
        ).toLocaleTimeString(
            "fr-FR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    wrapper.appendChild(
        author
    );

    wrapper.appendChild(
        text
    );

    wrapper.appendChild(
        time
    );


    container.appendChild(
        wrapper
    );


    container.scrollTop =
        container.scrollHeight;
}


/* ==========================================================
CHAT NOTIFICATION
========================================================== */

function showChatNotification(
    message
){

    const notification =
        document.createElement(
            "div"
        );

    notification.className =
        "chat-notification";


    notification.textContent =
        `${message.username} : ${message.text}`;


    document.body.appendChild(
        notification
    );


    setTimeout(
        () => {

            notification.remove();

        },
        3500
    );
}


/* ==========================================================
MOBILE CHAT
========================================================== */

function toggleMobileChat(
    type
){

    const lobbyChat =
        document.querySelector(
            ".chat-sidebar"
        );


    const roomChat =
        document.querySelector(
            ".room-chat"
        );


    const backdrop =
        document.getElementById(
            "mobileChatBackdrop"
        );


    if(
        !lobbyChat ||
        !roomChat ||
        !backdrop
    )
        return;


    lobbyChat.classList.remove(
        "mobile-open"
    );

    roomChat.classList.remove(
        "mobile-open"
    );


    if(type === "lobby"){

        lobbyChat.classList.add(
            "mobile-open"
        );

    }


    if(type === "room"){

        roomChat.classList.add(
            "mobile-open"
        );

    }


    backdrop.classList.add(
        "active"
    );
}


function closeMobileChat(){

    const lobbyChat =
        document.querySelector(
            ".chat-sidebar"
        );


    const roomChat =
        document.querySelector(
            ".room-chat"
        );


    const backdrop =
        document.getElementById(
            "mobileChatBackdrop"
        );


    if(lobbyChat){

        lobbyChat.classList.remove(
            "mobile-open"
        );
    }


    if(roomChat){

        roomChat.classList.remove(
            "mobile-open"
        );
    }


    if(backdrop){

        backdrop.classList.remove(
            "active"
        );
    }
}


/* ==========================================================
CHAT INPUT
========================================================== */

function setupChatInput(
    input,
    sendFunction
){

    if(!input)
        return;


    /*
     * Le clic/touch ne fait rien d'autre
     * que laisser le champ prendre le focus.
     */

    input.addEventListener(
        "click",
        event => {

            event.stopPropagation();
        }
    );


    input.addEventListener(
        "touchstart",
        event => {

            event.stopPropagation();

        },
        {
            passive:true
        }
    );


    input.addEventListener(
        "focus",
        event => {

            event.stopPropagation();
        }
    );


    /*
     * Seule la touche Entrée envoie.
     */

    input.addEventListener(
        "keydown",
        event => {

            if(
                event.key === "Enter" &&
                !event.shiftKey
            ){

                event.preventDefault();

                event.stopPropagation();

                sendFunction();
            }
        }
    );
}

function showAdminTab(

){

        "adminUsersTab"
    ).classList.toggle(
        "active",
        tab === "users"
    );


    document.getElementById(
        "adminRoomsTab"
    ).classList.toggle(

        tab === "rooms"
    );


    renderAdmin();
}

        document.getElementById(
            "adminList"

    list.innerHTML = "";


    if(currentAdminTab === "users"){

        for(
            const user
            of users
        ){

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "admin-item";


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "admin-item-info";


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "admin-item-name";

            name.textContent =
                user.username;


            const detail =
                document.createElement(
                    "div"
                );

            detail.className =
                "admin-item-detail";

            detail.textContent =
                user.roomId
                    ? `Salon : ${user.roomId}`
                    : "Dans le lobby";


            info.appendChild(
                name
            );

            info.appendChild(
                detail
            );


            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "admin-actions";


            if(
                !user.isAdmin
            ){

                const mute =
                    document.createElement(
                        "button"
                    );

                mute.className =
                    "admin-action";

                mute.textContent =
                    "🔇";

                mute.title =
                    "Couper le micro";

                mute.onclick =
                    () => {

                        send({

                            type:
                                "admin-mute",

                            userId:
                                user.id
                        });
                    };


                const camera =
                    document.createElement(
                        "button"
                    );

                camera.className =
                    "admin-action";

                camera.textContent =
                    "📷";

                camera.title =
                    "Couper la caméra";

                camera.onclick =
                    () => {

                        send({

                            type:
                                "admin-camera",

                            userId:
                                user.id
                        });
                    };


                const kick =
                    document.createElement(
                        "button"
                    );

                kick.className =
                    "admin-action danger";

                kick.textContent =
                    "Exclure";

                kick.onclick =
                    () => {

                        send({

                            type:
                                "admin-kick",

                            userId:
                                user.id
                        });
                    };


                actions.appendChild(
                    mute
                );

                actions.appendChild(
                    camera
                );

                actions.appendChild(
                    kick
                );
            }


            item.appendChild(
                info
            );

            item.appendChild(
                actions
            );


            list.appendChild(
                item
            );
        }


    }else{

        for(
            const room
            of rooms
        ){

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "admin-item";


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "admin-item-info";


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "admin-item-name";

            name.textContent =
                room.name;


            const detail =
                document.createElement(
                    "div"
                );

            detail.className =
                "admin-item-detail";

            detail.textContent =
                `${room.userCount} participant${
                    room.userCount > 1
                        ? "s"
                        : ""
                }`;


            info.appendChild(
                name
            );

            info.appendChild(
                detail
            );


            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "admin-actions";


            if(!room.permanent){

                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.className =
                    "admin-action danger";

                deleteButton.textContent =
                    "Supprimer";

                    () => {

                        if(
                            confirm(
                                `Supprimer le salon "${room.name}" ?`
                            )
                        ){

                            send({

                                type:
                                    "admin-delete-room",

                                roomId:
                                    room.id
                            });
                        }
                    };


                actions.appendChild(
                    deleteButton
                );
            }


            item.appendChild(
                info
            );

            item.appendChild(
                actions
            );


            list.appendChild(
                item
            );
        }
    }
}
