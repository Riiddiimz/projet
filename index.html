<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCII Camera</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0a0a0a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;

            align-items: center;

        }

        .app {
            width: 100%;
            max-width: 900px;

        }

        h1 {
            font-size: 32px;

        .subtitle {
            color: #888;

        .camera-container {
            background: #111;

        }

        #ascii {
            margin: 0;
            color: #fff;
            font-family: "Courier New", monospace;
            font-size: 5px;
            line-height: 5px;
            white-space: pre;
        }

            display: none;
        }

            color: #888;

            }

                font-size: 3px;

                width: 100%;
            }

    </style>
</head>

<body>

<div class="app">

    <h1>📷 ASCII Camera</h1>

    <div class="subtitle">
        Prends une photo et transforme-la en dessin ASCII
    </div>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
    </div>

    <canvas id="canvas"></canvas>

    <div class="buttons">

        <button id="startCamera">
            📷 Ouvrir la caméra
        </button>

        <button id="takePhoto" class="hidden">
            ✨ Prendre la photo
        </button>

        <button id="switchCamera" class="secondary hidden">
            🔄 Changer de caméra
        </button>

    </div>

    <div class="status" id="status">
        Caméra inactive
    </div>

    <div class="ascii-container">
        <pre id="ascii"></pre>
    </div>

</div>


<script>

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ascii = document.getElementById("ascii");

    const startCamera = document.getElementById("startCamera");
    const takePhoto = document.getElementById("takePhoto");
    const switchCamera = document.getElementById("switchCamera");
    const status = document.getElementById("status");

    let stream = null;
    let currentFacingMode = "environment";


    // ==========================================
    // OUVRIR LA CAMERA
    // ==========================================

    async function openCamera() {

        try {

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            stream = await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: currentFacingMode,
                    width: {
                        ideal: 1280
                    },
                    height: {
                        ideal: 720
                    }
                },

                audio: false

            });

            video.srcObject = stream;

            takePhoto.classList.remove("hidden");
            switchCamera.classList.remove("hidden");

            status.textContent = "Caméra active";

        } catch (error) {

            console.error(error);

            status.textContent =
                "Impossible d'accéder à la caméra.";

            alert(
                "Impossible d'accéder à la caméra. " +
                "Vérifie que ton navigateur a l'autorisation."
            );

        }

    }


    // ==========================================
    // CHANGER CAMERA AVANT / ARRIERE
    // ==========================================

    switchCamera.addEventListener("click", async () => {

        currentFacingMode =
            currentFacingMode === "environment"
            ? "user"
            : "environment";

        await openCamera();

    });


    // ==========================================
    // PRENDRE LA PHOTO
    // ==========================================

    takePhoto.addEventListener("click", () => {

        if (!video.videoWidth) {
            return;
        }

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );

        convertToASCII();

    });


    // ==========================================
    // CONVERSION IMAGE → ASCII
    // ==========================================

    function convertToASCII() {

        const ctx = canvas.getContext("2d");

        // Taille du dessin ASCII
        const width = 120;

        // Ratio de l'image
        const ratio =
            canvas.height / canvas.width;

        // Les caractères sont plus hauts que larges
        const height =
            Math.floor(width * ratio * 0.5);

        const tempCanvas =
            document.createElement("canvas");

        tempCanvas.width = width;
        tempCanvas.height = height;

        const tempCtx =
            tempCanvas.getContext("2d");

        tempCtx.drawImage(
            canvas,
            0,
            0,
            width,
            height
        );

        const imageData =
            tempCtx.getImageData(
                0,
                0,
                width,
                height
            );

        const pixels = imageData.data;

        // Caractères du plus sombre au plus clair
        const chars =
            "@%#*+=-:. ";

        let result = "";

        for (let y = 0; y < height; y++) {

            for (let x = 0; x < width; x++) {

                const index =
                    (y * width + x) * 4;

                const r = pixels[index];
                const g = pixels[index + 1];
                const b = pixels[index + 2];

                // Luminosité
                const brightness =
                    0.299 * r +
                    0.587 * g +
                    0.114 * b;

                const charIndex =
                    Math.floor(
                        (brightness / 255) *
                        (chars.length - 1)
                    );

                result += chars[charIndex];

            }

            result += "\n";
        }

        ascii.textContent = result;

        status.textContent =
            "Photo transformée en ASCII ✨";

    }


    // ==========================================
    // DEMARRER
    // ==========================================

    startCamera.addEventListener(
        "click",
        openCamera
    );


</script>

</body>
</html>
