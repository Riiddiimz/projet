<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Col'inCall</title>

<style>

:root{

    --bg:#080a10;
    --panel:#111521;
    --panel2:#181d2a;
    --border:#293143;

    --text:#f4f7fb;
    --muted:#8993a7;

    --accent:#6c63ff;

    --danger:#e5484d;
    --success:#28c76f;
}

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:
        Inter,
        Arial,
        sans-serif;

    background:var(--bg);

    color:var(--text);

    overflow:hidden;
}

button,
input{

    font:inherit;
}

button{

    cursor:pointer;
}

/* ==========================================================
AUTH
========================================================== */

.auth-screen{

    width:100vw;
    height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at top,
            #171a31 0,
            var(--bg) 55%
        );
}

.auth-card{

    width:420px;

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:20px;

    padding:35px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.45);
}

.logo{

    font-size:28px;

    font-weight:800;

    text-align:center;

    margin-bottom:8px;
}

.logo span{

    color:var(--accent);
}

.subtitle{

    text-align:center;

    color:var(--muted);

    margin-bottom:30px;
}

.auth-tabs{

    display:flex;

    gap:8px;

    margin-bottom:20px;
}

.auth-tab{

    flex:1;

    padding:11px;

    border:1px solid var(--border);

    background:var(--panel2);

    color:var(--muted);

    border-radius:10px;
}

.auth-tab.active{

    background:var(--accent);

    color:white;

    border-color:var(--accent);
}

.field{

    margin-bottom:15px;
}

.field label{

    display:block;

    font-size:13px;

    color:var(--muted);

    margin-bottom:7px;
}

.field input{

    width:100%;

    background:#0c0f17;

    border:1px solid var(--border);

    color:var(--text);

    padding:12px 13px;

    border-radius:10px;

    outline:none;
}

.field input:focus{

    border-color:var(--accent);
}

.primary-btn{

    width:100%;

    padding:13px;

    background:var(--accent);

    border:0;

    border-radius:10px;

    color:white;

    font-weight:700;
}

.error{

    color:#ff7378;

    font-size:13px;

    margin-top:12px;

    text-align:center;
}

/* ==========================================================
APP
========================================================== */

.app{

    width:100vw;
    height:100vh;

    display:none;

    flex-direction:column;
}

/* ==========================================================
TOPBAR
========================================================== */

.topbar{

    height:64px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 20px;

    background:var(--panel);

    border-bottom:1px solid var(--border);
}

.brand{

    font-weight:800;

    font-size:20px;
}

.brand span{

    color:var(--accent);
}

.topbar-right{

    display:flex;

    align-items:center;

    gap:10px;
}

.user-pill{

    display:flex;

    align-items:center;

    gap:9px;

    background:var(--panel2);

    border:1px solid var(--border);

    border-radius:10px;

    padding:7px 11px;
}

.avatar{

    width:30px;
    height:30px;

    border-radius:50%;

    background:var(--accent);

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:12px;

    font-weight:bold;
}

.small-btn{

    padding:8px 11px;

    background:var(--panel2);

    border:1px solid var(--border);

    color:var(--text);

    border-radius:9px;
}

.small-btn:hover{

    border-color:var(--accent);
}

/* ==========================================================
LOBBY
========================================================== */

.lobby{

    flex:1;

    display:flex;

    min-height:0;
}

.lobby-main{

    flex:1;

    display:flex;

    flex-direction:column;

    min-width:0;
}

.lobby-header{

    padding:25px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;
}

.lobby-title h1{

    margin:0 0 5px;

    font-size:25px;
}

.lobby-title p{

    margin:0;

    color:var(--muted);

    font-size:14px;
}

.room-actions{

    display:flex;

    gap:9px;
}

.search{

    width:230px;

    background:var(--panel);

    border:1px solid var(--border);

    color:var(--text);

    border-radius:9px;

    padding:10px 12px;

    outline:none;
}

.room-list{

    flex:1;

    overflow:auto;

    padding:0 25px 25px;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(250px,1fr)
        );

    gap:15px;

    align-content:start;
}

.room-card{

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:14px;

    padding:18px;

    transition:.2s;
}

.room-card:hover{

    transform:translateY(-2px);

    border-color:var(--accent);
}

.room-card h3{

    margin:0 0 8px;

    font-size:17px;
}

.room-card-info{

    color:var(--muted);

    font-size:13px;

    margin-bottom:15px;
}

.room-card button{

    width:100%;

    padding:10px;

    background:var(--accent);

    color:white;

    border:0;

    border-radius:9px;

    font-weight:bold;
}

/* ==========================================================
CHAT SIDEBAR
========================================================== */

.chat-sidebar{

    width:340px;

    flex-shrink:0;

    background:var(--panel);

    border-left:1px solid var(--border);

    display:flex;

    flex-direction:column;

    min-height:0;
}

.chat-header{

    padding:17px;

    border-bottom:1px solid var(--border);

    font-weight:bold;
}

.chat-messages{

    flex:1;

    overflow:auto;

    padding:15px;
}

.chat-message{

    margin-bottom:13px;
}

.chat-message-user{

    font-size:12px;

    color:var(--accent);

    font-weight:bold;

    margin-bottom:3px;
}

.chat-message-text{

    font-size:14px;

    line-height:1.4;

    word-break:break-word;
}

.chat-message-time{

    font-size:10px;

    color:var(--muted);

    margin-top:3px;
}

.chat-input{

    padding:12px;

    border-top:1px solid var(--border);

    display:flex;

    gap:8px;
}

.chat-input input{

    flex:1;

    min-width:0;

    background:#0c0f17;

    border:1px solid var(--border);

    color:var(--text);

    border-radius:9px;

    padding:10px;

    outline:none;
}

.chat-input button{

    width:42px;

    background:var(--accent);

    border:0;

    border-radius:9px;

    color:white;
}

/* ==========================================================
CHAT NOTIFICATION
========================================================== */

.chat-notification{

    position:fixed;

    right:25px;

    top:85px;

    min-width:280px;

    max-width:380px;

    background:var(--panel);

    border:1px solid var(--accent);

    border-radius:13px;

    padding:13px 15px;

    box-shadow:
        0 12px 40px rgba(0,0,0,.45);

    z-index:9999;

    animation:
        chatNotificationIn .25s ease;
}

.chat-notification-title{

    font-size:13px;

    font-weight:bold;

    color:var(--accent);

    margin-bottom:5px;
}

.chat-notification-text{

    font-size:14px;

    color:var(--text);

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

@keyframes chatNotificationIn{

    from{

        opacity:0;

        transform:translateX(30px);
    }

    to{

        opacity:1;

        transform:translateX(0);
    }
}

/* ==========================================================
ROOM
========================================================== */

.room-screen{

    flex:1;

    display:none;

    min-height:0;
}

.room-main{

    flex:1;

    min-width:0;

    display:flex;

    flex-direction:column;

    min-height:0;
}

.room-topbar{

    height:58px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 17px;

    background:var(--panel);

    border-bottom:1px solid var(--border);
}

.room-name{

    font-weight:bold;
}

.room-status{

    color:var(--muted);

    font-size:13px;
}

.video-grid{

    flex:1;

    padding:18px;

    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    grid-auto-rows:
        minmax(220px,1fr);

    gap:15px;

    align-content:start;

    overflow:auto;
}

.video-grid.cols-1{

    grid-template-columns:1fr;
}

.video-grid.cols-2{

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );
}

.video-grid.cols-3{

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );
}

.video-grid.cols-4{

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );
}

.video-grid.cols-5,
.video-grid.cols-6,
.video-grid.cols-7,
.video-grid.cols-8,
.video-grid.cols-9{

    grid-template-columns:
        repeat(
            3,
            minmax(0,1fr)
        );
}

.video-card{

    position:relative;

    background:#05070b;

    border:1px solid var(--border);

    border-radius:14px;

    overflow:hidden;

    min-height:220px;
}

.video-card video{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    background:#05070b;
}

.video-name{

    position:absolute;

    left:10px;

    bottom:10px;

    padding:6px 9px;

    border-radius:7px;

    background:rgba(0,0,0,.65);

    font-size:12px;
}

.camera-off{

    position:absolute;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    background:#0b0e15;

    color:var(--muted);

    font-size:14px;
}

/* ==========================================================
ROOM CONTROLS
========================================================== */

.room-controls{

    height:75px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    background:var(--panel);

    border-top:1px solid var(--border);
}

.control-btn{

    width:48px;
    height:48px;

    border-radius:50%;

    border:1px solid var(--border);

    background:var(--panel2);

    color:white;

    font-size:18px;
}

.control-btn:hover{

    border-color:var(--accent);
}

.control-btn.off{

    background:#292d39;

    color:#999;
}

.leave-btn{

    width:55px;
    height:48px;

    border-radius:25px;

    border:0;

    background:var(--danger);

    color:white;

    font-size:19px;
}

/* ==========================================================
ROOM CHAT
========================================================== */

.room-chat{

    width:340px;

    flex-shrink:0;

    background:var(--panel);

    border-left:1px solid var(--border);

    display:flex;

    flex-direction:column;

    min-height:0;
}

/* ==========================================================
MODALS
========================================================== */

.modal-overlay{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.65);

    display:none;

    align-items:center;

    justify-content:center;

    z-index:1000;
}

.modal{

    width:520px;

    max-width:
        calc(100vw - 30px);

    max-height:
        calc(100vh - 30px);

    overflow:auto;

    background:var(--panel);

    border:1px solid var(--border);

    border-radius:17px;

    padding:22px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.5);
}

.modal-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:20px;
}

.modal-header h2{

    margin:0;
}

.close-btn{

    width:34px;
    height:34px;

    border-radius:8px;

    border:1px solid var(--border);

    background:var(--panel2);

    color:white;
}

/* ==========================================================
ADMIN
========================================================== */

.admin-tabs{

    display:flex;

    gap:8px;

    margin-bottom:15px;
}

.admin-tab{

    padding:9px 13px;

    border-radius:8px;

    background:var(--panel2);

    border:1px solid var(--border);

    color:var(--muted);
}

.admin-tab.active{

    background:var(--accent);

    color:white;

    border-color:var(--accent);
}

.admin-list{

    display:flex;

    flex-direction:column;

    gap:8px;
}

.admin-item{

    background:var(--panel2);

    border:1px solid var(--border);

    border-radius:10px;

    padding:12px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;
}

.admin-item-info{

    min-width:0;
}

.admin-item-name{

    font-weight:bold;

    font-size:14px;
}

.admin-item-sub{

    color:var(--muted);

    font-size:12px;

    margin-top:3px;
}

.admin-actions{

    display:flex;

    gap:5px;

    flex-wrap:wrap;

    justify-content:flex-end;
}

.admin-action{

    padding:7px 9px;

    border-radius:7px;

    border:1px solid var(--border);

    background:#0d1018;

    color:white;

    font-size:11px;
}

.admin-action:hover{

    border-color:var(--accent);
}

.admin-action.danger{

    color:#ff777c;
}

/* ==========================================================
EMPTY
========================================================== */

.empty{

    padding:50px 20px;

    text-align:center;

    color:var(--muted);

    grid-column:1/-1;
}

/* ==========================================================
RESPONSIVE
========================================================== */

@media(max-width:900px){

    .chat-sidebar,
    .room-chat{

        width:280px;
    }

    .room-screen{

        flex-direction:column;
    }
}

@media(max-width:700px){

    .lobby{

        flex-direction:column;
    }

    .chat-sidebar{

        width:100%;

        height:300px;
    }

    .room-chat{

        width:100%;

        height:280px;
    }

    .room-screen{

        flex-direction:column;
    }

    .room-main{

        min-height:450px;
    }

    .lobby-header{

        flex-direction:column;

        align-items:stretch;
    }

    .room-actions{

        flex-direction:column;
    }

    .search{

        width:100%;
    }

    .video-grid{

        grid-template-columns:1fr !important;
    }
}

</style>

</head>

<body>

<!-- ========================================================
AUTH
========================================================= -->

<div
    class="auth-screen"
    id="authScreen"
>

    <div class="auth-card">

        <div class="logo">
            Col'in<span>Call</span>
        </div>

        <div class="subtitle">
            Discute, rencontre et appelle.
        </div>

        <div class="auth-tabs">

            <button
                class="auth-tab active"
                id="userTab"
                onclick="setLoginMode('user')"
            >
                Utilisateur
            </button>

            <button
                class="auth-tab"
                id="adminTab"
                onclick="setLoginMode('admin')"
            >
                Admin
            </button>

        </div>

        <div class="field">

            <label>
                Nom d'utilisateur
            </label>

            <input
                id="usernameInput"
                placeholder="Ton pseudo"
                autocomplete="off"
            >

        </div>

        <div
            class="field"
            id="passwordField"
            style="display:none"
        >

            <label>
                Code administrateur
            </label>

            <input
                id="passwordInput"
                type="password"
                placeholder="Code"
            >

        </div>

        <button
            class="primary-btn"
            onclick="login()"
        >
            Se connecter
        </button>

        <div
            class="error"
            id="loginError"
        ></div>

    </div>

</div>


<!-- ========================================================
APP
========================================================= -->

<div
    class="app"
    id="app"
>

    <!-- TOPBAR -->

    <div class="topbar">

        <div class="brand">
            Col'in<span>Call</span>
        </div>

        <div class="topbar-right">

            <button
                class="small-btn"
                id="adminButton"
                style="display:none"
                onclick="openAdmin()"
            >
                ⚙ Admin
            </button>

            <button
                class="user-pill"
                onclick="openProfile()"
            >

                <div
                    class="avatar"
                    id="topAvatar"
                >
                    ?
                </div>

                <span id="topUsername">
                    Utilisateur
                </span>

            </button>

        </div>

    </div>


    <!-- ====================================================
    LOBBY
    ===================================================== -->

    <div
        class="lobby"
        id="lobbyScreen"
    >

        <div class="lobby-main">

            <div class="lobby-header">

                <div class="lobby-title">

                    <h1>
                        Salons
                    </h1>

                    <p>
                        Rejoins une conversation ou crée ton propre salon.
                    </p>

                </div>

                <div class="room-actions">

                    <input
                        class="search"
                        id="roomSearch"
                        placeholder="Rechercher un salon..."
                        oninput="renderRooms()"
                    >

                    <button
                        class="small-btn"
                        onclick="createRoom()"
                    >
                        + Créer un salon
                    </button>

                </div>

            </div>

            <div
                class="room-list"
                id="roomList"
            ></div>

        </div>


        <!-- CHAT GENERAL -->

        <div class="chat-sidebar">

            <div class="chat-header">
                💬 Discussion générale
            </div>

            <div
                class="chat-messages"
                id="lobbyChatMessages"
            ></div>

            <div class="chat-input">

                <input
                    id="lobbyChatInput"
                    placeholder="Écrire un message..."
                    onkeydown="
                        if(event.key==='Enter')
                            sendLobbyChat()
                    "
                >

                <button
                    onclick="sendLobbyChat()"
                >
                    ➤
                </button>

            </div>

        </div>

    </div>


    <!-- ====================================================
    ROOM
    ===================================================== -->

    <div
        class="room-screen"
        id="roomScreen"
    >

        <div class="room-main">

            <div class="room-topbar">

                <div>

                    <div
                        class="room-name"
                        id="roomName"
                    >
                        Salon
                    </div>

                    <div
                        class="room-status"
                        id="roomStatus"
                    >
                        0 participants
                    </div>

                </div>

            </div>


            <div
                class="video-grid cols-1"
                id="videoGrid"
            ></div>


            <div class="room-controls">

                <button
                    class="control-btn"
                    id="microBtn"
                    onclick="toggleMicro()"
                    title="Micro"
                >
                    🎤
                </button>

                <button
                    class="control-btn"
                    id="cameraBtn"
                    onclick="toggleCamera()"
                    title="Caméra"
                >
                    📹
                </button>

                <button
                    class="leave-btn"
                    onclick="leaveCurrentRoom()"
                    title="Quitter"
                >
                    ☎
                </button>

            </div>

        </div>


        <!-- ROOM CHAT -->

        <div class="room-chat">

            <div class="chat-header">
                💬 Chat du salon
            </div>

            <div
                class="chat-messages"
                id="roomChatMessages"
            ></div>

            <div class="chat-input">

                <input
                    id="roomChatInput"
                    placeholder="Écrire un message..."
                    onkeydown="
                        if(event.key==='Enter')
                            sendRoomChat()
                    "
                >

                <button
                    onclick="sendRoomChat()"
                >
                    ➤
                </button>

            </div>

        </div>

    </div>

</div>


<!-- ========================================================
PROFILE MODAL
========================================================= -->

<div
    class="modal-overlay"
    id="profileModal"
>

    <div class="modal">

        <div class="modal-header">

            <h2>
                Mon profil
            </h2>

            <button
                class="close-btn"
                onclick="closeProfile()"
            >
                ×
            </button>

        </div>

        <div class="field">

            <label>
                Nom d'utilisateur
            </label>

            <input
                id="profileUsername"
                disabled
            >

        </div>

        <div class="field">

            <label>
                Identifiant
            </label>

            <input
                id="profileId"
                disabled
            >

        </div>

    </div>

</div>


<!-- ========================================================
ADMIN MODAL
========================================================= -->

<div
    class="modal-overlay"
    id="adminModal"
>

    <div class="modal">

        <div class="modal-header">

            <h2>
                Administration
            </h2>

            <button
                class="close-btn"
                onclick="closeAdmin()"
            >
                ×
            </button>

        </div>

        <div class="admin-tabs">

            <button
                class="admin-tab active"
                id="adminUsersTab"
                onclick="showAdminTab('users')"
            >
                Utilisateurs
            </button>

            <button
                class="admin-tab"
                id="adminRoomsTab"
                onclick="showAdminTab('rooms')"
            >
                Salons
            </button>

        </div>

        <div
            class="admin-list"
            id="adminList"
        ></div>

    </div>

</div>


<script>

/* ==========================================================
CONFIG
========================================================== */

const SERVER_URL =
    "wss://projet-nz7b.onrender.com";


/* ==========================================================
STATE
========================================================== */

let socket = null;

let currentUser = null;

let currentRoom = null;

let loginMode = "user";

let rooms = [];

let users = [];

let localStream = null;

let microphoneEnabled = true;

let cameraEnabled = true;

const peers = new Map();

const pendingCandidates = new Map();


/* ==========================================================
DOM
========================================================== */

const authScreen =
    document.getElementById("authScreen");

const app =
    document.getElementById("app");

const lobbyScreen =
    document.getElementById("lobbyScreen");

const roomScreen =
    document.getElementById("roomScreen");

const roomList =
    document.getElementById("roomList");

const videoGrid =
    document.getElementById("videoGrid");


/* ==========================================================
LOGIN MODE
========================================================== */

function setLoginMode(mode){

    loginMode = mode;

    document
        .getElementById("userTab")
        .classList.toggle(
            "active",
            mode === "user"
        );

    document
        .getElementById("adminTab")
        .classList.toggle(
            "active",
            mode === "admin"
        );

    document
        .getElementById("passwordField")
        .style.display =
            mode === "admin"
                ? "block"
                : "none";

}


/* ==========================================================
CONNECT
========================================================== */

function connectSocket(){

    return new Promise((resolve,reject)=>{

        socket =
            new WebSocket(SERVER_URL);

        socket.onopen = () => {

            resolve();
        };

        socket.onerror = () => {

            reject(
                new Error(
                    "Impossible de se connecter au serveur."
                )
            );
        };

        socket.onclose = () => {

            console.log(
                "WebSocket fermé"
            );
        };

        socket.onmessage =
            event => {

                handleMessage(
                    JSON.parse(event.data)
                );
            };
    });
}


/* ==========================================================
SEND
========================================================== */

function send(data){

    if(
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ){

        return;
    }

    socket.send(
        JSON.stringify(data)
    );
}


/* ==========================================================
LOGIN
========================================================== */

async function login(){

    const username =
        document
            .getElementById(
                "usernameInput"
            )
            .value
            .trim();

    const password =
        document
            .getElementById(
                "passwordInput"
            )
            .value;

    const error =
        document.getElementById(
            "loginError"
        );

    error.textContent = "";

    if(!username){

        error.textContent =
            "Entre un nom d'utilisateur.";

        return;
    }

    try{

        await connectSocket();

        send({

            type:"login",

            username,

            password:
                loginMode === "admin"
                    ? password
                    : ""
        });

    }catch(err){

        error.textContent =
            err.message;
    }
}


/* ==========================================================
HANDLE MESSAGE
========================================================== */

function handleMessage(message){

    switch(message.type){

        case "connected":
            break;

        case "login-success":
            handleLoginSuccess(message);
            break;

        case "login-error":
            document
                .getElementById("loginError")
                .textContent =
                    message.message;
            break;

        case "room-list":
            rooms = message.rooms || [];
            renderRooms();
            renderAdmin();
            break;

        case "user-list":
            users = message.users || [];
            renderAdmin();
            break;

        case "room-created":

            joinRoom(
                message.room.id
            );

            break;

        case "room-joined":
            handleRoomJoined(message);
            break;

        case "user-joined":
            handleUserJoined(message.user);
            break;

        case "user-left":
            handleUserLeft(message.userId);
            break;

        case "left-room":
            break;

        case "room-deleted":
            handleRoomDeleted(message);
            break;

        case "force-lobby":
            forceLobby();
            break;

        case "kicked":

            alert(
                message.message ||
                "Vous avez été exclu."
            );

            break;

        case "chat-message":
            addChatMessage(message);
            break;

        case "offer":
            receiveOffer(message);
            break;

        case "answer":
            receiveAnswer(message);
            break;

        case "candidate":
            receiveCandidate(message);
            break;

        case "remote-media-state":
            handleRemoteMediaState(message);
            break;

        case "force-media-state":
            handleForceMediaState(message);
            break;

        case "admin-data":

            users = message.users || [];
            rooms = message.rooms || [];

            renderAdmin();

            break;

        case "error":
            console.error(message.message);
            break;

        case "admin-error":
            alert(message.message);
            break;
    }
}

/* ==========================================================
INITIALS
========================================================== */

function getInitials(name){

    if(!name)
        return "?";

    return name
        .split(" ")
        .map(
            part =>
                part.charAt(0)
        )
        .join("")
        .slice(0,2)
        .toUpperCase();
}


/* ==========================================================
ROOMS
========================================================== */

function renderRooms(){

    const search =
        document
            .getElementById(
                "roomSearch"
            )
            .value
            .toLowerCase()
            .trim();

    const filtered =
        rooms.filter(room =>
            room.name
                .toLowerCase()
                .includes(search)
        );

    if(filtered.length === 0){

        roomList.innerHTML = `

        return;
    }

    filtered.forEach(room => {

        const card =
            document.createElement(

            );

        card.className =
            "room-card";

        card.innerHTML = `

            <h3>
                ${escapeHtml(room.name)}
            </h3>

            <div class="room-card-info">

                👥 ${room.userCount}
                participant${room.userCount > 1 ? "s" : ""}

            </div>

            <button
                onclick="joinRoom('${room.id}')"
            >
                Rejoindre
            </button>

        roomList.appendChild(card);
    });

VIDEO GRID LAYOUT
========================================================== */

function updateVideoGridLayout(count){

    const grid =
        document.getElementById(
            "videoGrid"
        );

    if(!grid)
        return;

    grid.classList.remove(
        "cols-1",
        "cols-2",
        "cols-3",
        "cols-4",
        "cols-5",
        "cols-6",
        "cols-7",
        "cols-8",
        "cols-9"
    );

    if(count <= 1){

        grid.classList.add(
            "cols-1"
        );

    }else if(count === 2){

        grid.classList.add(
            "cols-2"

    }else if(count === 3){

    }else if(count === 4){

        grid.classList.add(
            "cols-4"
        );

    }else{

        grid.classList.add(
            "cols-5"
        );
    }
}


/* ==========================================================
WEBRTC
========================================================== */

async function createConnectionToUser(
    user,
    createOffer
){

    if(peers.has(user.id)){

        const existing =
            peers.get(user.id);

        if(
            existing.connection &&
            existing.connection.connectionState !==
                "closed"
        ){

            return existing.connection;
        }
    }

    const connection =
        new RTCPeerConnection({

            iceServers:[
                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }
            ]
        });

    peers.set(
        user.id,
        {
            connection,
            username:user.username
        }
    );

    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track => {

                    connection.addTrack(
                        track,
                        localStream
                    );
                }
            );
    }

    connection.onicecandidate =
        event => {

            if(event.candidate){

                send({

                    type:"candidate",

                    targetUserId:user.id,

                    candidate:
                        event.candidate
                });
            }
        };

    connection.ontrack =
        event => {

            const video =
                document.getElementById(
                    "video-" +
                    user.id
                );

            if(!video)
                return;

            if(
                event.streams &&
                event.streams[0]
            ){

                video.srcObject =
                    event.streams[0];
            }
        };

    connection.onconnectionstatechange =
        () => {

            const state =
                connection.connectionState;

            if(
                state === "failed" ||
                state === "closed"
            ){

                closePeer(
                    user.id
                );
            }
        };

    if(createOffer){

        const offer =
            await connection.createOffer();

        await connection.setLocalDescription(
            offer
        );

        send({

            type:"offer",

            targetUserId:user.id,

            offer
        });
    }

    return connection;
}


/* ==========================================================
RECEIVE OFFER
========================================================== */

async function receiveOffer(message){

    const user =
        findUser(
            message.fromUserId
        );

    if(!user)
        return;

    let peer =
        peers.get(
            user.id
        );

    let connection;

    if(peer){

        connection =
            peer.connection;

    }else{

        connection =
            await createConnectionToUser(
                user,
                false
            );
    }

    await connection.setRemoteDescription(
        new RTCSessionDescription(
            message.offer
        )
    );

    await flushPendingCandidates(
        user.id
    );

    const answer =
        await connection.createAnswer();

    await connection.setLocalDescription(
        answer
    );

    send({

        type:"answer",

        targetUserId:user.id,

        answer
    });
}


/* ==========================================================
RECEIVE ANSWER
========================================================== */

async function receiveAnswer(message){

    const peer =
        peers.get(
            message.fromUserId
        );

    if(!peer)
        return;

    await peer.connection.setRemoteDescription(
        new RTCSessionDescription(
            message.answer
        )
    );

    await flushPendingCandidates(
        message.fromUserId
    );
}


/* ==========================================================
RECEIVE CANDIDATE
========================================================== */

async function receiveCandidate(message){

    const peer =
        peers.get(
            message.fromUserId
        );

    if(
        !peer ||
        !peer.connection.remoteDescription
    ){

        if(
            !pendingCandidates.has(
                message.fromUserId
            )
        ){

            pendingCandidates.set(
                message.fromUserId,
                []
            );
        }

        pendingCandidates
            .get(message.fromUserId)
            .push(
                message.candidate
            );

        return;
    }

    try{

        await peer.connection.addIceCandidate(
            new RTCIceCandidate(
                message.candidate
            )
        );

    }catch(error){

        console.error(
            "ICE error",
            error
        );
    }
}


/* ==========================================================
FLUSH CANDIDATES
========================================================== */

async function flushPendingCandidates(
    userId
){

    const list =
        pendingCandidates.get(
            userId
        );

    if(!list)
        return;

    const peer =
        peers.get(userId);

    if(!peer)
        return;

    for(
        const candidate of list
    ){

        try{

            await peer.connection.addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

        }catch(error){

            console.error(
                "ICE flush error",
                error
            );
        }
    }

    pendingCandidates.delete(
        userId
    );
}


/* ==========================================================
FIND USER
========================================================== */

function findUser(userId){

    return users.find(
        user =>
            user.id === userId
    );
}


/* ==========================================================
CLOSE PEER
========================================================== */

function closePeer(userId){

    const peer =
        peers.get(userId);

    if(peer){

        try{
            peer.connection.close();
        }catch(e){}

        peers.delete(userId);
    }

    pendingCandidates.delete(
        userId
    );
}

MICRO

function toggleMicro(){

        cameraEnabled

CAMERA

REMOTE MEDIA STATE
========================================================== */

function handleRemoteMediaState(
    message
){

            "camera-off-" +
            message.userId
        );

/* ==========================================================
FORCE MEDIA STATE
========================================================== */

function handleForceMediaState(
    message
){

    if(!localStream)
        return;

    if(
        typeof message.microphoneEnabled ===
        "boolean"
    ){

        microphoneEnabled =
            message.microphoneEnabled;

        localStream
            .getAudioTracks()
            .forEach(
                track => {

                    track.enabled =
                        microphoneEnabled;
                }
            );

        updateControlButton(
            "microBtn",
            microphoneEnabled
        );
    }

    if(
        typeof message.cameraEnabled ===
        "boolean"
    ){

        cameraEnabled =
            message.cameraEnabled;

        localStream
            .getVideoTracks()
            .forEach(
                track => {

                    track.enabled =
                        cameraEnabled;
                }
            );

        updateControlButton(
            "cameraBtn",
            cameraEnabled
        );

        const localCamera =
            document.getElementById(
                "localCameraOff"
            );

        if(localCamera){

        }

/* ==========================================================
LEAVE ROOM
========================================================== */

function leaveCurrentRoom(){

    if(!currentRoom)
        return;

    const confirmed =
        confirm(
            `Voulez-vous vraiment quitter le salon "${currentRoom.name}" ?`
        );

    if(!confirmed)
        return;

    send({
        type:"leave-room"
    });

    closeAllPeers();

    stopLocalMedia();

    currentRoom = null;

    if(currentUser){

        currentUser.roomId =
            null;
    }

    videoGrid.innerHTML = "";

    roomScreen.style.display =
        "none";

    lobbyScreen.style.display =
        "flex";
}


/* ==========================================================
CLOSE ALL PEERS
========================================================== */

function closeAllPeers(){

    for(
        const [userId, peer]
        of peers
    ){

        try{

            peer.connection.close();

        }catch(e){}

    }

    peers.clear();

    pendingCandidates.clear();
}


/* ==========================================================
STOP LOCAL MEDIA
========================================================== */

function stopLocalMedia(){

    if(!localStream)
        return;

    localStream
        .getTracks()
        .forEach(
            track =>
                track.stop()
        );

    localStream = null;

    microphoneEnabled = true;

    cameraEnabled = true;
}


/* ==========================================================
ROOM DELETED
========================================================== */

function handleRoomDeleted(
    message
){

    if(
        currentRoom &&
        currentRoom.id === message.roomId
    ){

        forceLobby();
    }
}

FORCE LOBBY
========================================================== */

function forceLobby(){

    closeAllPeers();

    stopLocalMedia();

    currentRoom = null;

    if(currentUser){

        currentUser.roomId =
            null;
    }

    videoGrid.innerHTML = "";

    roomScreen.style.display =

    lobbyScreen.style.display =
        "flex";
}

/* ==========================================================
ADD CHAT MESSAGE
========================================================== */

function addChatMessage(
    message
){

    const isRoomMessage =
        message.roomId &&
        currentRoom &&
        message.roomId ===
            currentRoom.id;

    if(isRoomMessage){

        appendChatMessage(
            "roomChat",
            message
        );

        if(
            currentUser &&
            message.userId !==
                currentUser.id
        ){

            showChatNotification(
                "Message dans le salon",
                `${message.username} : ${message.text}`
            );
        }

        return;
    }

    if(!message.roomId){

        appendChatMessage(
            "lobbyChat",
            message
        );

        if(
            currentUser &&
            message.userId !==
                currentUser.id
        ){

            showChatNotification(
                "Discussion générale",
                `${message.username} : ${message.text}`
            );
        }
    }
}


/* ==========================================================
APPEND CHAT
========================================================== */

function appendChatMessage(
    target,
    message
){

    const container =
        target === "roomChat"

            ? document.getElementById(
                "roomChatMessages"
            )

            : document.getElementById(
                "lobbyChatMessages"
            );

    if(!container)
        return;

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "chat-message";

    const user =
        document.createElement(
            "div"
        );

    user.className =
        "chat-message-user";

    user.textContent =
        message.username;

    const text =
        document.createElement(
            "div"
        );

    text.className =
        "chat-message-text";

    text.textContent =
        message.text;

    const time =
        document.createElement(
            "div"
        );

    time.className =
        "chat-message-time";

    time.textContent =
        new Date(
            message.timestamp
        ).toLocaleTimeString(
            "fr-FR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    wrapper.appendChild(user);

    wrapper.appendChild(text);

    wrapper.appendChild(time);

    container.appendChild(
        wrapper
    );

    container.scrollTop =
        container.scrollHeight;
}


/* ==========================================================
CHAT NOTIFICATION
========================================================== */

function showChatNotification(
    title,
    text
){

    const notification =
        document.createElement(
            "div"
        );

    notification.className =
        "chat-notification";

    notification.innerHTML = `

        <div
            class="chat-notification-title"
        >
            💬 ${escapeHtml(title)}
        </div>

        <div
            class="chat-notification-text"
        >
            ${escapeHtml(text)}
        </div>

    `;

    document.body.appendChild(
        notification
    );

    setTimeout(
        () => {

            notification.style.opacity =
                "0";

            notification.style.transform =
                "translateX(30px)";

            setTimeout(
                () => {

                    notification.remove();

                },
                250
            );

        },
        3500
    );
}

/* ==========================================================
ADMIN
========================================================== */

function openAdmin(){

    if(

        .getElementById(
            "adminModal"
        )

function closeAdmin(){

/* ==========================================================
ADMIN TAB
========================================================== */

let currentAdminTab =
    "users";

function showAdminTab(
    tab
){

    currentAdminTab =
        tab;

    document
        .getElementById(
            "adminUsersTab"
        )
        .classList.toggle(
            "active",
            tab === "users"
        );

    document
        .getElementById(
            "adminRoomsTab"
        )
        .classList.toggle(
            "active",
            tab === "rooms"
        );

    renderAdmin();
}


/* ==========================================================
RENDER ADMIN
========================================================== */

function renderAdmin(){

    const list =
        document.getElementById(
            "adminList"
        );

    if(!list)
        return;

    list.innerHTML = "";

    if(currentAdminTab === "users"){

        if(users.length === 0){

            list.innerHTML = `
                <div class="empty">
                    Aucun utilisateur.
                </div>
            `;

            return;
        }

        users.forEach(user => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "admin-item";

            const room =
                rooms.find(
                    r =>
                        r.id ===
                        user.roomId
                );

            item.innerHTML = `

                <div class="admin-item-info">

                    <div class="admin-item-name">

                        ${escapeHtml(
                            user.username
                        )}

                        ${
                            user.id ===
                            currentUser?.id
                                ? "(vous)"
                                : ""
                        }

                    </div>

                    <div class="admin-item-sub">

                        ${
                            room
                                ? escapeHtml(
                                    room.name
                                )
                                : "Dans le lobby"
                        }

                        ·

                        ${
                            user.microphoneEnabled
                                ? "🎤 ON"
                                : "🔇 OFF"
                        }

                        ·

                        ${
                            user.cameraEnabled
                                ? "📹 ON"
                                : "🚫 OFF"
                        }

                    </div>

                </div>

                <div class="admin-actions">

                    ${
                        user.id !==
                        currentUser?.id
                            ? `

                        <button
                            class="admin-action"
                            onclick="adminMute('${user.id}')"
                        >
                            🔇 Mute
                        </button>

                        <button
                            class="admin-action"
                            onclick="adminCamera('${user.id}')"
                        >
                            🚫 Caméra
                        </button>

                        <button
                            class="admin-action danger"
                            onclick="adminKick('${user.id}')"
                        >
                            Expulser
                        </button>

                        `
                            : ""
                    }

                </div>
            `;

            list.appendChild(item);
        });

        return;
    }

    // --------------------------------------------------------
    // ROOMS
    // --------------------------------------------------------

    if(rooms.length === 0){

        list.innerHTML = `
            <div class="empty">
                Aucun salon.
            </div>
        `;

        return;
    }

    rooms.forEach(room => {

        const item =
            document.createElement(
                "div"
            );

        item.className =
            "admin-item";

        item.innerHTML = `

            <div class="admin-item-info">

                <div class="admin-item-name">

                    ${escapeHtml(room.name)}

                </div>

                <div class="admin-item-sub">

                    👥 ${room.userCount}
                    participant${room.userCount > 1 ? "s" : ""}

                    ${
                        room.permanent
                            ? " · Permanent"
                            : ""
                    }

                </div>

            </div>

            <div class="admin-actions">

                ${
                    !room.permanent
                        ? `

                    <button
                        class="admin-action danger"
                        onclick="adminDeleteRoom('${room.id}')"
                    >
                        Supprimer
                    </button>

                    `
                        : ""
                }

            </div>

        `;

        list.appendChild(item);
    });
}

/* ==========================================================
ESCAPE HTML
========================================================== */

function escapeHtml(value){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}
