<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Vibe — Room</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #08090d;
  --panel: #11131a;
  --panel2: #171922;
  --border: rgba(255,255,255,.09);
  --text: #fff;
  --muted: #8e94a3;
  --accent: #765cff;
  --green: #36e58a;
  --danger: #ff4967;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* =========================
   APP
========================= */

.app {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: 1fr 340px;
}

/* =========================
   MAIN
========================= */

.main {
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* =========================
   HEADER
========================= */

.header {
  height: 72px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 20px;
  font-weight: 800;
}

.logoDot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: linear-gradient(
    135deg,
    #7b5cff,
    #00d4ff
  );
  box-shadow:
    0 0 20px rgba(118,92,255,.7);
}

.roomInfo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.roomBadge {
  padding: 8px 13px;
  border-radius: 10px;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
}

.people {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 13px;
}

.onlineDot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 12px var(--green);
}

/* =========================
   VIDEOS
========================= */

.videos {
  flex: 1;
  min-height: 0;
  padding: 18px;
  display: grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(280px, 1fr)
    );
  grid-auto-rows: minmax(180px, 1fr);
  gap: 14px;
  overflow: auto;
}

.videoCard {
  position: relative;
  min-height: 180px;
  overflow: hidden;
  border-radius: 20px;
  background:
    radial-gradient(
      circle at 50% 30%,
      rgba(118,92,255,.10),
      transparent 45%
    ),
    #12141b;
  border: 1px solid var(--border);
  box-shadow:
    0 15px 40px rgba(0,0,0,.22);
}

.videoCard video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.videoCard.local video {
  transform: scaleX(-1);
}

.userInfo {
  position: absolute;
  left: 13px;
  bottom: 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 11px;
  border-radius: 11px;
  background: rgba(0,0,0,.52);
  backdrop-filter: blur(15px);
  font-size: 12px;
}

.micState {
  opacity: .8;
}

/* Avatar quand vidéo indisponible */

.avatar {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
}

.avatarCircle {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 28px;
  font-weight: 700;
  background:
    linear-gradient(
      135deg,
      rgba(118,92,255,.8),
      rgba(0,212,255,.7)
    );
  box-shadow:
    0 0 60px rgba(118,92,255,.2);
}

/* =========================
   CONTROLS
========================= */

.controls {
  height: 82px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border-top: 1px solid var(--border);
}

.control {
  width: 48px;
  height: 48px;
  border-radius: 15px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.055);
  color: white;
  font-size: 18px;
  transition: .2s;
}

.control:hover {
  background: rgba(255,255,255,.11);
  transform: translateY(-2px);
}

.control.off {
  background: rgba(255,73,103,.15);
  color: #ff7188;
}

.leave {
  width: 110px;
  height: 48px;
  margin-left: 8px;
  border-radius: 15px;
  border: 0;
  background: var(--danger);
  color: white;
  font-weight: 750;
  transition: .2s;
}

.leave:hover {
  transform: translateY(-2px);
  box-shadow:
    0 10px 30px rgba(255,73,103,.25);
}

/* =========================
   CHAT
========================= */

.chat {
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: #0d0f14;
  border-left: 1px solid var(--border);
}

.chatHeader {
  height: 72px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--border);
}

.chatTitle {
  font-weight: 750;
}

.chatSubtitle {
  margin-top: 3px;
  color: var(--muted);
  font-size: 11px;
}

.messages {
  flex: 1;
  min-height: 0;
  padding: 18px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 85%;
}

.message.mine {
  align-self: flex-end;
  align-items: flex-end;
}

.messageName {
  color: var(--muted);
  font-size: 10px;
}

.messageBubble {
  padding: 10px 12px;
  border-radius: 13px;
  background: rgba(255,255,255,.06);
  color: #e8e9ed;
  font-size: 13px;
  line-height: 1.45;
}

.message.mine .messageBubble {
  background: var(--accent);
  color: white;
}

.chatInput {
  padding: 13px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}

.chatInput input {
  min-width: 0;
  flex: 1;
  height: 43px;
  border-radius: 12px;
  border: 1px solid var(--border);
  outline: none;
  background: rgba(255,255,255,.055);
  color: white;
  padding: 0 12px;
}

.chatInput button {
  width: 43px;
  border-radius: 12px;
  border: 0;
  background: var(--accent);
  color: white;
  font-size: 18px;
}

/* =========================
   MOBILE
========================= */

@media(max-width: 850px) {

  .app {
    grid-template-columns: 1fr;
  }

  .chat {
    display: none;
  }

  .videos {
    grid-template-columns:
      repeat(
        auto-fit,
        minmax(160px, 1fr)
      );
    grid-auto-rows: minmax(150px, 1fr);
    padding: 10px;
    gap: 9px;
  }

  .videoCard {
    min-height: 150px;
    border-radius: 16px;
  }

  .header {
    padding: 0 15px;
    height: 62px;
  }

  .roomBadge {
    display: none;
  }

  .controls {
    height: 72px;
  }

}

</style>

</head>

<body>

<div class="app">

  <main class="main">

    <header class="header">

      <div class="logo">

        <span class="logoDot"></span>

        Vibe

      </div>

      <div class="roomInfo">

        <div class="roomBadge">
          Salon général
        </div>

        <div class="people">

          <span class="onlineDot"></span>

          <span id="peopleCount">
            0 personne
          </span>

        </div>

      </div>

    </header>

    <section
      class="videos"
      id="videos"
    ></section>

    <footer class="controls">

      <button
        class="control"
        id="micButton"
        title="Micro"
      >
        🎙
      </button>

      <button
        class="control"
        id="cameraButton"
        title="Caméra"
      >
        📷
      </button>

      <button
        class="leave"
        id="leaveButton"
      >
        Quitter
      </button>

    </footer>

  </main>

  <aside class="chat">

    <header class="chatHeader">

      <div>

        <div class="chatTitle">
          Discussion
        </div>

        <div class="chatSubtitle">
          Les messages sont visibles par tous
        </div>

      </div>

    </header>

    <div
      class="messages"
      id="messages"
    ></div>

    <form
      class="chatInput"
      id="chatForm"
    >

      <input
        id="messageInput"
        placeholder="Écrire un message..."
        autocomplete="off"
        maxlength="500"
      >

      <button type="submit">
        ↑
      </button>

    </form>

  </aside>

</div>

<script>

/*
==================================================
CONFIG
==================================================
*/

const SERVER_URL =
  "wss://projet-nz7b.onrender.com";

const ROOM_ID = "general";

/*
==================================================
STATE
==================================================
*/

let socket = null;
let localStream = null;

const myId =
  crypto.randomUUID();

const myName =
  "Vous";

const peers = new Map();

/*
==================================================
WEBRTC
==================================================
*/

const rtcConfig = {

  iceServers: [

    {
      urls:
        "stun:stun.l.google.com:19302"
    }

  ]

};

/*
==================================================
DOM
==================================================
*/

const videos =
  document.getElementById("videos");

const peopleCount =
  document.getElementById("peopleCount");

const messages =
  document.getElementById("messages");

const micButton =
  document.getElementById("micButton");

const cameraButton =
  document.getElementById("cameraButton");

const leaveButton =
  document.getElementById("leaveButton");

const chatForm =
  document.getElementById("chatForm");

const messageInput =
  document.getElementById("messageInput");

/*
==================================================
CAMERA
==================================================
*/

async function startCamera() {

  try {

    localStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            width: {
              ideal: 1280
            },
            height: {
              ideal: 720
            }
          },

          audio: true

        });

    createVideoCard(
      myId,
      myName,
      localStream,
      true
    );

  } catch(error) {

    console.error(error);

    alert(
      "Impossible d'accéder à la caméra ou au microphone."
    );

  }

}

/*
==================================================
VIDEO CARD
==================================================
*/

function createVideoCard(
  id,
  name,
  stream,
  local = false
) {

  if (
    document.getElementById(
      `card-${id}`
    )
  ) {
    return;
  }

  const card =
    document.createElement("div");

  card.className =
    "videoCard" +
    (local ? " local" : "");

  card.id =
    `card-${id}`;

  const video =
    document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;
  video.muted = local;

  if (stream) {
    video.srcObject = stream;
  }

  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  const avatarCircle =
    document.createElement("div");

  avatarCircle.className =
    "avatarCircle";

  avatarCircle.textContent =
    name.charAt(0).toUpperCase();

  avatar.appendChild(
    avatarCircle
  );

  const info =
    document.createElement("div");

  info.className =
    "userInfo";

  info.innerHTML = `
    <span>${escapeHtml(name)}</span>
    <span class="micState">🎙</span>
  `;

  card.appendChild(video);
  card.appendChild(avatar);
  card.appendChild(info);

  videos.appendChild(card);

  updatePeopleCount();

  return video;
}

/*
==================================================
REMOVE VIDEO
==================================================
*/

function removeVideoCard(id) {

  const card =
    document.getElementById(
      `card-${id}`
    );

  if (card) {
    card.remove();
  }

  updatePeopleCount();

}

/*
==================================================
SOCKET
==================================================
*/

function connect() {

  socket =
    new WebSocket(SERVER_URL);

  socket.onopen = () => {

    socket.send(
      JSON.stringify({

        type: "join-room",

        roomId: ROOM_ID,

        name: myName

      })
    );

  };

  socket.onmessage =
    async event => {

      const message =
        JSON.parse(event.data);

      await handleMessage(
        message
      );

    };

  socket.onclose = () => {

    console.log(
      "Serveur déconnecté"
    );

  };

}

/*
==================================================
MESSAGES
==================================================
*/

async function handleMessage(message) {

  switch(message.type) {

    case "user-joined":

      if (
        message.userId === myId
      ) {
        return;
      }

      /*
      L'utilisateur déjà présent
      crée l'offre.
      */

      if (message.existing) {

        await createPeer(
          message.userId,
          message.name,
          true
        );

      }

      break;

    case "offer":

      await receiveOffer(
        message
      );

      break;

    case "answer":

      await receiveAnswer(
        message
      );

      break;

    case "ice-candidate":

      await receiveCandidate(
        message
      );

      break;

    case "user-left":

      removePeer(
        message.userId
      );

      break;

    case "chat":

      addMessage(
        message.name,
        message.text,
        message.userId === myId
      );

      break;

  }

}

/*
==================================================
CREATE PEER
==================================================
*/

async function createPeer(
  userId,
  name,
  initiator
) {

  if (peers.has(userId)) {
    return;
  }

  const pc =
    new RTCPeerConnection(
      rtcConfig
    );

  const peer = {
    pc,
    name,
    candidates: []
  };

  peers.set(
    userId,
    peer
  );

  /*
  Local tracks
  */

  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => {

        pc.addTrack(
          track,
          localStream
        );

      });

  }

  /*
  Remote stream
  */

  pc.ontrack = event => {

    const stream =
      event.streams[0];

    if (!stream) return;

    createVideoCard(
      userId,
      name,
      stream,
      false
    );

  };

  /*
  ICE
  */

  pc.onicecandidate =
    event => {

      if (
        event.candidate
      ) {

        send({

          type:
            "ice-candidate",

          target:
            userId,

          data:
            event.candidate

        });

      }

    };

  /*
  Connection
  */

  pc.onconnectionstatechange =
    () => {

      if (
        pc.connectionState ===
        "failed"
      ) {

        removePeer(
          userId
        );

      }

    };

  /*
  Initiator
  */

  if (initiator) {

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    send({

      type: "offer",

      target: userId,

      data: offer

    });

  }

}

/*
==================================================
OFFER
==================================================
*/

async function receiveOffer(
  message
) {

  let peer =
    peers.get(
      message.from
    );

  if (!peer) {

    await createPeer(
      message.from,
      message.name,
      false
    );

    peer =
      peers.get(
        message.from
      );

  }

  const pc =
    peer.pc;

  await pc.setRemoteDescription(
    new RTCSessionDescription(
      message.data
    )
  );

  for (
    const candidate
    of peer.candidates
  ) {

    await pc.addIceCandidate(
      new RTCIceCandidate(
        candidate
      )
    );

  }

  peer.candidates = [];

  const answer =
    await pc.createAnswer();

  await pc.setLocalDescription(
    answer
  );

  send({

    type: "answer",

    target:
      message.from,

    data: answer

  });

}

/*
==================================================
ANSWER
==================================================
*/

async function receiveAnswer(
  message
) {

  const peer =
    peers.get(
      message.from
    );

  if (!peer) {
    return;
  }

  await peer.pc
    .setRemoteDescription(
      new RTCSessionDescription(
        message.data
      )
    );

  for (
    const candidate
    of peer.candidates
  ) {

    await peer.pc
      .addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

  }

  peer.candidates = [];

}

/*
==================================================
ICE
==================================================
*/

async function receiveCandidate(
  message
) {

  const peer =
    peers.get(
      message.from
    );

  if (!peer) {
    return;
  }

  if (
    peer.pc.remoteDescription
  ) {

    try {

      await peer.pc
        .addIceCandidate(
          new RTCIceCandidate(
            message.data
          )
        );

    } catch(error) {

      console.error(error);

    }

  } else {

    peer.candidates.push(
      message.data
    );

  }

}

/*
==================================================
REMOVE PEER
==================================================
*/

function removePeer(
  userId
) {

  const peer =
    peers.get(userId);

  if (!peer) {
    return;
  }

  peer.pc.close();

  peers.delete(
    userId
  );

  removeVideoCard(
    userId
  );

}

/*
==================================================
SEND
==================================================
*/

function send(data) {

  if (
    socket &&
    socket.readyState ===
      WebSocket.OPEN
  ) {

    socket.send(
      JSON.stringify(data)
    );

  }

}

/*
==================================================
CHAT
==================================================
*/

chatForm.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    const text =
      messageInput.value.trim();

    if (!text) {
      return;
    }

    send({

      type: "chat",

      text

    });

    messageInput.value = "";

  }
);

function addMessage(
  name,
  text,
  mine
) {

  const message =
    document.createElement("div");

  message.className =
    "message" +
    (mine ? " mine" : "");

  message.innerHTML = `

    <div class="messageName">
      ${escapeHtml(name)}
    </div>

    <div class="messageBubble">
      ${escapeHtml(text)}
    </div>

  `;

  messages.appendChild(
    message
  );

  messages.scrollTop =
    messages.scrollHeight;

}

/*
==================================================
MIC
==================================================
*/

micButton.onclick =
  () => {

    if (!localStream) {
      return;
    }

    const track =
      localStream
        .getAudioTracks()[0];

    if (!track) {
      return;
    }

    track.enabled =
      !track.enabled;

    micButton.classList.toggle(
      "off",
      !track.enabled
    );

    micButton.textContent =
      track.enabled
        ? "🎙"
        : "🔇";

  };

/*
==================================================
CAMERA
==================================================
*/

cameraButton.onclick =
  () => {

    if (!localStream) {
      return;
    }

    const track =
      localStream
        .getVideoTracks()[0];

    if (!track) {
      return;
    }

    track.enabled =
      !track.enabled;

    cameraButton.classList.toggle(
      "off",
      !track.enabled
    );

    cameraButton.textContent =
      track.enabled
        ? "📷"
        : "🚫";

  };

/*
==================================================
LEAVE
==================================================
*/

leaveButton.onclick =
  () => {

    send({
      type: "leave"
    });

    for (
      const [id, peer]
      of peers
    ) {

      peer.pc.close();

    }

    peers.clear();

    if (localStream) {

      localStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }

    if (socket) {
      socket.close();
    }

    window.location.reload();

  };

/*
==================================================
COUNT
==================================================
*/

function updatePeopleCount() {

  const count =
    1 + peers.size;

  peopleCount.textContent =
    count === 1
      ? "1 personne"
      : `${count} personnes`;

}

/*
==================================================
ESCAPE HTML
==================================================
*/

function escapeHtml(
  value
) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

/*
==================================================
START
==================================================
*/

(async function() {

  await startCamera();

  connect();

})();

</script>

</body>

</html>
