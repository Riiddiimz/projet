<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Col'inCall</title>

<style>
:root{
    --bg:#080a10;
    --panel:#111521;
    --panel2:#181d2a;
    --panel3:#202637;
    --border:#293143;
    --text:#f4f7fb;
    --muted:#8993a7;
    --accent:#6c63ff;
    --accent2:#827bff;
    --danger:#e5484d;
    --success:#28c76f;
    --warning:#f5a623;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

body{
    overflow:hidden;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* =========================
   AUTH
========================= */

.auth-screen{
    width:100%;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top right,rgba(108,99,255,.16),transparent 35%),
        radial-gradient(circle at bottom left,rgba(40,199,111,.08),transparent 30%),
        var(--bg);
}

.auth-card{
    width:min(420px,100%);
    background:rgba(17,21,33,.96);
    border:1px solid var(--border);
    border-radius:20px;
    padding:30px;
    box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-title{
    font-size:30px;
    font-weight:800;
}

.logo-title span{
    color:var(--accent2);
}

.logo-subtitle{
    color:var(--muted);
    margin-top:7px;
    font-size:14px;
}

.auth-tabs{
    display:flex;
    gap:6px;
    background:var(--panel2);
    padding:5px;
    border-radius:12px;
    margin-bottom:20px;
}

.auth-tab{
    flex:1;
    border:0;
    background:transparent;
    color:var(--muted);
    padding:11px;
    border-radius:9px;
    font-weight:700;
}

.auth-tab.active{
    background:var(--accent);
    color:white;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:7px;
}

.input{
    width:100%;
    height:48px;
    padding:0 14px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    border-radius:10px;
    outline:none;
    font-size:15px;
}

.input:focus{
    border-color:var(--accent);
}

.primary-btn{
    width:100%;
    height:46px;
    border:0;
    border-radius:10px;
    background:var(--accent);
    color:white;
    font-weight:700;
}

.primary-btn:hover{
    background:var(--accent2);
}

.error{
    color:#ff7478;
    font-size:13px;
    margin-top:10px;
    min-height:18px;
}

/* =========================
   TOPBAR
========================= */

.topbar{
    flex:0 0 64px;
    height:64px;
    background:rgba(17,21,33,.97);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:relative;
    z-index:50;
}

.brand{
    font-weight:800;
    font-size:20px;
}

.brand span{
    color:var(--accent2);
}

.top-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.top-btn{
    height:38px;
    padding:0 12px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--panel2);
    color:var(--text);
    display:flex;
    align-items:center;
    gap:7px;
}

.top-btn:hover{
    background:var(--panel3);
}

.profile-top{
    display:flex;
    align-items:center;
    gap:8px;
}

.avatar{
    width:32px;
    height:32px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--accent),#9c96ff);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:800;
    flex:0 0 32px;
    overflow:hidden;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.profile-name{
    color:var(--text);
    font-size:14px;
    font-weight:600;
}

/* =========================
   MAIN
========================= */

.lobby,
.room-screen{
    flex:1;
    min-height:0;
    width:100%;
}

.lobby{
    display:flex;
    overflow:hidden;
}

.lobby-main{
    flex:1;
    min-width:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:22px;
}

.lobby-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:20px;
}

.lobby-title{
    font-size:25px;
    font-weight:800;
}

.lobby-subtitle{
    color:var(--muted);
    font-size:13px;
    margin-top:5px;
}

.lobby-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.search{
    width:260px;
    height:44px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--panel);
    color:var(--text);
    padding:0 14px;
    outline:none;
    font-size:15px;
}

.search:focus{
    border-color:var(--accent);
}

.small-btn{
    height:44px;
    padding:0 15px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
}

.small-btn.primary{
    border-color:transparent;
    background:var(--accent);
}

.small-btn.danger-outline{
    border-color:rgba(229,72,77,.4);
    background:rgba(229,72,77,.08);
    color:#ff7478;
}

/* =========================
   ROOMS
========================= */

.room-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:12px;
}

.room-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:13px;
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:14px;
    transition:.15s;
}

.room-card:hover{
    border-color:#414b63;
    transform:translateY(-1px);
}

.room-card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
}

.room-card-name{
    font-weight:750;
    font-size:16px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.room-card-count{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.room-card-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.join-room-btn{
    border:0;
    background:var(--accent);
    color:white;
    border-radius:8px;
    height:34px;
    padding:0 13px;
    font-size:13px;
    font-weight:700;
}

/* =========================
   CHAT
========================= */

.chat-sidebar,
.room-chat{
    width:340px;
    flex:0 0 340px;
    background:var(--panel);
    border-left:1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-height:0;
    position:relative;
    z-index:30;
}

.chat-header{
    height:55px;
    flex:0 0 55px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    border-bottom:1px solid var(--border);
}

.chat-title{
    font-weight:750;
}

.chat-close{
    display:none;
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:22px;
}

.chat-messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:12px;
}

.chat-message{
    margin-bottom:11px;
}

.chat-message-author{
    font-size:11px;
    color:var(--accent2);
    margin-bottom:3px;
    font-weight:700;
}

.chat-message-body{
    display:inline-block;
    max-width:90%;
    padding:8px 10px;
    background:var(--panel2);
    border-radius:9px;
    font-size:13px;
    line-height:1.4;
    word-break:break-word;
}

.chat-message.mine{
    text-align:right;
}

.chat-message.mine .chat-message-author{
    color:var(--success);
}

.chat-input-area{
    padding:10px;
    border-top:1px solid var(--border);
    display:flex;
    gap:7px;
}

.chat-input{
    flex:1;
    min-width:0;
    height:40px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--panel2);
    color:var(--text);
    padding:0 11px;
    outline:none;
}

.chat-input:focus{
    border-color:var(--accent);
}

.chat-send{
    width:40px;
    height:40px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:white;
}

/* =========================
   MOBILE CHAT BUTTONS
========================= */

.mobile-chat-toggle{
    display:none;
    position:fixed;
    z-index:45;
    bottom:max(14px,env(safe-area-inset-bottom));
    height:45px;
    border:1px solid var(--border);
    border-radius:22px;
    background:rgba(17,21,33,.96);
    color:white;
    padding:0 15px;
    box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.mobile-chat-toggle.general{
    left:14px;
}

.mobile-chat-toggle.room{
    right:14px;
}

.chat-badge{
    min-width:19px;
    height:19px;
    padding:0 5px;
    border-radius:10px;
    background:var(--danger);
    color:white;
    font-size:10px;
    display:none;
    align-items:center;
    justify-content:center;
    font-weight:800;
    margin-left:4px;
}

.chat-badge.visible{
    display:flex;
}

.mobile-chat-backdrop{
    display:none;
}

/* =========================
   ROOM
========================= */

.room-screen{
    display:none;
    flex-direction:column;
    position:relative;
    overflow:hidden;
}

.room-main{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    background:#05070b;
}

.room-header{
    height:56px;
    flex:0 0 56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    z-index:10;
}

.room-title{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
}

.room-name{
    font-weight:800;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.room-status{
    color:var(--muted);
    font-size:12px;
}

.room-actions{
    display:flex;
    align-items:center;
    gap:7px;
}

.media-btn{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    border-radius:50%;
    background:var(--panel2);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
}

.media-btn.active{
    background:var(--success);
    border-color:var(--success);
}

.media-btn.danger{
    background:var(--danger);
    border-color:var(--danger);
}

.room-chat-mobile-button{
    display:none;
}

/* =========================
   VIDEO GRID
========================= */

.video-grid{
    flex:1;
    min-height:0;
    width:100%;
    padding:14px;
    display:grid;
    gap:12px;
    grid-template-columns:repeat(2,minmax(0,1fr));
    grid-auto-rows:auto;
    align-content:center;
    justify-content:center;
    overflow-y:auto;
}

.video-card{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    min-width:0;
    overflow:hidden;
    background:#10141e;
    border:1px solid var(--border);
    border-radius:12px;
    cursor:pointer;
}

.video-card video{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    background:#05070b;
}

.video-user-label{
    position:absolute;
    left:10px;
    bottom:10px;
    padding:5px 8px;
    border-radius:7px;
    background:rgba(0,0,0,.62);
    font-size:12px;
    z-index:3;
}

.camera-off{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111521;
    z-index:2;
}

.camera-off .avatar{
    width:70px;
    height:70px;
    font-size:24px;
}

.video-grid.count-1{
    grid-template-columns:1fr;
}

.video-grid.count-1 .video-card{
    aspect-ratio:16/9;
    max-width:900px;
    margin:0 auto;
}

.video-grid.count-many{
    grid-template-columns:repeat(3,minmax(0,1fr));
}

/* =========================
   MODALS
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.68);
}

.modal-card{
    width:min(620px,100%);
    max-height:min(700px,90dvh);
    overflow:hidden;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 30px 100px rgba(0,0,0,.55);
}

.modal-header{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 17px;
    border-bottom:1px solid var(--border);
}

.modal-title{
    font-size:17px;
    font-weight:800;
}

.modal-close{
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:23px;
}

.modal-body{
    padding:18px;
    overflow-y:auto;
    max-height:calc(min(700px,90dvh) - 58px);
}

.profile-center{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
}

.profile-big-avatar{
    width:88px;
    height:88px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--accent),#9c96ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:29px;
    font-weight:800;
    overflow:hidden;
    position:relative;
    flex:0 0 auto;
}

.profile-big-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.profile-big-avatar.editable{
    cursor:pointer;
}

.avatar-edit-hint{
    color:var(--muted);
    font-size:11px;
    margin-top:-6px;
}

.profile-id{
    color:var(--muted);
    font-size:12px;
}

.profile-field{
    width:100%;
    margin-top:14px;
}

.profile-field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
}

.profile-textarea{
    width:100%;
    min-height:80px;
    resize:vertical;
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    border-radius:10px;
    padding:10px 12px;
    outline:none;
}

.profile-textarea:focus{
    border-color:var(--accent);
}

.profile-description-view{
    color:var(--muted);
    font-size:13px;
    text-align:center;
    max-width:420px;
    line-height:1.5;
}

.save-btn{
    width:100%;
    margin-top:16px;
    height:44px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:white;
    font-weight:700;
}

.save-btn:hover{
    background:var(--accent2);
}

.logout-btn{
    width:100%;
    margin-top:12px;
    height:43px;
    border:1px solid rgba(229,72,77,.4);
    border-radius:9px;
    background:rgba(229,72,77,.1);
    color:#ff7478;
    font-weight:700;
}

.profile-admin-actions{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
    justify-content:center;
}

.profile-admin-actions .admin-action{
    height:38px;
    padding:0 14px;
}

/* =========================
   ADMIN
========================= */

.admin-tabs{
    display:flex;
    gap:6px;
    margin-bottom:14px;
}

.admin-tab{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--muted);
    padding:9px 13px;
    border-radius:8px;
}

.admin-tab.active{
    color:white;
    background:var(--accent);
    border-color:var(--accent);
}

.admin-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel2);
    margin-bottom:8px;
}

.admin-info{
    min-width:0;
}

.admin-name{
    font-weight:700;
}

.admin-details{
    color:var(--muted);
    font-size:11px;
    margin-top:3px;
}

.admin-actions{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.admin-action{
    height:32px;
    padding:0 9px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--panel3);
    color:white;
    font-size:11px;
}

.admin-action.danger{
    color:#ff7478;
}

/* =========================
   RESPONSIVE MOBILE
========================= */

@media(max-width:700px){

    html,
    body{
        height:100%;
        overflow:hidden;
    }

    .app{
        height:100dvh;
        min-height:100dvh;
        overflow:hidden;
    }

    .topbar{
        flex:0 0 58px;
        height:58px;
        padding:0 10px;
    }

    .brand{
        font-size:18px;
    }

    .top-actions{
        gap:5px;
    }

    .top-btn{
        height:36px;
        padding:0 9px;
    }

    .lobby{
        display:block;
        height:calc(100dvh - 58px);
        min-height:0;
        overflow:hidden;
        position:relative;
    }

    .lobby-main{
        width:100%;
        height:100%;
        min-height:0;
        overflow-y:auto;
        overflow-x:hidden;
        padding:15px 12px 90px;
        -webkit-overflow-scrolling:touch;
    }

    .lobby-header{
        display:block;
        margin-bottom:15px;
    }

    .lobby-title{
        font-size:22px;
        margin-bottom:12px;
    }

    .lobby-actions{
        width:100%;
        display:flex;
    }

    .search{
        flex:1;
        min-width:0;
        width:auto;
    }

    .small-btn{
        flex:0 0 auto;
    }

    .room-list{
        grid-template-columns:1fr;
        gap:9px;
        padding-bottom:20px;
    }

    .room-card{
        padding:12px 14px;
    }

    /*
       Les chats ne prennent plus de place dans le layout mobile
       et ne doivent jamais intercepter les touches quand ils
       sont fermés, afin que le lobby puisse défiler normalement.
    */

    .chat-sidebar,
    .room-chat{
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        width:100%;
        height:min(70dvh,520px);
        max-height:70dvh;
        z-index:80;
        border:1px solid var(--border);
        border-bottom:0;
        border-radius:17px 17px 0 0;
        transform:translateY(105%);
        transition:transform .22s ease;
        box-shadow:0 -15px 50px rgba(0,0,0,.55);
        pointer-events:none;
    }

    .chat-sidebar.mobile-open,
    .room-chat.mobile-open{
        transform:translateY(0);
        pointer-events:auto;
    }

    .chat-close{
        display:block;
    }

    .mobile-chat-toggle{
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .mobile-chat-backdrop{
        position:fixed;
        inset:0;
        z-index:70;
        background:rgba(0,0,0,.55);
        display:none;
    }

    .mobile-chat-backdrop.visible{
        display:block;
    }

    .room-screen{
        height:calc(100dvh - 58px);
        min-height:0;
        display:none;
        overflow:hidden;
    }

    .room-main{
        height:100%;
        min-height:0;
    }

    .room-header{
        height:52px;
        flex:0 0 52px;
        padding:0 9px;
    }

    .room-title{
        min-width:0;
        max-width:45%;
    }

    .room-name{
        font-size:14px;
    }

    .room-status{
        font-size:10px;
    }

    .room-actions{
        gap:5px;
    }

    .media-btn{
        width:35px;
        height:35px;
        font-size:14px;
    }

    .room-chat-mobile-button{
        display:flex;
        align-items:center;
        justify-content:center;
        width:35px;
        height:35px;
        border:1px solid var(--border);
        border-radius:50%;
        background:var(--panel2);
        color:white;
        position:relative;
    }

    /*
       2 personnes et 3 personnes : même grille, mêmes
       proportions de vignette. La taille de chaque vignette
       dépend uniquement de la largeur de colonne (aspect-ratio
       fixe), jamais du nombre de rangées.
    */

    .video-grid{

</style>
</head>

<script>
/* =========================
   CONFIG
========================= */

const WS_URL = "wss://projet-nz7b.onrender.com";

let socket = null;
let currentUser = null;
let currentRoom = null;
let loginMode = "user";

let rooms = [];
let users = [];

let localStream = null;
let microphoneEnabled = false;
let cameraEnabled = false;

const peers = new Map();
const pendingCandidates = new Map();

let currentAdminTab = "users";
let roomUnreadCount = 0;

let pendingAvatarUrl = undefined; // undefined = pas de changement, null = suppression
let viewingUserId = null;

/* =========================
   DOM
========================= */

const authScreen = document.getElementById("authScreen");
const app = document.getElementById("app");

const lobbyScreen = document.getElementById("lobbyScreen");
const roomScreen = document.getElementById("roomScreen");

const lobbyChat = document.getElementById("lobbyChat");
const roomChat = document.getElementById("roomChat");

const mobileChatBackdrop = document.getElementById("mobileChatBackdrop");

const roomChatUnread = document.getElementById("roomChatUnread");
const roomChatUnreadMobile = document.getElementById("roomChatUnreadMobile");

const videoGrid = document.getElementById("videoGrid");

/* =========================
   UTILS
========================= */

function send(data){
    if(socket && socket.readyState === WebSocket.OPEN){
        socket.send(JSON.stringify(data));
    }
}

function getInitial(username){
    if(!username) return "?";
    return username.trim().charAt(0).toUpperCase() || "?";
}

function escapeHtml(value){
    return String(value ?? "");
}

function avatarInnerHtml(user){
    if(user && user.avatarUrl){
        return `<img src="${user.avatarUrl}" alt="">`;
    }
    return escapeHtml(getInitial(user ? user.username : ""));
}

function findUserById(userId){
    if(currentUser && userId === currentUser.id) return currentUser;
    return users.find(user => user.id === userId) || null;
}

/* =========================
   LOGIN
========================= */

function switchLoginMode(mode){
    loginMode = mode;

    document.getElementById("userTab").classList.toggle(
        "active",
        mode === "user"
    );

    document.getElementById("adminTab").classList.toggle(
        "active",
        mode === "admin"
    );

    document.getElementById("passwordField").style.display =
        mode === "admin" ? "block" : "none";
}

function login(){
    const username =
        document.getElementById("usernameInput").value.trim();

    const password =
        document.getElementById("passwordInput").value;

    const error =
        document.getElementById("loginError");

    error.textContent = "";

    if(!username){
        error.textContent = "Veuillez entrer un nom d'utilisateur.";
        return;
    }

    if(loginMode === "admin" && !password){
        error.textContent = "Veuillez entrer le code administrateur.";
        return;
    }

    connectSocket(() => {
        send({
            type:"login",
            username,
            password: loginMode === "admin" ? password : null,
            isAdmin: loginMode === "admin"
        });
    });
}

function connectSocket(callback){
    if(socket && socket.readyState === WebSocket.OPEN){
        callback();
        return;
    }

    socket = new WebSocket(WS_URL);

    socket.onopen = () => {
        callback();
    };

    socket.onmessage = event => {
        try{
            const message = JSON.parse(event.data);
            handleMessage(message);
        }catch(error){
            console.error("Message invalide",error);
        }
    };

    socket.onerror = () => {
        const error = document.getElementById("loginError");
        if(error){
            error.textContent = "Impossible de contacter le serveur.";
        }
    };

    socket.onclose = () => {
        socket = null;
    };
}

/* =========================
   SESSION
========================= */

function restoreSession(){
    const token = localStorage.getItem("colincall_session");

    if(!token) return;

    connectSocket(() => {
        send({
            type:"restore-session",
            sessionToken:token
        });
    });
}

function handleLoginSuccess(message){
    currentUser = message.user;

    if(message.sessionToken){
        localStorage.setItem(
            "colincall_session",
            message.sessionToken
        );
    }

    showApplication();
}

function handleSessionRestored(message){
    currentUser = message.user;

    showApplication();
}

function showApplication(){
    authScreen.style.display = "none";
    app.style.display = "flex";

    updateTopProfile();

    document.getElementById("adminButton").style.display =
        currentUser && currentUser.isAdmin
            ? "flex"
            : "none";

    showLobby();

    closeMobileChat();
}

function updateTopProfile(){
    if(!currentUser) return;

    document.getElementById("topAvatar").innerHTML =
        avatarInnerHtml(currentUser);

    document.getElementById("topUsername").textContent =
        currentUser.username;
}

function logout(){
    localStorage.removeItem("colincall_session");

    closeAllPeers();
    stopLocalMedia();

    currentUser = null;
    currentRoom = null;

    roomUnreadCount = 0;
    updateRoomUnreadBadge();

    if(socket){
        try{
            socket.close();
        }catch(e){}
    }

    socket = null;

    closeProfile();
    closeUserProfile();
    closeAdmin();
    closeMobileChat();

    app.style.display = "none";
    authScreen.style.display = "flex";

    document.getElementById("usernameInput").value = "";
    document.getElementById("passwordInput").value = "";
    document.getElementById("loginError").textContent = "";

    switchLoginMode("user");
}

/* =========================
   SERVER MESSAGES
========================= */

function handleMessage(message){

    switch(message.type){

        case "connected":
            break;

        case "login-success":
            handleLoginSuccess(message);
            break;

        case "session-restored":
            handleSessionRestored(message);
            break;

        case "session-invalid":
            localStorage.removeItem("colincall_session");
            break;

        case "login-error":
            document.getElementById("loginError").textContent =
                message.message || "Connexion refusée.";
            break;

        case "profile-updated":
            currentUser = message.user;
            updateTopProfile();
            break;

        case "room-list":
            rooms = message.rooms || [];
            renderRooms();
            break;

        case "user-list":
            users = message.users || [];
            if(currentUser){
                const me = users.find(u => u.id === currentUser.id);
                if(me) currentUser = { ...currentUser, ...me };
            }
            renderAdmin();
            updateRoomParticipants();
            break;

        case "room-created":
            break;

        case "room-joined":
            handleRoomJoined(message);
            break;

        case "room-left":
            break;

        case "room-user-joined":
            handleRoomUserJoined(message);
            break;

        case "room-user-left":
            handleRoomUserLeft(message);
            break;

        case "chat":
            addChatMessage(message);
            break;

        case "offer":
            handleOffer(message);
            break;

        case "answer":
            handleAnswer(message);
            break;

        case "candidate":
            handleCandidate(message);
            break;

        case "media-state":
        case "remote-media-state":
            handleRemoteMediaState(message);
            break;

        case "force-media-state":
            handleForceMediaState(message);
            break;

        case "force-lobby":
            forceLeaveRoom(message);
            break;

        case "room-deleted":
            handleRoomDeleted(message);
            break;

        case "admin-data":
            rooms = message.rooms || rooms;
            users = message.users || users;
            renderAdmin();
            renderRooms();
            break;

        case "admin-error":
            alert(message.message || "Action refusée.");
            break;

        case "error":
            console.error(message.message);
            break;
    }
}

/* =========================
   LOBBY
========================= */

function showLobby(){
    closeMobileChat();

    lobbyScreen.style.display = "flex";
    roomScreen.style.display = "none";

    document.getElementById("generalChatToggle").style.display =
        window.innerWidth <= 700 ? "flex" : "none";

    document.getElementById("roomChatToggle").style.display = "none";

    renderRooms();
}

function renderRooms(){

    const container = document.getElementById("roomList");
    const search = document
        .getElementById("roomSearch")
        .value
        .trim()
        .toLowerCase();

    container.innerHTML = "";

    const filtered = rooms.filter(room =>
        !search ||
        String(room.name || "").toLowerCase().includes(search)
    );

    if(!filtered.length){
        container.innerHTML = `
            <div style="
                color:var(--muted);
                padding:30px 10px;
                text-align:center;
                grid-column:1/-1;
            ">
                Aucun salon disponible.
            </div>
        `;
        return;
    }

    filtered.forEach(room => {

        const card = document.createElement("div");
        card.className = "room-card";

        const count =
            room.userCount ??
            room.users?.length ??
            0;

        card.innerHTML = `
            <div class="room-card-top">
                <div style="min-width:0;">
                    <div class="room-card-name">
                        ${escapeHtml(room.name)}
                    </div>
                    <div class="room-card-count">
                        👥 ${count} participant${count > 1 ? "s" : ""}
                    </div>
                </div>
            </div>

            <div class="room-card-bottom">
                <span style="color:var(--muted);font-size:11px;">
                    Salon
                </span>

                <button
                    class="join-room-btn"
                    onclick="joinRoom('${room.id}')"
                >
                    Rejoindre
                </button>
            </div>
        `;

        container.appendChild(card);
    });
}

function createRoom(){

    if(!currentUser) return;

    const name = prompt("Nom du salon :");

    if(!name) return;

    const cleanName = name.trim();

    if(!cleanName) return;

    send({
        type:"create-room",
        name:cleanName
    });
}

function joinRoom(roomId){

    if(!currentUser) return;

    closeMobileChat();

    prepareLocalMedia();

    send({
        type:"join-room",
        roomId
    });
}

document
    .getElementById("roomSearch")
    .addEventListener("input",renderRooms);

/* =========================
   ROOM JOINED
========================= */

async function prepareLocalMedia(){

    if(localStream) return;

    try{

        localStream =
            await navigator.mediaDevices.getUserMedia({
                video:true,
                audio:true
            });

        localStream.getAudioTracks().forEach(
            track => track.enabled = false
        );

        localStream.getVideoTracks().forEach(
            track => track.enabled = false
        );

        microphoneEnabled = false;
        cameraEnabled = false;

        updateControlButton();

    }catch(error){

        console.error("Media error",error);

        localStream = null;
        microphoneEnabled = false;
        cameraEnabled = false;

        updateControlButton();
    }
}

function handleRoomJoined(message){

    currentRoom = message.room;

    roomUnreadCount = 0;
    updateRoomUnreadBadge();

    closeMobileChat();

    lobbyScreen.style.display = "none";
    roomScreen.style.display = "flex";

    document.getElementById("generalChatToggle").style.display = "none";

    document.getElementById("roomChatToggle").style.display =
        window.innerWidth <= 700 ? "flex" : "none";

    document.getElementById("roomName").textContent =
        currentRoom.name || "Salon";

    document.getElementById("roomStatus").textContent =
        "Vous êtes connecté";

    document.getElementById("roomChatMessages").innerHTML = "";
    videoGrid.innerHTML = "";

    closeAllPeers();

    addLocalVideo();

    const participants =
        message.users ||
        message.participants ||
        [];

    participants.forEach(user => {

        if(
            currentUser &&
            user.id === currentUser.id
        ) return;

        addVideoUser(user);

        // Seul le nouvel arrivant initie l'offre vers les
        // participants déjà présents, pour éviter tout conflit
        // de négociation (glare) des deux côtés à la fois.
        createOfferForUser(user);
    });

    updateVideoGridLayout();
}

function addLocalVideo(){

    const card = document.createElement("div");
    card.className = "video-card";
    card.id = "video-user-local";
    card.onclick = () => openUserProfile(currentUser.id);

    const video = document.createElement("video");

    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;

    if(localStream){
        video.srcObject = localStream;
    }

    const cameraOff = document.createElement("div");
    cameraOff.className = "camera-off";
    cameraOff.id = "camera-off-local";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.innerHTML = avatarInnerHtml(currentUser);

    cameraOff.appendChild(avatar);

    const label = document.createElement("div");
    label.className = "video-user-label";
    label.textContent =
        (currentUser && currentUser.username) || "Vous";

    card.appendChild(video);
    card.appendChild(cameraOff);
    card.appendChild(label);

    videoGrid.appendChild(card);

    updateLocalCameraDisplay();
}

function addVideoUser(user){

    if(document.getElementById("video-user-" + user.id)){
        return;
    }

    const card = document.createElement("div");

    card.className = "video-card";
    card.id = "video-user-" + user.id;
    card.onclick = () => openUserProfile(user.id);

    const video = document.createElement("video");

    video.autoplay = true;
    video.playsInline = true;

    const cameraOff = document.createElement("div");
    cameraOff.className = "camera-off";
    cameraOff.id = "camera-off-" + user.id;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.innerHTML = avatarInnerHtml(user);

    cameraOff.appendChild(avatar);

    const label = document.createElement("div");
    label.className = "video-user-label";
    label.textContent = user.username;

    card.appendChild(video);
    card.appendChild(cameraOff);
    card.appendChild(label);

    videoGrid.appendChild(card);

    card.dataset.userId = user.id;

    updateRemoteCameraDisplay(
        user.id,
        user.cameraEnabled
    );

    updateVideoGridLayout();
}

/* =========================
   VIDEO LAYOUT
========================= */

function updateVideoGridLayout(){

    const count =
        videoGrid.querySelectorAll(".video-card").length;

    videoGrid.classList.remove(
        "count-1",
        "count-many"
    );

    if(count <= 1){
        videoGrid.classList.add("count-1");
    }else if(count >= 5){
        videoGrid.classList.add("count-many");
    }
    // De 2 à 4 personnes : grille par défaut à 2 colonnes,
    // avec une hauteur de vignette fixe (aspect-ratio) pour

/* =========================
   WEBRTC
========================= */

function createPeerConnection(userId){

    if(peers.has(userId)){
        return peers.get(userId);
    }

    const peer =
        new RTCPeerConnection({
            iceServers:[
                {
                    urls:"stun:stun.l.google.com:19302"
                }
            ]
        });

    peers.set(userId,peer);

    if(localStream){

        localStream.getTracks().forEach(track => {
            peer.addTrack(track,localStream);
        });
    }

    peer.onicecandidate = event => {

        if(event.candidate){

            send({
                type:"candidate",
                targetId:userId,
                candidate:event.candidate
            });
        }
    };

    peer.ontrack = event => {

        const card =
            document.getElementById(
                "video-user-" + userId
            );

        if(!card) return;

        const video =
            card.querySelector("video");

        if(video){
            video.srcObject = event.streams[0];
        }
    };

    peer.onconnectionstatechange = () => {

        if(
            peer.connectionState === "failed" ||
            peer.connectionState === "closed"
        ){
            closePeer(userId);
        }
    };

    return peer;
}

async function createOfferForUser(user){

    if(!user || !user.id) return;

    const peer =
        createPeerConnection(user.id);

    try{

        const offer =
            await peer.createOffer();

        await peer.setLocalDescription(offer);

        send({
            type:"offer",
            targetId:user.id,
            offer:peer.localDescription
        });

    }catch(error){
        console.error("Offer error",error);
    }
}

async function handleOffer(message){

    const userId =
        message.fromId ||
        message.userId ||
        message.senderId;

    if(!userId || !message.offer) return;

    const peer =
        createPeerConnection(userId);

    try{

        await peer.setRemoteDescription(
            new RTCSessionDescription(message.offer)
        );

        await flushCandidates(userId,peer);

        const answer =
            await peer.createAnswer();

        await peer.setLocalDescription(answer);

        send({
            type:"answer",
            targetId:userId,
            answer:peer.localDescription
        });

    }catch(error){
        console.error("Offer handling error",error);
    }
}

async function handleAnswer(message){

    const userId =
        message.fromId ||
        message.userId ||
        message.senderId;

    if(!userId || !message.answer) return;

    const peer = peers.get(userId);

    if(!peer) return;

    try{

        await peer.setRemoteDescription(
            new RTCSessionDescription(message.answer)
        );

        await flushCandidates(userId,peer);

    }catch(error){
        console.error("Answer error",error);
    }
}

async function handleCandidate(message){

    const userId =
        message.fromId ||
        message.userId ||
        message.senderId;

    if(!userId || !message.candidate) return;

    const peer = peers.get(userId);

    if(!peer){
        if(!pendingCandidates.has(userId)){
            pendingCandidates.set(userId,[]);
        }

        pendingCandidates
            .get(userId)
            .push(message.candidate);

        return;
    }

    try{

        if(peer.remoteDescription){

            await peer.addIceCandidate(
                new RTCIceCandidate(message.candidate)
            );

        }else{

            if(!pendingCandidates.has(userId)){
                pendingCandidates.set(userId,[]);
            }

            pendingCandidates
                .get(userId)
                .push(message.candidate);
        }

    }catch(error){
        console.error("Candidate error",error);
    }
}

async function flushCandidates(userId,peer){

    const list =
        pendingCandidates.get(userId);

    if(!list) return;

    for(const candidate of list){

        try{

            await peer.addIceCandidate(
                new RTCIceCandidate(candidate)
            );

        }catch(error){
            console.error(error);
        }
    }

    pendingCandidates.delete(userId);
}

function closePeer(userId){

    const peer = peers.get(userId);

    if(peer){
        try{
            peer.close();
        }catch(e){}
    }

    peers.delete(userId);
    pendingCandidates.delete(userId);
}

function closeAllPeers(){

    peers.forEach(peer => {
        try{
            peer.close();
        }catch(e){}
    });

    peers.clear();
    pendingCandidates.clear();
}

function toggleMicro(){

    if(!localStream) return;

    const tracks =
        localStream.getAudioTracks();

    if(!tracks.length) return;

    microphoneEnabled =
        !microphoneEnabled;

    tracks.forEach(
        track => track.enabled = microphoneEnabled
    );

    send({
        type:"media-state",
        microphoneEnabled,
        cameraEnabled
    });

    updateControlButton();
}

function toggleCamera(){

    if(!localStream) return;

    const tracks =
        localStream.getVideoTracks();

    if(!tracks.length) return;

    cameraEnabled =
        !cameraEnabled;

    tracks.forEach(
        track => track.enabled = cameraEnabled
    );

    send({
        type:"media-state",
        microphoneEnabled,
        cameraEnabled
    });

    updateControlButton();
    updateLocalCameraDisplay();
}

function updateControlButton(){

    const microBtn =
        document.getElementById("microBtn");

    const cameraBtn =
        document.getElementById("cameraBtn");

    microBtn.classList.toggle(
        "active",
        microphoneEnabled
    );

    cameraBtn.classList.toggle(
        "active",
        cameraEnabled
    );
}

function handleRemoteMediaState(message){

    const userId =
        message.userId ||
        message.fromId ||
        message.senderId;

    if(!userId) return;

    updateRemoteCameraDisplay(
        userId,
        !!message.cameraEnabled
    );
}

function handleForceMediaState(message){

    if(!localStream) return;

    if(
        typeof message.microphoneEnabled === "boolean"
    ){
        microphoneEnabled =
            message.microphoneEnabled;

        localStream
            .getAudioTracks()
            .forEach(track =>
                track.enabled = microphoneEnabled
            );
    }

    if(
        typeof message.cameraEnabled === "boolean"
    ){
        cameraEnabled =
            message.cameraEnabled;

        localStream
            .getVideoTracks()
            .forEach(track =>
                track.enabled = cameraEnabled
            );
    }

    updateControlButton();
    updateLocalCameraDisplay();
}

function stopLocalMedia(){

    if(localStream){

        localStream.getTracks().forEach(
            track => track.stop()
        );

        localStream = null;
    }

    microphoneEnabled = false;
    cameraEnabled = false;

    updateControlButton();
}

function addChatMessage(message){

    const isRoomMessage =
        !!message.roomId;

    if(isRoomMessage){

        /*
           Les messages du salon ne provoquent PLUS
           de notification au milieu de l'écran.

           Si le chat est fermé et que le message vient
           d'un autre utilisateur, on incrémente le badge.
        */

        const isMine =
            currentUser &&
            message.userId === currentUser.id;

        const chatOpen =
            roomChat.classList.contains(
                "mobile-open"
            );

        appendChatMessage(
            document.getElementById(
                "roomChatMessages"
            ),
            message
        );

        if(
            !isMine &&
            !chatOpen &&
            currentRoom &&
            message.roomId === currentRoom.id
        ){
            roomUnreadCount++;
            updateRoomUnreadBadge();
        }

        return;
    }

    /*
       Discussion générale :
       on conserve l'affichage du message.
    */

    appendChatMessage(
        document.getElementById(
            "lobbyChatMessages"
        ),
        message
    );
}

function appendChatMessage(container,message){

    if(!container) return;

    const row =
        document.createElement("div");

    row.className = "chat-message";

    if(
        currentUser &&
        message.userId === currentUser.id
    ){
        row.classList.add("mine");
    }

    const author =
        document.createElement("div");

    author.className =
        "chat-message-author";

    author.textContent =
        message.username ||
        message.user?.username ||
        "Utilisateur";

    const body =
        document.createElement("div");

    body.className =
        "chat-message-body";

    body.textContent =
        message.text || "";

    row.appendChild(author);
    row.appendChild(body);

    container.appendChild(row);

    container.scrollTop =
        container.scrollHeight;
}

function updateRoomUnreadBadge(){

    const count =
        roomUnreadCount;

    const visible =
        count > 0;

    [roomChatUnread,roomChatUnreadMobile]
        .forEach(badge => {

            if(!badge) return;

            badge.textContent =
                count > 99
                    ? "99+"
                    : String(count);

            badge.classList.toggle(
                "visible",
                visible
            );
        });
}

function handleAvatarFile(event){

    const file = event.target.files && event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = () => {

        const img = new Image();

        img.onload = () => {

            const maxSize = 220;

            let width = img.width;
            let height = img.height;

            if(width > height){
                if(width > maxSize){
                    height = Math.round(height * (maxSize / width));
                    width = maxSize;
                }
            }else{
                if(height > maxSize){
                    width = Math.round(width * (maxSize / height));
                    height = maxSize;
                }
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img,0,0,width,height);

            const dataUrl = canvas.toDataURL("image/jpeg",0.82);

            pendingAvatarUrl = dataUrl;

            document.getElementById("profileAvatar").innerHTML =
                `<img src="${dataUrl}" alt="">`;
        };

        img.src = reader.result;
    };

    reader.readAsDataURL(file);

    event.target.value = "";
}

function saveProfile(){

    if(!currentUser) return;

    const description =
        document.getElementById(
            "profileDescriptionInput"
        ).value.trim();

    const payload = {
        type:"update-profile",
        description
    };

    if(pendingAvatarUrl !== undefined){
        payload.avatarUrl = pendingAvatarUrl;
    }

    send(payload);

    pendingAvatarUrl = undefined;

    closeProfile();
}

function renderAdmin(){

        );

    if(!list) return;

    list.innerHTML = "";

    if(currentAdminTab === "users"){

        if(!users.length){
            list.innerHTML =
                `<div style="color:var(--muted);">
                    Aucun utilisateur.
                </div>`;
            return;
        }

        users.forEach(user => {

            const item =
                document.createElement("div");

            item.className = "admin-item";

            const info =
                document.createElement("div");

            info.className = "admin-info";

            const name =
                document.createElement("div");

            name.className = "admin-name";

            name.textContent =
                user.username;

            const details =
                document.createElement("div");

            details.className =
                "admin-details";

            details.textContent =
                user.roomId
                    ? "Dans un salon"
                    : "Dans le lobby";

            info.appendChild(name);
            info.appendChild(details);

            const actions =
                document.createElement("div");

            actions.className =
                "admin-actions";

            if(
                currentUser &&
                user.id !== currentUser.id
            ){

                const mute =
                    document.createElement("button");

                mute.className =
                    "admin-action";

                mute.textContent =
                    "🔇 Mute";

                mute.onclick = () =>
                    adminMute(user.id);

                const camera =
                    document.createElement("button");

                camera.className =
                    "admin-action";

                camera.textContent =
                    "📷 Couper";

                camera.onclick = () =>
                    adminCamera(user.id);

                const kick =
                    document.createElement("button");

                kick.className =
                    "admin-action danger";

                kick.textContent =
                    "Expulser";

                kick.onclick = () =>
                    adminKick(user.id);

                actions.appendChild(mute);
                actions.appendChild(camera);
                actions.appendChild(kick);
            }

            item.appendChild(info);
            item.appendChild(actions);

            list.appendChild(item);
        });

    }else{

        if(!rooms.length){
            list.innerHTML =
                `<div style="color:var(--muted);">
                    Aucun salon.
                </div>`;
            return;
        }

        rooms.forEach(room => {

            const item =
                document.createElement("div");

            item.className = "admin-item";

            const info =
                document.createElement("div");

            info.className = "admin-info";

            const name =
                document.createElement("div");

            name.className =
                "admin-name";

            name.textContent =
                room.name;

            const details =
                document.createElement("div");

            details.className =
                "admin-details";

            details.textContent =
                `${room.userCount ?? 0} participant(s)`;

            info.appendChild(name);
            info.appendChild(details);

            const actions =
                document.createElement("div");

            actions.className =
                "admin-actions";

            if(!room.permanent){

                const del =
                    document.createElement("button");

                del.className =
                    "admin-action danger";

                del.textContent =
                    "Supprimer";

                del.onclick = () =>
                    adminDeleteRoom(room.id);

                actions.appendChild(del);
            }

            item.appendChild(info);
            item.appendChild(actions);

            list.appendChild(item);
        });
    }

        document.getElementById(
            "roomChatToggle"
        ).style.display = "none";
    }

    updateVideoGridLayout();
});

/* =========================

========================= */

restoreSession();
</script>
