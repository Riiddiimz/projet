<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Col'inCall</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="chat-ui.css">
</head><body>
<div id="authScreen" class="auth-screen"><div class="auth-card"><div class="auth-logo">Col'inCall</div><div class="auth-subtitle">Communication simple et instantanée</div><div class="auth-form"><input id="usernameInput" type="text" placeholder="Nom d'utilisateur" autocomplete="username"><input id="passwordInput" type="password" placeholder="Code" autocomplete="current-password"><button class="primary-btn" onclick="login()">Se connecter</button><div id="loginError" class="login-error"></div></div></div></div>
<div id="app" class="app" style="display:none;"><header class="topbar"><div class="brand"><div class="brand-title">Col'inCall</div><div class="brand-status">● Connecté</div></div><div class="top-actions"><button id="desktopGeneralChatButton" class="top-btn desktop-chat-button" onclick="toggleLobbyChat()">💬 Général</button><button id="desktopRoomChatButton" class="top-btn desktop-chat-button" onclick="toggleRoomChat()">💬 Chat <span id="desktopRoomChatUnread" class="chat-badge">0</span></button><button id="adminButton" class="top-btn" style="display:none;" onclick="openAdmin()">⚙️ Admin</button><button class="top-btn profile-top" onclick="openProfile()"><span id="topAvatar" class="avatar">?</span><span id="topUsername" class="profile-name">Profil</span></button></div></header>
<main id="lobbyScreen" class="lobby-screen"><aside class="users-sidebar"><div class="sidebar-title-row"><div class="sidebar-title">Utilisateurs</div><div id="onlineUsersCount" class="online-count">0</div></div><div id="onlineUsersList" class="online-users-list"></div></aside><section class="lobby-main"><div class="lobby-header"><div><h1>Salons</h1><p>Rejoignez une conversation</p></div><button class="primary-btn create-room-btn" onclick="createRoom()">＋ Créer un salon</button></div><div class="room-toolbar"><input id="roomSearch" class="room-search" type="text" placeholder="Rechercher un salon..."></div><div id="roomList" class="room-list"></div></section><aside id="lobbyChat" class="chat-sidebar"><div class="chat-header"><div><div class="chat-title">Général</div><div class="chat-subtitle">Discussion générale</div></div><button class="chat-close" onclick="closeGeneralChat()">×</button></div><div id="lobbyChatMessages" class="chat-messages"></div><div class="chat-input-area"><input id="lobbyChatInput" type="text" placeholder="Écrire un message..." autocomplete="off"><button class="chat-send" onclick="sendLobbyChat()">➤</button></div></aside></main>
<main id="roomScreen" class="room-screen" style="display:none;"><div class="room-header"><button class="back-btn" onclick="leaveCurrentRoom()">←</button><div class="room-header-info"><div id="roomName" class="room-title">Salon</div><div id="roomStatus" class="room-status">Vous êtes connecté</div></div></div><div id="videoGrid" class="video-grid"></div><div class="room-bottom-controls"><button id="roomChatMobileButton" class="media-btn room-chat-control" onclick="toggleRoomChat()">💬</button><button id="microBtn" class="media-btn" onclick="toggleMicro()" title="Microphone">🎙️</button><button id="cameraBtn" class="media-btn" onclick="toggleCamera()" title="Caméra">📷</button><button class="leave-btn" onclick="leaveCurrentRoom()" title="Quitter le salon">☎</button></div><aside id="roomChat" class="chat-sidebar room-chat"><div class="chat-header room-chat-header"><div><div class="chat-title">Chat du salon</div><div class="chat-subtitle">Discussion du salon</div></div><div class="room-chat-actions"><button id="roomUsersToggle" class="room-users-toggle" onclick="toggleRoomUsers()">👥</button><button class="chat-close" onclick="closeRoomChat()">×</button></div></div><div id="roomUsersMenu" class="room-users-menu" aria-hidden="true"><div class="room-users-menu-header"><span>Utilisateurs du salon</span><span id="roomUsersCount" class="room-users-count">0</span></div><div id="roomUsersList" class="room-users-list"></div></div><div id="roomChatMessages" class="chat-messages"></div><div class="chat-input-area"><input id="roomChatInput" type="text" placeholder="Écrire un message..." autocomplete="off"><button class="chat-send" onclick="sendRoomChat()">➤</button></div></aside></main>
<button id="usersSidebarToggle" class="users-sidebar-toggle" onclick="toggleUsersSidebar()">‹ Utilisateurs</button><button id="generalChatToggle" class="general-chat-toggle" onclick="toggleLobbyChat()">💬 Général</button><div id="mobileChatBackdrop" class="mobile-chat-backdrop" onclick="closeMobileChat()"></div>
<div id="profileModal" class="modal"></div><div id="userProfileModal" class="modal"></div><div id="adminModal" class="modal"></div></div>
<script src="chat.js"></script><script src="room.js"></script><script src="room-users.js"></script><script src="profile.js"></script><script src="admin.js"></script><script src="app.js"></script><script src="mobile-fixes.js"></script>
</body></html>
