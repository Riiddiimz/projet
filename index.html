<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Col'inCall</title>

<style>
:root{
    --bg:#080a10;
    --panel:#111521;
    --panel2:#181d2a;
    --border:#293143;
    --text:#f4f7fb;
    --muted:#8993a7;
    --accent:#6c63ff;
    --danger:#e5484d;
    --success:#28c76f;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* =========================
   AUTH
========================= */

.auth-screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at top,#171b2c 0,#080a10 55%);
}

.auth-box{
    width:420px;
    max-width:92%;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:35px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.logo{
    font-size:28px;
    font-weight:800;
    text-align:center;
    margin-bottom:8px;
}

.logo span{
    color:var(--accent);
}

.subtitle{
    text-align:center;
    color:var(--muted);
    margin-bottom:30px;
}

.role-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.role-btn{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    padding:15px;
    border-radius:12px;
    transition:.2s;
}

.role-btn:hover{
    border-color:var(--accent);
}

.role-btn.active{
    background:rgba(108,99,255,.15);
    border-color:var(--accent);
}

.input{
    width:100%;
    padding:13px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#0c0f17;
    color:var(--text);
    outline:none;
}

.input:focus{
    border-color:var(--accent);
}

.primary-btn{
    width:100%;
    border:0;
    border-radius:10px;
    padding:13px;
    background:var(--accent);
    color:white;
    font-weight:700;
    margin-top:15px;
}

.primary-btn:hover{
    filter:brightness(1.1);
}

.auth-message{
    margin-top:15px;
    text-align:center;
    color:var(--danger);
}

/* =========================
   APP
========================= */

.app{
    min-height:100vh;
}

.topbar{
    height:64px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
}

.topbar-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.topbar-logo{
    font-size:21px;
    font-weight:800;
}

.topbar-logo span{
    color:var(--accent);
}

.topbar-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.profile-button,
.admin-button{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    border-radius:9px;
    padding:9px 13px;
}

.admin-button{
    border-color:#735cff;
}

.avatar-small{
    width:32px;
    height:32px;
    border-radius:50%;
    background:var(--accent);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* =========================
   LOBBY
========================= */

.lobby{
    display:grid;
    grid-template-columns:1fr 340px;
    min-height:calc(100vh - 64px);
}

.lobby-main{
    padding:25px;
}

.lobby-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:22px;
}

.lobby-title h1{
    margin:0 0 5px;
    font-size:26px;
}

.lobby-title p{
    margin:0;
    color:var(--muted);
}

.lobby-actions{
    display:flex;
    gap:10px;
}

.search{
    width:230px;
    padding:11px 13px;
    border-radius:9px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    outline:none;
}

.create-btn{
    border:0;
    background:var(--accent);
    color:#fff;
    border-radius:9px;
    padding:11px 16px;
    font-weight:bold;
}

.rooms-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:15px;
}

.room-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:15px;
    padding:18px;
    transition:.2s;
}

.room-card:hover{
    transform:translateY(-2px);
    border-color:#454d61;
}

.room-name{
    font-weight:bold;
    font-size:18px;
    margin-bottom:7px;
}

.room-description{
    color:var(--muted);
    font-size:14px;
    min-height:40px;
}

.room-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:18px;
}

.room-count{
    color:var(--muted);
    font-size:13px;
}

.join-btn{
    border:0;
    background:var(--accent);
    color:#fff;
    border-radius:8px;
    padding:8px 13px;
}

/* =========================
   CHAT
========================= */

.chat-panel{
    border-left:1px solid var(--border);
    background:var(--panel);
    display:flex;
    flex-direction:column;
}

.chat-header{
    padding:17px;
    border-bottom:1px solid var(--border);
    font-weight:bold;
}

.chat-messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.chat-message{
    margin-bottom:14px;
}

.chat-author{
    font-size:12px;
    color:var(--accent);
    margin-bottom:3px;
    font-weight:bold;
}

.chat-text{
    background:var(--panel2);
    border-radius:10px;
    padding:9px 11px;
    display:inline-block;
    max-width:95%;
    word-break:break-word;
}

.chat-input-area{
    padding:12px;
    border-top:1px solid var(--border);
    display:flex;
    gap:8px;
}

.chat-input{
    flex:1;
    min-width:0;
    padding:11px;
    border-radius:9px;
    background:#0b0e15;
    border:1px solid var(--border);
    color:var(--text);
    outline:none;
}

.chat-send{
    width:42px;
    border:0;
    border-radius:9px;
    background:var(--accent);
    color:white;
}

/* =========================
   ROOM
========================= */

.room{
    min-height:calc(100vh - 64px);
    display:flex;
}

.room-main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.room-top{
    height:58px;
    padding:0 18px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.room-title{
    font-weight:bold;
}

.room-status{
    color:var(--muted);
    font-size:13px;
}

.video-grid{
    flex:1;
    padding:18px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
    align-content:start;
}

.video-card{
    position:relative;
    aspect-ratio:16/10;
    background:#05070b;
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
}

.video-card video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#05070b;
}

.video-avatar{
    position:absolute;
    inset:0;
    margin:auto;
    width:90px;
    height:90px;
    border-radius:50%;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:bold;
}

.camera-off{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:35px;
    opacity:.8;
}

.video-label{
    position:absolute;
    bottom:9px;
    left:9px;
    background:rgba(0,0,0,.65);
    border-radius:7px;
    padding:6px 9px;
    font-size:13px;
}

.controls{
    height:75px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
}

.control-btn{
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--panel2);
    color:white;
    font-size:19px;
}

.control-btn.active{
    background:var(--accent);
}

.control-btn.danger{
    background:var(--danger);
    border-color:var(--danger);
}

/* =========================
   ROOM CHAT
========================= */

.room-chat{
    width:320px;
    border-left:1px solid var(--border);
    background:var(--panel);
    display:flex;
    flex-direction:column;
}

/* =========================
   MODALS
========================= */

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
}

.modal{
    width:500px;
    max-width:92%;
    max-height:90vh;
    overflow:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
}

.modal h2{
    margin-top:0;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close-btn{
    background:none;
    border:0;
    color:var(--muted);
    font-size:22px;
}

.profile-avatar{
    width:90px;
    height:90px;
    margin:0 auto 18px;
    border-radius:50%;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:bold;
}

.profile-name{
    text-align:center;
    font-size:21px;
    font-weight:bold;
}

.profile-description{
    text-align:center;
    color:var(--muted);
    margin:8px 0 20px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    color:var(--muted);
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.modal-actions button{
    flex:1;
}

/* =========================
   ADMIN
========================= */

.admin-tabs{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.admin-tab{
    padding:9px 14px;
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
}

.admin-tab.active{
    border-color:var(--accent);
    background:rgba(108,99,255,.15);
}

.admin-item{
    padding:13px;
    border:1px solid var(--border);
    border-radius:10px;
    margin-bottom:9px;
    background:var(--panel2);
}

.admin-item-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.admin-item-name{
    font-weight:bold;
}

.admin-actions{
    display:flex;
    gap:6px;
    margin-top:10px;
}

.small-btn{
    border:1px solid var(--border);
    background:#10141d;
    color:white;
    padding:7px 10px;
    border-radius:7px;
}

.small-btn.danger{
    border-color:var(--danger);
    color:#ff8a8e;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .lobby{
        grid-template-columns:1fr;
    }

    .chat-panel{
        height:400px;
        border-left:0;
        border-top:1px solid var(--border);
    }

    .room{
        flex-direction:column;
    }

    .room-chat{
        width:100%;
        height:350px;
        border-left:0;
        border-top:1px solid var(--border);
    }

    .lobby-header{
        flex-direction:column;
        align-items:stretch;
    }

    .lobby-actions{
        flex-wrap:wrap;
    }

    .search{
        width:100%;
    }
}
</style>
</head>

<body>

<!-- =========================
     AUTH
========================= -->

<div id="authScreen" class="auth-screen">

    <div class="auth-box">

        <div class="logo">
            Col'in<span>Call</span>
        </div>

        <div class="subtitle">
            Discutez et échangez en vidéo
        </div>

        <div class="role-buttons">

            <button
                id="userRoleBtn"
                class="role-btn active"
                onclick="selectRole('user')">
                👤 Utilisateur
            </button>

            <button
                id="adminRoleBtn"
                class="role-btn"
                onclick="selectRole('admin')">
                🛠️ Administrateur
            </button>

        </div>

        <div style="margin-top:18px">

            <input
                id="loginInput"
                class="input"
                placeholder="Nom d'utilisateur">

            <input
                id="codeInput"
                class="input"
                style="margin-top:10px"
                placeholder="Code administrateur"
                type="password">

            <button
                class="primary-btn"
                onclick="login()">
                Se connecter
            </button>

            <div id="authMessage" class="auth-message"></div>

        </div>

    </div>

</div>


<!-- =========================
     APPLICATION
========================= -->

<div id="app" class="app hidden">

    <div class="topbar">

        <div class="topbar-left">

            <div class="topbar-logo">
                Col'in<span>Call</span>
            </div>

        </div>

        <div class="topbar-right">

            <button
                id="adminButton"
                class="admin-button hidden"
                onclick="openAdmin()">
                🛠️ Admin
            </button>

            <button
                class="profile-button"
                onclick="openMyProfile()">

                <span
                    id="topAvatar"
                    class="avatar-small">
                    ?
                </span>

                <span id="topUsername">
                    Profil
                </span>

            </button>

        </div>

    </div>


    <!-- =========================
         LOBBY
    ========================= -->

    <div id="lobbyScreen" class="lobby">

        <main class="lobby-main">

            <div class="lobby-header">

                <div class="lobby-title">

                    <h1>Salons disponibles</h1>

                    <p>
                        Rejoignez une discussion ou créez votre propre salon.
                    </p>

                </div>

                <div class="lobby-actions">

                    <input
                        id="roomSearch"
                        class="search"
                        placeholder="Rechercher un salon..."
                        oninput="renderRooms()">

                    <button
                        class="create-btn"
                        onclick="openCreateRoom()">
                        + Créer
                    </button>

                </div>

            </div>

            <div id="roomsGrid" class="rooms-grid"></div>

        </main>


        <!-- LOBBY CHAT -->

        <aside class="chat-panel">

            <div class="chat-header">
                💬 Discussion générale
            </div>

            <div
                id="lobbyChat"
                class="chat-messages">
            </div>

            <form
                class="chat-input-area"
                onsubmit="sendLobbyChat(event)">

                <input
                    id="lobbyChatInput"
                    class="chat-input"
                    placeholder="Écrire un message...">

                <button
                    class="chat-send"
                    type="submit">
                    ➤
                </button>

            </form>

        </aside>

    </div>


    <!-- =========================
         ROOM
    ========================= -->

    <div id="roomScreen" class="room hidden">

        <main class="room-main">

            <div class="room-top">

                <div>

                    <div
                        id="roomTitle"
                        class="room-title">
                        Salon
                    </div>

                    <div
                        id="roomStatus"
                        class="room-status">
                        0 participant
                    </div>

                </div>

            </div>


            <div
                id="videoGrid"
                class="video-grid">
            </div>


            <div class="controls">

                <button
                    id="microBtn"
                    class="control-btn"
                    onclick="toggleMicro()"
                    title="Microphone">
                    🎤
                </button>

                <button
                    id="cameraBtn"
                    class="control-btn"
                    onclick="toggleCamera()"
                    title="Caméra">
                    📹
                </button>

                <button
                    class="control-btn danger"
                    onclick="leaveCurrentRoom()"
                    title="Quitter le salon">
                    📞
                </button>

            </div>

        </main>


        <!-- ROOM CHAT -->

        <aside class="room-chat">

            <div class="chat-header">
                💬 Discussion du salon
            </div>

            <div
                id="roomChat"
                class="chat-messages">
            </div>

            <form
                class="chat-input-area"
                onsubmit="sendRoomChat(event)">

                <input
                    id="roomChatInput"
                    class="chat-input"
                    placeholder="Écrire un message...">

                <button
                    class="chat-send"
                    type="submit">
                    ➤
                </button>

            </form>

        </aside>

    </div>

</div>


<!-- =========================
     PROFILE MODAL
========================= -->

<div
    id="profileModal"
    class="modal-overlay hidden">

    <div class="modal">

        <div class="modal-header">

            <h2>Profil</h2>

            <button
                class="close-btn"
                onclick="closeModal('profileModal')">
                ×
            </button>

        </div>

        <div
            id="profileAvatar"
            class="profile-avatar">
            ?
        </div>

        <div
            id="profileName"
            class="profile-name">
            Utilisateur
        </div>

        <div
            id="profileDescription"
            class="profile-description">
        </div>

        <div id="myProfileForm">

            <div class="form-group">

                <label>
                    Nom
                </label>

                <input
                    id="profileNameInput"
                    class="input">

            </div>

            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    id="profileDescriptionInput"
                    class="input"
                    rows="4"></textarea>

            </div>

            <button
                class="primary-btn"
                onclick="saveProfile()">
                Enregistrer
            </button>

        </div>

        <div
            id="profileAdminActions"
            class="hidden"
            style="margin-top:20px">

            <h3>Modération</h3>

            <div class="modal-actions">

                <button
                    class="small-btn"
                    onclick="toggleViewedMute()">
                    🎤 Micro
                </button>

                <button
                    class="small-btn"
                    onclick="toggleViewedCamera()">
                    📹 Caméra
                </button>

                <button
                    class="small-btn danger"
                    onclick="kickViewedUser()">
                    Expulser
                </button>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     CREATE ROOM
========================= -->

<div
    id="createRoomModal"
    class="modal-overlay hidden">

    <div class="modal">

        <div class="modal-header">

            <h2>Créer un salon</h2>

            <button
                class="close-btn"
                onclick="closeModal('createRoomModal')">
                ×
            </button>

        </div>

        <div class="form-group">

            <label>
                Nom du salon
            </label>

            <input
                id="newRoomName"
                class="input"
                placeholder="Ex : Discussion gaming">

        </div>

        <div class="form-group">

            <label>
                Description
            </label>

            <textarea
                id="newRoomDescription"
                class="input"
                rows="3"
                placeholder="Décrivez votre salon..."></textarea>

        </div>

        <button
            class="primary-btn"
            onclick="createRoom()">
            Créer le salon
        </button>

    </div>

</div>


<!-- =========================
     ADMIN
========================= -->

<div
    id="adminModal"
    class="modal-overlay hidden">

    <div class="modal">

        <div class="modal-header">

            <h2>Administration</h2>

            <button
                class="close-btn"
                onclick="closeModal('adminModal')">
                ×
            </button>

        </div>

        <div class="admin-tabs">

            <button
                id="adminUsersTab"
                class="admin-tab active"
                onclick="setAdminTab('users')">
                👥 Utilisateurs
            </button>

            <button
                id="adminRoomsTab"
                class="admin-tab"
                onclick="setAdminTab('rooms')">
                🏠 Salons
            </button>

        </div>

        <div id="adminContent"></div>

    </div>

</div>


<script>

/* =========================
   CONFIG
========================= */

const SERVER_URL =
    "wss://projet-nz7b.onrender.com";


/* =========================
   GLOBALS
========================= */

let socket = null;

let selectedRole = "user";

let currentUser = null;

let rooms = [];

let allUsers = [];

let currentRoom = null;

let localStream = null;

let microphoneEnabled = false;

let cameraEnabled = false;

let peerConnections = new Map();

let pendingIceCandidates = new Map();

let viewedUser = null;

let adminTab = "users";


/* =========================
   AUTH
========================= */

function selectRole(role){

    selectedRole = role;

    document
        .getElementById("userRoleBtn")
        .classList.toggle(
            "active",
            role === "user"
        );

    document
        .getElementById("adminRoleBtn")
        .classList.toggle(
            "active",
            role === "admin"
        );

    document
        .getElementById("codeInput")
        .classList.toggle(
            "hidden",
            role !== "admin"
        );

    document
        .getElementById("loginInput")
        .placeholder =
            role === "admin"
                ? "Nom administrateur"
                : "Nom d'utilisateur";
}

selectRole("user");


function login(){

    const username =
        document
            .getElementById("loginInput")
            .value
            .trim();

    const code =
        document
            .getElementById("codeInput")
            .value
            .trim();

    const message =
        document.getElementById("authMessage");

    if(!username){

        message.textContent =
            "Indique un nom d'utilisateur.";

        return;
    }

    if(selectedRole === "admin" && !code){

        message.textContent =
            "Indique le code administrateur.";

        return;
    }

    connectSocket();

    socket.addEventListener(
        "open",
        function onOpen(){

            socket.removeEventListener(
                "open",
                onOpen
            );

            send({
                type:"login",
                username,
                role:selectedRole,
                code
            });
        }
    );

    socket.addEventListener(
        "error",
        function(){

            message.textContent =
                "Impossible de contacter le serveur.";
        }
    );
}


/* =========================
   SOCKET
========================= */

function connectSocket(){

    if(socket &&
       (socket.readyState === WebSocket.OPEN ||
        socket.readyState === WebSocket.CONNECTING)){

        return;
    }

    socket =
        new WebSocket(SERVER_URL);

    socket.onmessage =
        handleMessage;

    socket.onclose =
        function(){

            console.log(
                "Connexion serveur fermée"
            );
        };
}


function send(data){

    if(
        socket &&
        socket.readyState === WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify(data)
        );
    }
}


/* =========================
   SERVER MESSAGES
========================= */

function handleMessage(event){

    let message;

    try{

        message =
            JSON.parse(event.data);

    }catch(error){

        console.error(
            "Message invalide",
            event.data
        );

        return;
    }


    switch(message.type){

        case "login-success":
            handleLoginSuccess(message);
            break;

        case "login-error":
            document
                .getElementById("authMessage")
                .textContent =
                    message.message ||
                    "Erreur de connexion.";
            break;

        case "rooms-list":
            rooms =
                message.rooms || [];
            renderRooms();
            break;

        case "users-list":
            allUsers =
                message.users || [];
            renderAdmin();
            break;

        case "user-updated":
            updateUserInLists(
                message.user
            );
            break;

        case "room-created":
            break;

        case "room-joined":
            handleRoomJoined(message);
            break;

        case "room-left":
            handleRoomLeft();
            break;

        case "user-joined":
            handleUserJoined(
                message.user
            );
            break;

        case "user-left":
            handleUserLeft(
                message.userId
            );
            break;

        case "chat-message":
            addChatMessage(message);
            break;

        case "offer":
            receiveOffer(message);
            break;

        case "answer":
            receiveAnswer(message);
            break;

        case "ice-candidate":
            receiveCandidate(message);
            break;

        case "media-state":
            handleRemoteMediaState(message);
            break;

        case "admin-action":
            alert(
                message.message ||
                "Action effectuée."
            );
            break;

        case "kicked":

            alert(
                message.message ||
                "Vous avez été expulsé."
            );

            if(currentRoom){

                closePeerConnections();
                stopLocalMedia();

                currentRoom = null;

                showLobby();
            }

            break;

        case "error":
            alert(
                message.message ||
                "Une erreur est survenue."
            );
            break;
    }
}

========================= */

async function prepareLocalMedia(){

    if(localStream)
        return;

    localStream =
        await navigator.mediaDevices.getUserMedia({
            video:true,
            audio:true
        });

    const videoTrack =
        localStream.getVideoTracks()[0];

    const audioTrack =
        localStream.getAudioTracks()[0];

/* =========================
   WEBRTC
========================= */

async function createConnectionToUser(
    user,
    createOffer
){

    if(!user)
        return null;

    let pc =
        peerConnections.get(user.id);

    if(pc)
        return pc;


    pc =
        new RTCPeerConnection({

            iceServers:[
                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }
            ]

        });


    peerConnections.set(
        user.id,
        pc
    );


    if(localStream){

        localStream
            .getTracks()
            .forEach(track => {

                pc.addTrack(
                    track,
                    localStream
                );

            });
    }


    pc.onicecandidate =
        event => {

            if(
                event.candidate
            ){

                send({

                    type:"ice-candidate",

                    target:user.id,

                    candidate:
                        event.candidate
                });
            }
        };


    pc.ontrack =
        event => {

            const card =
                document.getElementById(
                    "video-" + user.id
                );

            if(!card)
                return;

            const video =
                card.querySelector(
                    "video"
                );

            if(!video)
                return;

            if(
                event.streams &&
                event.streams[0]
            ){

                video.srcObject =
                    event.streams[0];

            }
        };


    pc.onconnectionstatechange =
        () => {

            console.log(
                "WebRTC",
                user.username,
                pc.connectionState
            );

            if(
                pc.connectionState ===
                    "failed" ||

                pc.connectionState ===
                    "closed"
            ){

                removeVideoUser(
                    user.id
                );
            }
        };


    if(createOffer){

        try{

            const offer =
                await pc.createOffer();

            await pc.setLocalDescription(
                offer
            );

            send({

                type:"offer",

                target:user.id,

                offer
            });

        }catch(error){

            console.error(
                "Offer error:",
                error
            );
        }
    }


    return pc;
}


/* =========================
   RECEIVE OFFER
========================= */

async function receiveOffer(message){

    if(!message.from)
        return;


    const user =
        allUsers.find(
            u => u.id === message.from
        ) || {

            id:message.from,
            username:"Utilisateur"
        };


    addVideoUser(user);


    let pc =
        peerConnections.get(
            message.from
        );


    if(!pc){

        pc =
            await createConnectionToUser(
                user,
                false
            );
    }


    try{

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                message.offer
            )
        );


        await flushIceCandidates(
            message.from,
            pc
        );


        const answer =
            await pc.createAnswer();

        await pc.setLocalDescription(
            answer
        );


        send({

            type:"answer",

            target:message.from,

            answer
        });

    }catch(error){

        console.error(
            "Offer receive error:",
            error
        );
    }
}


/* =========================
   RECEIVE ANSWER
========================= */

async function receiveAnswer(message){

    const pc =
        peerConnections.get(
            message.from
        );

    if(!pc)
        return;


    try{

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                message.answer
            )
        );


        await flushIceCandidates(
            message.from,
            pc
        );

    }catch(error){

        console.error(
            "Answer error:",
            error
        );
    }
}


/* =========================
   ICE
========================= */

async function receiveCandidate(message){

    if(!message.from ||
       !message.candidate)
        return;


    const pc =
        peerConnections.get(
            message.from
        );


    if(
        !pc ||
        !pc.remoteDescription
    ){

        if(
            !pendingIceCandidates.has(
                message.from
            )
        ){

            pendingIceCandidates.set(
                message.from,
                []
            );
        }

        pendingIceCandidates
            .get(message.from)
            .push(message.candidate);

        return;
    }


    try{

        await pc.addIceCandidate(
            new RTCIceCandidate(
                message.candidate
            )
        );

    }catch(error){

        console.error(
            "ICE error:",
            error
        );
    }
}


async function flushIceCandidates(
    userId,
    pc
){

    const candidates =
        pendingIceCandidates.get(
            userId
        );

    if(!candidates)
        return;


    for(const candidate of candidates){

        try{

            await pc.addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

        }catch(error){

            console.error(
                "Queued ICE error:",
                error
            );
        }
    }


    pendingIceCandidates.delete(
        userId
    );
}

    const tracks =
        localStream.getAudioTracks();

    if(tracks.length === 0)
        return;

    microphoneEnabled =
        !microphoneEnabled;

    tracks.forEach(

        }
    );


    updateControlButton(
        "microBtn",
        microphoneEnabled
    );


    send({

        type:"media-state",

        microphoneEnabled,

        cameraEnabled
    });
}


function toggleCamera(){

    if(!localStream)
        return;

    const tracks =
        localStream.getVideoTracks();

    if(tracks.length === 0)
        return;

    cameraEnabled =
        !cameraEnabled;

    tracks.forEach(
        track => {
            track.enabled =
                cameraEnabled;
        }
    );


    updateControlButton(
        "cameraBtn",
        cameraEnabled
    );


    const localCamera =
        document.getElementById(
            "localCameraOff"
        );

    if(localCamera){

        localCamera.style.display =
            cameraEnabled
                ? "none"
                : "block";
    }


    send({

        type:"media-state",

        microphoneEnabled,

        cameraEnabled
    });
}

   LEAVE ROOM
========================= */

function leaveCurrentRoom(){

    if(!currentRoom)
        return;


    const confirmed =
        confirm(
            `Voulez-vous vraiment quitter le salon "${currentRoom.name}" ?`
        );


    if(!confirmed)
        return;


    send({
        type:"leave-room"
    });


    closePeerConnections();

    stopLocalMedia();


    currentRoom = null;


    showLobby();
}


function handleRoomLeft(){

    closePeerConnections();

    stopLocalMedia();

    currentRoom = null;

    showLobby();
}


function closePeerConnections(){

    peerConnections.forEach(
        pc => {

            try{
                pc.close();
            }catch(error){}

        }
    );

    peerConnections.clear();

    pendingIceCandidates.clear();
}


function stopLocalMedia(){

    if(!localStream)
        return;


    localStream
        .getTracks()
        .forEach(
            track => track.stop()
        );


    localStream = null;

    cameraEnabled = false;

    microphoneEnabled = false;


    updateControlButton(
        "cameraBtn",
        false
    );

    updateControlButton(
        "microBtn",
        false
    );
}

function updateUserInLists(updatedUser){

    if(!updatedUser)
        return;


    const index =
        allUsers.findIndex(
            user =>
                user.id ===
                updatedUser.id
        );


    if(index >= 0){

        allUsers[index] =
            updatedUser;

    }else{

        allUsers.push(
            updatedUser
        );
    }


    if(
        currentUser &&
        updatedUser.id ===
            currentUser.id
    ){

        currentUser =
            updatedUser;


        document
            .getElementById(
                "topUsername"
            )
            .textContent =
                currentUser.username;


        updateAvatar(
            document.getElementById(
                "topAvatar"
            ),
            currentUser
        );


        if(
            !document
                .getElementById(
                    "profileModal"
                )
                .classList.contains(
                    "hidden"
                )
        ){

            renderProfile(
                currentUser
            );
        }
    }


    renderAdmin();
}

    if(!content)
        return;


    if(adminTab === "users"){

        content.innerHTML = "";


        allUsers.forEach(user => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "admin-item";


            item.innerHTML = `

                <div class="admin-item-header">

                    <div class="admin-item-name">
                        ${escapeHtml(
                            user.username
                        )}
                    </div>

                    <div style="color:var(--muted);font-size:12px">
                        ${user.roomId
                            ? "En salon"
                            : "Lobby"}
                    </div>

                </div>

                <div class="admin-actions">

                    <button
                        class="small-btn"
                        onclick="openUserProfile('${user.id}')">
                        Profil
                    </button>

                    <button
                        class="small-btn"
                        onclick="adminMute('${user.id}')">
                        🎤 Mute
                    </button>

                    <button
                        class="small-btn"
                        onclick="adminCamera('${user.id}')">
                        📹 Caméra
                    </button>

                    <button
                        class="small-btn danger"
                        onclick="adminKick('${user.id}')">
                        Expulser
                    </button>

                </div>
            `;


            content.appendChild(
                item
            );
        });


        if(allUsers.length === 0){

            content.innerHTML =
                `<div style="color:var(--muted)">
                    Aucun utilisateur.
                </div>`;
        }


        return;
    }


    if(adminTab === "rooms"){

        content.innerHTML = "";


        rooms.forEach(room => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "admin-item";


            item.innerHTML = `

                <div class="admin-item-header">

                    <div class="admin-item-name">
                        ${escapeHtml(
                            room.name
                        )}
                    </div>

                    <div style="color:var(--muted);font-size:12px">
                        👥 ${room.count || 0}
                    </div>

                </div>

                <div style="color:var(--muted);margin-top:6px">
                    ${escapeHtml(
                        room.description || ""
                    )}
                </div>

                <div class="admin-actions">

                    <button
                        class="small-btn danger"
                        onclick="adminDeleteRoom('${room.id}')">
                        🗑️ Supprimer
                    </button>

                </div>
            `;


            content.appendChild(
                item
            );
        });


        if(rooms.length === 0){

            content.innerHTML =
                `<div style="color:var(--muted)">
                    Aucun salon.
                </div>`;
        }
    }
}


function adminMute(userId){

    send({

        type:"admin-mute",

        userId
    });
}


function adminCamera(userId){

    send({

        type:"admin-camera",

        userId
    });
}


function adminKick(userId){

    if(
        !confirm(
            "Expulser cet utilisateur ?"
        )
    )
        return;


    send({

        type:"admin-kick",

        userId
    });
}


function adminDeleteRoom(roomId){

    if(
        !confirm(
            "Supprimer définitivement ce salon ?"
        )
    )
        return;


    send({

        type:"admin-delete-room",

        roomId
    });
}


function toggleViewedMute(){

    if(!viewedUser)
        return;

    adminMute(
        viewedUser.id
    );
}


function toggleViewedCamera(){

    if(!viewedUser)
        return;

    adminCamera(
        viewedUser.id
    );
}


function kickViewedUser(){

    if(!viewedUser)
        return;

    adminKick(
        viewedUser.id
    );
}


/* =========================
   MODAL
========================= */

function closeModal(id){

    document
        .getElementById(id)
        .classList.add(
            "hidden"
        );
}


/* =========================
   UTIL
========================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            document
                .querySelectorAll(
                    ".modal-overlay"
                )
                .forEach(
                    modal =>
                        modal.classList.add(
                            "hidden"
                        )
                );
        }
    }
);

</script>

</body>
</html>
