<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Col'inCall</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #08090d;
  --surface: #101219;
  --surface-2: #151720;
  --surface-3: #1b1e28;

  --border: rgba(255,255,255,.08);

  --text: #ffffff;
  --muted: #8d93a3;

  --accent: #765cff;
  --accent-light: #907aff;

  --green: #35e58a;
  --red: #ff4f6d;

  --shadow:
    0 20px 70px rgba(0,0,0,.35);
}

/* =========================================================
   BODY
========================================================= */

html,
body {
  width: 100%;
  height: 100%;
}

body {
  overflow: hidden;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(118,92,255,.13),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(0,212,255,.07),
      transparent 30%
    ),
    var(--bg);

  color: var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

/* =========================================================
   APP
========================================================= */

.app {
  width: 100%;
  height: 100dvh;

  display: grid;

  grid-template-columns:
    minmax(0, 1fr)
    350px;
}

/* =========================================================
   MAIN
========================================================= */

.main {
  min-width: 0;
  min-height: 0;

  display: flex;
  flex-direction: column;
}

/* =========================================================
   HEADER
========================================================= */

.header {
  height: 70px;
  min-height: 70px;

  padding: 0 22px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-bottom:
    1px solid var(--border);

  background:
    rgba(8,9,13,.72);

  backdrop-filter:
    blur(25px);

  position: relative;
  z-index: 10;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;

  font-size: 19px;
  font-weight: 800;

  letter-spacing: -.6px;
}

.logo-mark {
  width: 12px;
  height: 12px;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      #765cff,
      #00d4ff
    );

  box-shadow:
    0 0 20px rgba(118,92,255,.8);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.room-badge {
  padding: 8px 12px;

  border-radius: 10px;

  border:
    1px solid var(--border);

  background:
    rgba(255,255,255,.04);

  color: var(--muted);

  font-size: 12px;
}

.people {
  display: flex;
  align-items: center;
  gap: 7px;

  color: var(--muted);

  font-size: 12px;
}

.online-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: var(--green);

  box-shadow:
    0 0 12px var(--green);
}

/* =========================================================
   VIDEO AREA
========================================================= */

.video-area {
  flex: 1;

  min-width: 0;
  min-height: 0;

  position: relative;

  padding: 14px;
}

/*
   IMPORTANT :
   Les contrôles sont maintenant positionnés
   indépendamment de la grille vidéo.
*/

.video-grid {
  width: 100%;
  height: 100%;

  display: grid;

  gap: 12px;

  overflow-y: auto;

  padding-bottom: 78px;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(
        260px,
        1fr
      )
    );

  grid-auto-rows:
    minmax(
      180px,
      1fr
    );

  align-content: center;
}

/* =========================================================
   VIDEO CARD
========================================================= */

.video-card {

  position: relative;

  min-width: 0;
  min-height: 180px;

  overflow: hidden;

  border-radius: 19px;

  background:
    radial-gradient(
      circle at center,
      rgba(118,92,255,.09),
      transparent 55%
    ),
    #12141b;

  border:
    1px solid var(--border);

  box-shadow:
    0 15px 45px rgba(0,0,0,.25);

  animation:
    cardIn .35s ease both;
}

@keyframes cardIn {

  from {
    opacity: 0;
    transform: scale(.97);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }

}

.video-card video {

  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;
}

.video-card.local video {
  transform: scaleX(-1);
}

/* =========================================================
   USER LABEL
========================================================= */

.user-label {

  position: absolute;

  left: 11px;
  bottom: 11px;

  display: flex;
  align-items: center;

  gap: 7px;

  padding: 7px 10px;

  border-radius: 10px;

  background:
    rgba(0,0,0,.52);

  backdrop-filter:
    blur(15px);

  border:
    1px solid rgba(255,255,255,.08);

  font-size: 11px;

  z-index: 3;
}

.user-avatar {

  width: 22px;
  height: 22px;

  display: grid;
  place-items: center;

  border-radius: 50%;

  background:
    linear-gradient(
      135deg,
      #765cff,
      #00c8ff
    );

  font-size: 10px;
  font-weight: 800;
}

.mic-indicator {
  opacity: .8;
}

/* =========================================================
   EMPTY / AVATAR
========================================================= */

.video-avatar {

  position: absolute;

  inset: 0;

  display: grid;
  place-items: center;

  pointer-events: none;
}

.avatar-large {

  width: 80px;
  height: 80px;

  border-radius: 50%;

  display: grid;
  place-items: center;

  background:
    linear-gradient(
      135deg,
      rgba(118,92,255,.85),
      rgba(0,212,255,.75)
    );

  font-size: 28px;
  font-weight: 800;

  box-shadow:
    0 0 70px
    rgba(118,92,255,.22);
}

/* =========================================================
   CONTROLS
========================================================= */

.controls {

  position: absolute;

  left: 50%;
  bottom: 16px;

  transform:
    translateX(-50%);

  z-index: 20;

  display: flex;
  align-items: center;

  gap: 9px;

  padding: 8px 9px;

  border-radius: 18px;

  background:
    rgba(12,13,18,.82);

  border:
    1px solid
    rgba(255,255,255,.10);

  backdrop-filter:
    blur(25px);

  box-shadow:
    0 15px 50px
    rgba(0,0,0,.45);
}

.control {

  width: 46px;
  height: 46px;

  display: grid;
  place-items: center;

  border-radius: 13px;

  border:
    1px solid
    rgba(255,255,255,.08);

  background:
    rgba(255,255,255,.055);

  color: white;

  font-size: 17px;

  transition:
    transform .18s ease,
    background .18s ease;
}

.control:hover {

  transform:
    translateY(-2px);

  background:
    rgba(255,255,255,.12);
}

.control.off {

  background:
    rgba(255,79,109,.16);

  color:
    #ff7188;
}

.leave {

  height: 46px;

  padding:
    0 19px;

  margin-left: 4px;

  border-radius: 13px;

  border: 0;

  background:
    var(--red);

  color: white;

  font-size: 12px;

  font-weight: 750;

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.leave:hover {

  transform:
    translateY(-2px);

  box-shadow:
    0 10px 30px
    rgba(255,79,109,.25);
}

/* =========================================================
   CHAT
========================================================= */

.chat {

  min-width: 0;
  min-height: 0;

  display: flex;
  flex-direction: column;

  background:
    rgba(13,15,20,.96);

  border-left:
    1px solid var(--border);
}

/* =========================================================
   CHAT HEADER
========================================================= */

.chat-header {

  height: 70px;
  min-height: 70px;

  padding:
    0 18px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border-bottom:
    1px solid var(--border);
}

.chat-title {

  font-size: 14px;
  font-weight: 750;
}

.chat-subtitle {

  margin-top: 3px;

  color:
    var(--muted);

  font-size: 10px;
}

.chat-status {

  width: 8px;
  height: 8px;

  border-radius: 50%;

  background:
    var(--green);

  box-shadow:
    0 0 12px var(--green);
}

/* =========================================================
   MESSAGES
========================================================= */

.messages {

  flex: 1;

  min-height: 0;

  overflow-y: auto;

  padding:
    17px;

  display: flex;
  flex-direction: column;

  gap: 12px;
}

.empty-chat {

  flex: 1;

  display: flex;

  align-items: center;
  justify-content: center;

  text-align: center;

  color:
    var(--muted);

  font-size: 12px;

  padding:
    30px;
}

.message {

  max-width: 82%;

  display: flex;
  flex-direction: column;

  gap: 4px;

  animation:
    messageIn .25s ease both;
}

@keyframes messageIn {

  from {
    opacity: 0;
    transform:
      translateY(5px);
  }

  to {
    opacity: 1;
    transform:
      translateY(0);
  }

}

.message.mine {

  align-self: flex-end;

  align-items: flex-end;
}

.message-name {

  color:
    var(--muted);

  font-size: 9px;

  padding:
    0 4px;
}

.message-bubble {

  padding:
    10px 12px;

  border-radius:
    13px;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid
    rgba(255,255,255,.045);

  color:
    #e9eaf0;

  font-size: 12px;

  line-height: 1.45;

  overflow-wrap: anywhere;
}

.message.mine
.message-bubble {

  background:
    linear-gradient(
      135deg,
      #765cff,
      #6248e3
    );

  color: white;

  border: 0;
}

/* =========================================================
   CHAT INPUT
========================================================= */

.chat-input {

  padding:
    12px;

  border-top:
    1px solid var(--border);

  display: flex;

  gap: 8px;
}

.chat-input input {

  flex: 1;

  min-width: 0;

  height: 43px;

  border-radius:
    12px;

  border:
    1px solid var(--border);

  outline: none;

  background:
    rgba(255,255,255,.045);

  color:
    white;

  padding:
    0 12px;

  font-size: 12px;

  transition:
    border .2s ease;
}

.chat-input input:focus {

  border-color:
    rgba(118,92,255,.55);
}

.chat-input button {

  width: 43px;

  border-radius:
    12px;

  border: 0;

  background:
    var(--accent);

  color:
    white;

  font-size: 18px;
}

/* =========================================================
   MOBILE CHAT BUTTON
========================================================= */

.mobile-chat-button {

  display: none;

  position: absolute;

  right: 14px;
  top: 14px;

  z-index: 30;

  width: 47px;
  height: 47px;

  border-radius:
    14px;

  background:
    rgba(12,13,18,.78);

  color:
    white;

  border:
    1px solid var(--border);

  backdrop-filter:
    blur(20px);

  box-shadow:
    var(--shadow);
}

/* =========================================================
   NOTIFICATION BADGE
========================================================= */

.unread-badge {

  position: absolute;

  top: -5px;
  right: -5px;

  min-width: 19px;
  height: 19px;

  padding:
    0 5px;

  display: none;

  align-items: center;
  justify-content: center;

  border-radius: 999px;

  background:
    var(--red);

  color:
    white;

  border:
    2px solid var(--bg);

  font-size: 9px;
  font-weight: 800;

  box-shadow:
    0 4px 15px
    rgba(255,79,109,.4);

  animation:
    notificationPop .25s ease;
}

.unread-badge.visible {
  display: flex;
}

@keyframes notificationPop {

  0% {
    transform: scale(.5);
  }

  70% {
    transform: scale(1.15);
  }

  100% {
    transform: scale(1);
  }

}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 850px) {

  .app {

    display: block;

    position: relative;

  }

  .main {

    width: 100%;
    height: 100%;
  }

  .header {

    height: 60px;
    min-height: 60px;

    padding:
      0 14px;
  }

  .room-badge {
    display: none;
  }

  .video-area {

    padding:
      8px;
  }

  .video-grid {

    gap: 8px;

    padding-bottom:
      70px;

    grid-template-columns:
      repeat(
        2,
        minmax(0, 1fr)
      );

    grid-auto-rows:
      minmax(
        150px,
        1fr
      );
  }

  .video-card {

    min-height:
      150px;

    border-radius:
      15px;
  }

  .controls {

    bottom:
      10px;

    gap:
      7px;

    padding:
      7px;

    width:
      auto;

    max-width:
      calc(100% - 20px);
  }

  .control {

    width:
      44px;

    height:
      44px;
  }

  .leave {

    height:
      44px;

    padding:
      0 15px;
  }

  .mobile-chat-button {

    display:
      grid;

    place-items:
      center;
  }

  .chat {

    position:
      fixed;

    z-index:
      100;

    right:
      10px;

    bottom:
      10px;

    top:
      70px;

    left:
      10px;

    border:
      1px solid
      rgba(255,255,255,.10);

    border-radius:
      20px;

    transform:
      translateY(
        calc(100% + 30px)
      );

    transition:
      transform .3s ease;

    box-shadow:
      0 30px 100px
      rgba(0,0,0,.65);
  }

  .chat.open {

    transform:
      translateY(0);
  }

  .chat-header {

    border-radius:
      20px 20px 0 0;
  }

}

/* =========================================================
   SMALL MOBILE
========================================================= */

@media (max-width: 480px) {

  .video-grid {

    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );

  }

  .user-label {

    left:
      7px;

    bottom:
      7px;

    padding:
      5px 7px;

    font-size:
      9px;
  }

  .user-avatar {

    width:
      18px;

    height:
      18px;

    font-size:
      8px;
  }

  .controls {

    width:
      calc(100% - 20px);

    justify-content:
      center;
  }

  .control {

    flex:
      0 0 43px;
  }

  .leave {

    flex:
      1;

    max-width:
      110px;
  }

}

</style>

</head>

<body>

<div class="app">

  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="main">

    <header class="header">

      <div class="logo">

        <span class="logo-mark"></span>

        Col'inCall

      </div>

      <div class="header-right">

        <div class="room-badge">
          Salon général
        </div>

        <div class="people">

          <span class="online-dot"></span>

          <span id="peopleCount">
            0 personne
          </span>

        </div>

      </div>

    </header>

    <section class="video-area">

      <div
        class="video-grid"
        id="videoGrid"
      ></div>

      <!-- CHAT MOBILE -->

      <button
        class="mobile-chat-button"
        id="mobileChatButton"
        aria-label="Ouvrir le chat"
      >

        💬

        <span
          class="unread-badge"
          id="unreadBadge"
        >
          0
        </span>

      </button>

      <!-- CONTROLS -->

      <div class="controls">

        <button
          class="control"
          id="micButton"
          title="Microphone"
        >
          🎙️
        </button>

        <button
          class="control"
          id="cameraButton"
          title="Caméra"
        >
          📷
        </button>

        <button
          class="leave"
          id="leaveButton"
        >
          Quitter
        </button>

      </div>

    </section>

  </main>

  <!-- =====================================================
       CHAT
  ====================================================== -->

  <aside
    class="chat"
    id="chat"
  >

    <header class="chat-header">

      <div>

        <div class="chat-title">
          Discussion
        </div>

        <div class="chat-subtitle">
          Messages du salon
        </div>

      </div>

      <span class="chat-status"></span>

    </header>

    <div
      class="messages"
      id="messages"
    >

      <div
        class="empty-chat"
        id="emptyChat"
      >
        Les messages de la conversation
        apparaîtront ici.
      </div>

    </div>

    <form
      class="chat-input"
      id="chatForm"
    >

      <input
        id="messageInput"
        type="text"
        placeholder="Écrire un message..."
        autocomplete="off"
        maxlength="500"
      >

      <button
        type="submit"
        aria-label="Envoyer"
      >
        ↑
      </button>

    </form>

  </aside>

</div>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const SERVER_URL =
  "wss://projet-nz7b.onrender.com";

const ROOM_ID =
  "general";

/* =========================================================
   STATE
========================================================= */

let socket = null;

let localStream = null;

const myId =
  crypto.randomUUID();

const myName =
  "Vous";

const peers =
  new Map();

let unreadMessages = 0;

let chatIsOpen = false;

/* =========================================================
   WEBRTC
========================================================= */

const rtcConfig = {

  iceServers: [

    {
      urls:
        "stun:stun.l.google.com:19302"
    }

  ]

};

/* =========================================================
   DOM
========================================================= */

const videoGrid =
  document.getElementById(
    "videoGrid"
  );

const peopleCount =
  document.getElementById(
    "peopleCount"
  );

const messages =
  document.getElementById(
    "messages"
  );

const emptyChat =
  document.getElementById(
    "emptyChat"
  );

const messageInput =
  document.getElementById(
    "messageInput"
  );

const chatForm =
  document.getElementById(
    "chatForm"
  );

const chat =
  document.getElementById(
    "chat"
  );

const mobileChatButton =
  document.getElementById(
    "mobileChatButton"
  );

const unreadBadge =
  document.getElementById(
    "unreadBadge"
  );

const micButton =
  document.getElementById(
    "micButton"
  );

const cameraButton =
  document.getElementById(
    "cameraButton"
  );

const leaveButton =
  document.getElementById(
    "leaveButton"
  );

/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

  try {

    localStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            width: {
              ideal: 1280
            },
            height: {
              ideal: 720
            }
          },

          audio: true

        });

    createVideoCard(
      myId,
      myName,
      localStream,
      true
    );

  } catch(error) {

    console.error(error);

    alert(
      "Impossible d'accéder à la caméra ou au microphone."
    );

  }

}

/* =========================================================
   CREATE VIDEO CARD
========================================================= */

function createVideoCard(
  id,
  name,
  stream,
  local = false
) {

  if (
    document.getElementById(
      `card-${id}`
    )
  ) {

    return;

  }

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "video-card" +
    (
      local
        ? " local"
        : ""
    );

  card.id =
    `card-${id}`;

  const video =
    document.createElement(
      "video"
    );

  video.autoplay = true;
  video.playsInline = true;
  video.muted = local;

  if (stream) {

    video.srcObject =
      stream;

  }

  const avatar =
    document.createElement(
      "div"
    );

  avatar.className =
    "video-avatar";

  const avatarLarge =
    document.createElement(
      "div"
    );

  avatarLarge.className =
    "avatar-large";

  avatarLarge.textContent =
    name
      .charAt(0)
      .toUpperCase();

  avatar.appendChild(
    avatarLarge
  );

  const label =
    document.createElement(
      "div"
    );

  label.className =
    "user-label";

  const avatarSmall =
    document.createElement(
      "span"
    );

  avatarSmall.className =
    "user-avatar";

  avatarSmall.textContent =
    name
      .charAt(0)
      .toUpperCase();

  const username =
    document.createElement(
      "span"
    );

  username.textContent =
    name;

  const mic =
    document.createElement(
      "span"
    );

  mic.className =
    "mic-indicator";

  mic.textContent =
    "🎙️";

  label.appendChild(
    avatarSmall
  );

  label.appendChild(
    username
  );

  label.appendChild(
    mic
  );

  card.appendChild(
    video
  );

  card.appendChild(
    avatar
  );

  card.appendChild(
    label
  );

  videoGrid.appendChild(
    card
  );

  updatePeopleCount();

}

/* =========================================================
   REMOVE VIDEO
========================================================= */

function removeVideoCard(id) {

  const card =
    document.getElementById(
      `card-${id}`
    );

  if (card) {

    card.style.opacity =
      "0";

    card.style.transform =
      "scale(.96)";

    setTimeout(() => {

      card.remove();

      updatePeopleCount();

    }, 180);

  }

}

/* =========================================================
   PEOPLE COUNT
========================================================= */

function updatePeopleCount() {

  const count =
    1 + peers.size;

  peopleCount.textContent =
    count === 1
      ? "1 personne"
      : `${count} personnes`;

}

/* =========================================================
   SOCKET
========================================================= */

function connect() {

  socket =
    new WebSocket(
      SERVER_URL
    );

  socket.onopen = () => {

    console.log(
      "Connecté au serveur"
    );

    send({

      type:
        "join-room",

      roomId:
        ROOM_ID,

      name:
        myName

    });

  };

  socket.onmessage =
    async event => {

      try {

        const message =
          JSON.parse(
            event.data
          );

        await handleMessage(
          message
        );

      } catch(error) {

        console.error(
          error
        );

      }

    };

  socket.onclose = () => {

    console.log(
      "Serveur déconnecté"
    );

  };

  socket.onerror = error => {

    console.error(
      "WebSocket error",
      error
    );

  };

}

/* =========================================================
   HANDLE SERVER MESSAGE
========================================================= */

async function handleMessage(
  message
) {

  switch(message.type) {

    case "user-joined":

      if (
        message.userId ===
        myId
      ) {

        return;

      }

      if (
        message.existing
      ) {

        await createPeer(
          message.userId,
          message.name,
          true
        );

      }

      break;

    case "offer":

      await receiveOffer(
        message
      );

      break;

    case "answer":

      await receiveAnswer(
        message
      );

      break;

    case "ice-candidate":

      await receiveCandidate(
        message
      );

      break;

    case "user-left":

      removePeer(
        message.userId
      );

      break;

    case "chat":

      handleIncomingChat(
        message
      );

      break;

  }

}

/* =========================================================
   CREATE PEER
========================================================= */

async function createPeer(
  userId,
  name,
  initiator
) {

  if (
    peers.has(userId)
  ) {

    return;

  }

  const pc =
    new RTCPeerConnection(
      rtcConfig
    );

  const peer = {

    pc,

    name,

    candidates: []

  };

  peers.set(
    userId,
    peer
  );

  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => {

        pc.addTrack(
          track,
          localStream
        );

      });

  }

  pc.ontrack =
    event => {

      const stream =
        event.streams[0];

      if (!stream) {

        return;

      }

      createVideoCard(
        userId,
        name,
        stream,
        false
      );

    };

  pc.onicecandidate =
    event => {

      if (
        event.candidate
      ) {

        send({

          type:
            "ice-candidate",

          target:
            userId,

          data:
            event.candidate

        });

      }

    };

  pc.onconnectionstatechange =
    () => {

      if (
        pc.connectionState ===
        "failed"
      ) {

        removePeer(
          userId
        );

      }

    };

  if (initiator) {

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    send({

      type:
        "offer",

      target:
        userId,

      data:
        offer

    });

  }

}

/* =========================================================
   OFFER
========================================================= */

async function receiveOffer(
  message
) {

  let peer =
    peers.get(
      message.from
    );

  if (!peer) {

    await createPeer(
      message.from,
      message.name,
      false
    );

    peer =
      peers.get(
        message.from
      );

  }

  const pc =
    peer.pc;

  await pc.setRemoteDescription(
    new RTCSessionDescription(
      message.data
    )
  );

  for (
    const candidate
    of peer.candidates
  ) {

    await pc.addIceCandidate(
      new RTCIceCandidate(
        candidate
      )
    );

  }

  peer.candidates = [];

  const answer =
    await pc.createAnswer();

  await pc.setLocalDescription(
    answer
  );

  send({

    type:
      "answer",

    target:
      message.from,

    data:
      answer

  });

}

/* =========================================================
   ANSWER
========================================================= */

async function receiveAnswer(
  message
) {

  const peer =
    peers.get(
      message.from
    );

  if (!peer) {

    return;

  }

  await peer.pc
    .setRemoteDescription(
      new RTCSessionDescription(
        message.data
      )
    );

  for (
    const candidate
    of peer.candidates
  ) {

    await peer.pc
      .addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

  }

  peer.candidates = [];

}

/* =========================================================
   ICE
========================================================= */

async function receiveCandidate(
  message
) {

  const peer =
    peers.get(
      message.from
    );

  if (!peer) {

    return;

  }

  if (
    peer.pc.remoteDescription
  ) {

    try {

      await peer.pc
        .addIceCandidate(
          new RTCIceCandidate(
            message.data
          )
        );

    } catch(error) {

      console.error(
        error
      );

    }

  } else {

    peer.candidates.push(
      message.data
    );

  }

}

/* =========================================================
   REMOVE PEER
========================================================= */

function removePeer(
  userId
) {

  const peer =
    peers.get(
      userId
    );

  if (!peer) {

    return;

  }

  peer.pc.close();

  peers.delete(
    userId
  );

  removeVideoCard(
    userId
  );

  updatePeopleCount();

}

/* =========================================================
   SEND
========================================================= */

function send(data) {

  if (
    socket &&
    socket.readyState ===
      WebSocket.OPEN
  ) {

    socket.send(
      JSON.stringify(
        data
      )
    );

  }

}

/* =========================================================
   CHAT — SEND
========================================================= */

chatForm.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    const text =
      messageInput.value.trim();

    if (!text) {

      return;

    }

    send({

      type:
        "chat",

      text

    });

    messageInput.value = "";

  }
);

/* =========================================================
   CHAT — RECEIVE
========================================================= */

function handleIncomingChat(
  message
) {

  removeEmptyChat();

  const mine =
    message.userId ===
    myId;

  addMessage(
    message.name,
    message.text,
    mine
  );

  /*
   * Si le chat n'est pas ouvert,
   * on incrémente les messages non lus.
   */

  if (
    !mine &&
    !chatIsOpen
  ) {

    unreadMessages++;

    updateUnreadBadge();

    /*
     * Petit effet visuel
     */

    mobileChatButton.animate(
      [
        {
          transform:
            "scale(1)"
        },
        {
          transform:
            "scale(1.12)"
        },
        {
          transform:
            "scale(1)"
        }
      ],
      {
        duration:
          350
      }
    );

  }

}

/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
  name,
  text,
  mine
) {

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message" +
    (
      mine
        ? " mine"
        : ""
    );

  const safeName =
    escapeHtml(
      name
    );

  const safeText =
    escapeHtml(
      text
    );

  message.innerHTML = `

    <div class="message-name">
      ${safeName}
    </div>

    <div class="message-bubble">
      ${safeText}
    </div>

  `;

  messages.appendChild(
    message
  );

  messages.scrollTop =
    messages.scrollHeight;

}

/* =========================================================
   EMPTY CHAT
========================================================= */

function removeEmptyChat() {

  if (
    emptyChat
  ) {

    emptyChat.remove();

  }

}

/* =========================================================
   CHAT OPEN / CLOSE
========================================================= */

mobileChatButton.addEventListener(
  "click",
  () => {

    openChat();

  }
);

function openChat() {

  chatIsOpen =
    true;

  chat.classList.add(
    "open"
  );

  unreadMessages =
    0;

  updateUnreadBadge();

  setTimeout(
    () => {

      messageInput.focus();

    },
    300
  );

}

/*
   Sur desktop le chat est toujours visible.
   Sur mobile, on ferme en cliquant
   en dehors n'est pas nécessaire ici.
*/

/* =========================================================
   UNREAD BADGE
========================================================= */

function updateUnreadBadge() {

  if (
    unreadMessages <= 0
  ) {

    unreadBadge
      .classList
      .remove(
        "visible"
      );

    return;

  }

  unreadBadge
    .classList
    .add(
      "visible"
    );

  unreadBadge.textContent =
    unreadMessages > 99
      ? "99+"
      : unreadMessages;

}

/* =========================================================
   MICROPHONE
========================================================= */

micButton.addEventListener(
  "click",
  () => {

    if (!localStream) {

      return;

    }

    const track =
      localStream
        .getAudioTracks()[0];

    if (!track) {

      return;

    }

    track.enabled =
      !track.enabled;

    micButton
      .classList
      .toggle(
        "off",
        !track.enabled
      );

    micButton.textContent =
      track.enabled
        ? "🎙️"
        : "🔇";

  }
);

/* =========================================================
   CAMERA
========================================================= */

cameraButton.addEventListener(
  "click",
  () => {

    if (!localStream) {

      return;

    }

    const track =
      localStream
        .getVideoTracks()[0];

    if (!track) {

      return;

    }

    track.enabled =
      !track.enabled;

    cameraButton
      .classList
      .toggle(
        "off",
        !track.enabled
      );

    cameraButton.textContent =
      track.enabled
        ? "📷"
        : "🚫";

  }
);

/* =========================================================
   LEAVE
========================================================= */

leaveButton.addEventListener(
  "click",
  () => {

    send({
      type:
        "leave"
    });

    for (
      const [
        id,
        peer
      ]
      of peers
    ) {

      peer.pc.close();

    }

    peers.clear();

    if (localStream) {

      localStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }

    if (socket) {

      socket.close();

    }

    window.location.reload();

  }
);

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

/* =========================================================
   START
========================================================= */

(async function() {

  await startCamera();

  connect();

})();

</script>
