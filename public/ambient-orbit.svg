<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <radialGradient id="pink" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 150) rotate(30) scale(500 360)">
      <stop stop-color="#f0abfc" stop-opacity=".28"/><stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1370 190) rotate(150) scale(520 390)">
      <stop stop-color="#818cf8" stop-opacity=".24"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(830 850) scale(600 300)">
      <stop stop-color="#22d3ee" stop-opacity=".13"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="200" y1="800" x2="1400" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#e879f9" stop-opacity=".18"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <g filter="url(#blur)">
    <ellipse cx="260" cy="150" rx="500" ry="360" fill="url(#pink)"/>
    <ellipse cx="1370" cy="190" rx="520" ry="390" fill="url(#blue)"/>
    <ellipse cx="830" cy="850" rx="600" ry="300" fill="url(#cyan)"/>
  </g>
  <g opacity=".16" stroke="url(#arc)">
    <ellipse cx="800" cy="500" rx="290" ry="170" transform="rotate(-18 800 500)"/>
    <ellipse cx="800" cy="500" rx="430" ry="250" transform="rotate(28 800 500)"/>
    <ellipse cx="800" cy="500" rx="570" ry="330" transform="rotate(-42 800 500)"/>
    <ellipse cx="800" cy="500" rx="690" ry="410" transform="rotate(62 800 500)"/>
  </g>
  <g opacity=".55" fill="#fff">
    <circle cx="245" cy="330" r="1.5"/><circle cx="430" cy="180" r="1"/><circle cx="1220" cy="315" r="1.5"/><circle cx="1430" cy="540" r="1"/><circle cx="1050" cy="150" r="1"/><circle cx="710" cy="875" r="1.5"/><circle cx="370" cy="720" r="1"/><circle cx="1320" cy="820" r="1.2"/>
  </g>
  <circle cx="800" cy="500" r="3" fill="#f0abfc"/>
  <circle cx="800" cy="500" r="18" stroke="#e879f9" stroke-opacity=".18" filter="url(#glow)"/>
</svg>
